<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>
/* KC NOW Theme Sync */
(function(){var T={default:['#3b82f6','59,130,246','#2dd4bf'],aurora:['#2dd4bf','45,212,191','#38bdf8'],void:['#6366f1','99,102,241','#818cf8'],prism:['#a855f7','168,85,247','#f472b6'],starlight:['#818cf8','129,140,248','#c4b5fd'],sunrise:['#f59e0b','245,158,11','#f97316'],deepsea:['#06b6d4','6,182,212','#8b5cf6'],snake:['#22c55e','34,197,94','#84cc16'],bloodmoon:['#ef4444','239,68,68','#dc2626'],cyber:['#22d3ee','34,211,238','#a855f7'],golden:['#fbbf24','251,191,36','#f59e0b'],sakura:['#f472b6','244,114,182','#fb7185'],lava:['#f97316','249,115,22','#ef4444'],arctic:['#7dd3fc','125,211,252','#bae6fd'],amethyst:['#a78bfa','167,139,250','#8b5cf6'],matrix:['#22c55e','34,197,94','#4ade80'],cosmos:['#8b5cf6','139,92,246','#10b981']};try{var p=JSON.parse(localStorage.getItem('kc-background-prefs')||'{}').preset||'default';var t=T[p]||T.default;var r=document.documentElement;r.style.setProperty('--theme-accent',t[0]);r.style.setProperty('--theme-accent-rgb',t[1]);r.style.setProperty('--theme-glow',t[2]);r.style.setProperty('--accent-blue',t[0]);}catch(e){}})();

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KC Clans</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- Universal KC profile popup (after Firebase SDKs) -->
  <script src="profile-popup.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: transparent;
      color: #f8fafc;
    }
    .glass-bg {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.2);
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.10);
    }
    .profile-card {
        background: linear-gradient(135deg, rgba(30, 20, 50, 0.7), rgba(20, 30, 60, 0.7));
        overflow: hidden; /* Changed from hidden to visible to allow overlay */
        position: relative;
    }
    .profile-banner {
        width: 100%;
        height: 120px;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: white;
    }
    /* Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Modal & Alert styles */
    .modal-overlay, .kc-alert-overlay {
        animation: fadeIn 0.3s ease;
    }
    .modal-content, .kc-alert-box {
        animation: zoomIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .tab-btn.active {
      background-color: var(--theme-accent, #3b82f6);
      color: white;
    }
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(26px); }

    /* Compact switch */
    .switch-sm { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch-sm input { opacity: 0; width: 0; height: 0; }
    .slider-sm { position:absolute; cursor:pointer; inset:0; background:#9ca3af; transition:.25s; border-radius:9999px; }
    .slider-sm:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:9999px; transition:.25s; }
    .switch-sm input:checked + .slider-sm { background:#3b82f6; }
    .switch-sm input:checked + .slider-sm:before { transform: translateX(16px); }

    /* Post card styles from socialfeed */
    .post-card { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .embed-placeholder { background-color: #2d3748; border-radius: 0.5rem; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    .post-media { width: 100%; height: 100%; object-fit: cover; }
    .embed-play {
      position: absolute; font-size: 3rem; color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4); width: 60px; height: 60px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .post-card:hover .embed-play { transform: scale(1.1); }

    /* Rank Editor Styles */
    .rank-item { cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
    .rank-item.dragging { opacity: 0.5; background: #3b82f6; transform: scale(1.02); }
    .rank-item:active { cursor: grabbing; }

    /* Relationship Effects */
    @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    @keyframes shake-red { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); } 20%, 40%, 60%, 80% { transform: translateX(2px); } }
    
    .relation-card.ally { border-color: #22c55e; animation: pulse-green 2s infinite; }
    .relation-card.enemy { border-color: #ef4444; animation: shake-red 0.5s ease-in-out; }
    .relation-card.neutral { border-color: #6b7280; }

    /* ---- Collapsible profile card ---- */
    .profile-card { position: relative; overflow: visible; } /* Changed overflow */
    .profile-collapsible {
      /* collapsed by default */
      max-height: 280px;           /* Increased slightly based on content */
      transition: max-height .45s cubic-bezier(.2, .9, .25, 1);
      position: relative;
      overflow: hidden; /* Add overflow hidden here for the mask */
      /* soft fade/blur at bottom edge */
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,.7) 82%, rgba(0,0,0,0) 100%);
              mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,.7) 82%, rgba(0,0,0,0) 100%);
    }
    .profile-collapsible.blur-on { backdrop-filter: blur(0.3px); } /* tiny to trigger GPU compositing */
    .profile-collapsible.expanded {
      max-height: 1200px;          /* large enough for full card */
      overflow: visible; /* Make visible when expanded */
      -webkit-mask-image: none;
              mask-image: none;
    }
    /* Chevron toggle */
    .profile-toggle {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: 10px; z-index: 5;
      width: 36px; height: 36px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px) brightness(1.1);
      transition: transform .35s cubic-bezier(.2, .9, .25, 1), background .2s;
      cursor: pointer;
    }
    .profile-toggle:hover { background: rgba(255,255,255,.18); }
    .profile-toggle.rotate { transform: translateX(-50%) rotate(180deg); }
    /* Elastic open/close micro-animation */
    @keyframes elastic-open { 0%{transform:scaleY(.96)} 50%{transform:scaleY(1.02)} 100%{transform:scaleY(1)} }
    @keyframes elastic-close{ 0%{transform:scaleY(1.02)} 100%{transform:scaleY(1)} }
    .profile-collapsible.elastic-open { animation: elastic-open .35s ease-out; }
    .profile-collapsible.elastic-close{ animation: elastic-close .25s ease-in; }
    /* Make the expanded card overlay the buttons below */
    .profile-card.overlay-open { z-index: 20; position: relative; margin-bottom: -120px; } /* pulls card over buttons */

    /* ---- Liquid buttons ---- */
    .liquid-row { position: relative; z-index: 0; } /* below the card */
    .liquid-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .70rem 1rem; border-radius: 9999px; font-weight: 700;
      color: #fff; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08); backdrop-filter: blur(12px) saturate(1.15);
      box-shadow: 0 8px 22px rgba(0,0,0,.25), inset 0 0 0 999px var(--liquid-color, transparent);
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
      text-decoration: none; /* Ensure links look like buttons */
    }
    .liquid-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.35), inset 0 0 0 999px var(--liquid-color, transparent); }
    /* color fills (icon stays white) */
    .liquid-green  { --liquid-color: rgba(34,197,94,.30); }   /* emerald/green */
    .liquid-blue   { --liquid-color: rgba(59,130,246,.30); }  /* blue */
    .liquid-cyan   { --liquid-color: rgba(6,182,212,.30); }   /* cyan */
    .liquid-amber  { --liquid-color: rgba(0, 255, 191, 0.26); }  /* yellow/orange */
    /* icons always white */
    .liquid-btn i, .liquid-btn svg { color:#fff !important; fill:#fff !important; width:18px; height:18px; }
    
  .icon-img { width: 18px; height: 18px; object-fit: contain; display:inline-block; }
  /* keep fills subtle so buttons look liquid/glassy */
  .liquid-green {  --liquid-color: rgba(34,197,94,.26);  }
  .liquid-blue  {  --liquid-color: rgba(59,130,246,.26); }
  .liquid-cyan  {  --liquid-color: rgba(6,182,212,.26);  }
  .liquid-amber {  --liquid-color: rgba(0, 255, 191, 0.26); }

  /* --- Fire Button for Clan Battles --- */
  .liquid-fire {
      --liquid-color: rgba(255, 69, 0, 0.4);
      background: linear-gradient(135deg, rgba(255,0,0,0.2), rgba(255,100,0,0.2));
      border: 1px solid rgba(255, 80, 80, 0.5);
      animation: riseUp 3s infinite alternate ease-in-out;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
  }
  .liquid-fire:hover {
      background: linear-gradient(135deg, rgba(255,0,0,0.4), rgba(255,100,0,0.4));
      box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
      transform: translateY(-5px);
  }
  .text-glow {
      text-shadow: 0 0 5px #ff4500, 0 0 10px #ff8c00;
  }
  @keyframes riseUp {
      from { transform: translateY(0); box-shadow: 0 5px 15px rgba(255, 69, 0, 0.2); }
      to { transform: translateY(-4px); box-shadow: 0 15px 25px rgba(255, 69, 0, 0.4); }
  }
  .btn-hide-anim {
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      pointer-events: none;
      position: absolute; /* Remove from flow */
  }

  /* Click Animation */
  @keyframes clickPop {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); filter: brightness(1.2); }
      100% { transform: scale(1); }
  }
  .animate-pop {
      animation: clickPop 0.2s ease-out;
  }

  /* Leaderboard Gradients */
  .bg-gold { background: linear-gradient(135deg, #FFD700, #FFA500); color: black; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
  .bg-silver { background: linear-gradient(135deg, #E0E0E0, #B0B0B0); color: black; box-shadow: 0 4px 15px rgba(192, 192, 192, 0.3); }
  .bg-bronze { background: linear-gradient(135deg, #CD7F32, #8B4513); color: white; box-shadow: 0 4px 15px rgba(205, 127, 50, 0.3); }

/* === KC NOW Theme Sync === */
:root { --theme-accent: #3b82f6; --theme-accent-rgb: 59,130,246; --theme-glow: #2dd4bf; }
.tab-btn.active { background-color: var(--theme-accent) !important; box-shadow: 0 0 16px rgba(var(--theme-accent-rgb),0.4) !important; }
.switch-sm input:checked + .slider-sm { background: var(--theme-accent) !important; }
.rank-item.dragging { background: var(--theme-accent) !important; }
.liquid-blue { --liquid-color: rgba(var(--theme-accent-rgb),0.30) !important; }
  </style>
  <link rel="stylesheet" href="kc-bg.css"/>
  <script src="kc-bg.js" defer></script>
</head>
<body class="min-h-screen p-4 md:p-8">
<div id="bg-canvas"></div>

<div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: User Profile or Login -->
    <div id="user-profile-full" class="lg:col-span-1 glass-bg p-6 rounded-2xl profile-card">
        <!-- Profile content or Login form will be injected by JS -->
    </div>

    <!-- Right Column: Clans -->
    <div class="lg:col-span-2 space-y-8 relative">
        <!-- Add/Leave Buttons -->
        <div class="absolute top-4 right-4 z-10 flex gap-2">
            <button id="createClanBtn" class="hidden w-10 h-10 bg-green-500 hover:bg-green-600 rounded-full text-white text-2xl flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="Create Clan">+</button>
            <button id="leaveClanBtn" class="hidden w-10 h-10 bg-red-500 hover:bg-red-600 rounded-full text-white text-2xl flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="Leave Clan">-</button>
        </div>

        <!-- Biggest Clans -->
        <div id="biggest-clans-container" class="glass-bg p-6 rounded-2xl">
            <div class="flex items-center justify-between mb-4 relative">
              <!-- Compact toggle on the LEFT -->
              <div class="absolute left-0 top-1 flex items-center gap-1 text-xs bg-white/5 px-1.5 py-0.5 rounded-md">
                <span id="toggleLabel">Biggest</span>
                <label class="switch switch-sm">
                  <input id="clanToggle" type="checkbox">
                  <span class="slider slider-sm"></span>
                </label>
                <span>Top Score</span>
              </div>
              <!-- Title centered -->
              <h2 class="w-full text-center text-2xl font-bold">Clans</h2>
            </div>
            <!-- Carousel container -->
            <div class="max-w-md mx-auto">
                <div class="relative">
                    <button id="clans-prev" class="absolute -left-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white transition-opacity duration-300 opacity-70 hover:opacity-100">‹</button>
                    <div id="biggest-clans-wrapper" class="overflow-x-auto no-scrollbar scroll-smooth">
                        <div id="biggest-clans" class="flex items-start gap-4 flex-nowrap px-2">
                            <!-- Biggest clan icons will be injected by JS -->
                        </div>
                    </div>
                    <button id="clans-next" class="absolute -right-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white transition-opacity duration-300 opacity-70 hover:opacity-100">›</button>
                </div>
            </div>
        </div>


        <!-- Main Clan Display Area -->
        <div id="clan-display-area" class="glass-bg p-6 rounded-2xl min-h-[600px]">
            <!-- Content changes based on user's clan status and selection -->
        </div>
    </div>
</div>

<!-- Floating Admin Button -->
<div class="fixed bottom-8 right-8 z-40">
    <button id="adminPanelBtn" class="hidden w-14 h-14 bg-purple-500 hover:bg-purple-600 rounded-full text-white flex items-center justify-center shadow-lg transition-transform hover:scale-110 p-2" title="Admin Panel">
        <img src="https://kevinmidnight7-sudo.github.io/messageboardkc/Admin.png" alt="Admin" class="h-full w-full object-contain" />
    </button>
</div>


<!-- Modals -->
<div id="adminPasswordModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Admin Access</h2>
        <input id="adminPasswordInput" type="password" placeholder="Password" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex gap-4">
            <button id="cancelAdminPassword" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="submitAdminPassword" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
        </div>
    </div>
</div>

<div id="createClanPasswordModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Enter Password</h2>
        <input id="createClanPasswordInput" type="password" placeholder="Password" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex gap-4">
            <button id="cancelPassword" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="submitPassword" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
        </div>
    </div>
</div>

<div id="createClanModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Create a Clan</h2>
        <input id="clanNameInput" type="text" placeholder="Clan Name" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clanIconInput" type="text" placeholder="Clan Icon URL" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clanTagInput" type="text" placeholder="Letter Tag (e.g., VL)" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="clanRegionInput" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        <textarea id="clanDescInput" placeholder="Clan Description" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
        <div class="flex gap-4">
            <button id="cancelCreateClan" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirmCreateClan" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Create</button>
        </div>
    </div>
</div>

<div id="adminPanelModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-2xl p-6 rounded-2xl modal-content flex flex-col max-h-[90vh]">
        <h2 class="text-xl font-bold mb-4 text-center">Admin Panel</h2>
        <div class="flex justify-center border-b border-white/10 mb-4">
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="clans">Clans</button>
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="leaders">Leaders & Owners</button>
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="danger">Danger Zone</button>
        </div>
        <div id="adminPanelContent" class="flex-1 overflow-y-auto no-scrollbar"></div>
        <div id="adminPanelFooter" class="mt-4 space-y-2">
             <button id="endAdminSession" class="w-full bg-gray-700 hover:bg-gray-800 p-2 rounded">End Admin Session</button>
             <button id="closeAdminPanel" class="w-full bg-gray-600 hover:bg-gray-700 p-2 rounded">Close</button>
        </div>
    </div>
</div>


<!-- Post Overlay Modal -->
<div id="postOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-[70] modal-overlay flex items-center justify-center p-4">
  <div class="glass-bg max-w-lg w-full mx-auto p-4 rounded-2xl modal-content relative max-h-[90vh] flex flex-col">
    <button onclick="closePostOverlay()" class="absolute top-3 right-3 text-white z-10 bg-black/30 rounded-full w-8 h-8 flex items-center justify-center">✖</button>
    <div id="poBody" class="overflow-y-auto no-scrollbar">
        <!-- Post content will be injected here -->
    </div>
  </div>
</div>

<!-- Battle Request Modal -->
<div id="battleRequestModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-[80] modal-overlay flex items-center justify-center p-4">
  <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
      <h2 class="text-xl font-bold mb-2 text-center text-red-500 uppercase tracking-widest" style="text-shadow: 0 0 10px rgba(255,0,0,0.5)">Battle Challenge</h2>
      <p class="text-center text-sm text-gray-300 mb-4">Challenging <span id="battleTargetName" class="font-bold text-white"></span></p>

      <label class="block text-xs text-gray-400 mb-1">Server (max 18)</label>
      <input id="battleServer" maxlength="18" type="text" placeholder="e.g. NA 1" class="w-full bg-gray-700 text-white p-2 rounded mb-3 border border-gray-600 focus:border-red-500 outline-none">

      <label class="block text-xs text-gray-400 mb-1">Date & Time</label>

<script>
    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
        authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
        databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kckillerscompany-ab1ec"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- 5-min localStorage cache (shared key with kcnow.html / leaderboard.html)
    const _CL_TTL = 5 * 60 * 1000;
    function _clGet(k) { try { const r = JSON.parse(localStorage.getItem(k)||'null'); return r && Date.now()-r.ts < _CL_TTL ? r.d : null; } catch(e) { return null; } }
    function _clSet(k, d) { try { localStorage.setItem(k, JSON.stringify({d, ts:Date.now()})); } catch(e) {} }

    // ========== CONSTANTS ==========
    const ADMIN_PASSWORD = "events2025KC";
    const REGIONS = ["North America","South America","Europe","Africa","Middle East","Asia","Oceania"];
    const PAGE_SIZE = 5;

    // ========== GLOBAL CONTEXT & POST INTERACTION HELPERS ==========
    let currentPostPath = null;
    const POST_EMOJIS = ['👍','❤️','😂','😮','🔥','👎'];

    /** Escape HTML */
    function escapeHtml(str) {
        return (str || '').toString().replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
    }

    /** Truncate text */
    function truncate(str, len) {
        if (!str) return '';
        return str.length > len ? str.substring(0, len) + '...' : str;
    }

    /** Render post reactions */
    function renderPostReactions(snap, targetEl) {
        const data = snap.val() || {};
        targetEl.innerHTML = '';
        POST_EMOJIS.forEach(emo => {
            const reactors = data[emo] ? Object.keys(data[emo]) : [];
            const count = reactors.length;
            const userReacted = currentUser && data[emo] && data[emo][currentUser.uid];
            const btn = document.createElement('button');
            btn.className = `px-2 py-1 rounded-full border text-sm flex items-center gap-1 ${userReacted ? 'bg-indigo-500 text-white border-indigo-400' : 'bg-slate-600/50 text-gray-200 border-slate-500'}`;
            btn.innerHTML = `<span>${emo}</span><span>${count || ''}</span>`;
            btn.dataset.emoji = emo;
            btn.onclick = ev => {
                ev.stopPropagation();
                togglePostReaction(emo);
            };
            btn.onmouseenter = ev => {
                const rect = ev.target.getBoundingClientRect();
                const names = reactors.slice(0,25).map(uid => (allUsersData[uid]?.displayName) || 'User');
                const tip = document.getElementById('reactTip');
                if (tip) {
                    tip.textContent = names.length ? names.join('\n') : 'No reactions yet';
                    tip.style.left = (rect.left + rect.width/2) + 'px';
                    tip.style.top = (rect.top - 8) + 'px';
                    tip.classList.remove('hidden');
                }
            };
            btn.onmouseleave = () => {
                const tip = document.getElementById('reactTip');
                if(tip) tip.classList.add('hidden');
            };
            targetEl.appendChild(btn);
        });
    }

    /** Toggle post reaction */
    function togglePostReaction(emo) {
        const u = currentUser;
        if (!u) { kcAlert('Please log in to react.'); return; }
        if (!currentPostPath) return;
        const ref = db.ref(`${currentPostPath}/reactions/${emo}/${u.uid}`);
        ref.transaction(curr => curr ? null : true);
    }

    /** Render post comments */
    function renderPostComments(snap, targetEl) {
        const data = snap.val() || {};
        const comments = Object.values(data).sort((a,b) => (a.time || 0) - (b.time || 0));
        targetEl.innerHTML = '';
        comments.forEach(c => {
            const user = allUsersData[c.uid] || {};
            const hasCust = user.profileCustomization && (user.codesUnlocked?.diamond || user.codesUnlocked?.emerald);
            const nameColor = hasCust && user.profileCustomization?.nameColor ? user.profileCustomization.nameColor : '#e5e7eb';
            const dateString = c.time ? new Date(c.time).toLocaleString() : '';
            const li = document.createElement('li');
            li.className = 'space-y-1';
            li.innerHTML = `
                <div class="flex items-center gap-2">
                    ${avatarImg(getAvatarUrl(user), 'w-6 h-6 rounded-full object-cover')}
                    <span class="font-semibold text-sm" style="color:${nameColor}">${escapeHtml(user.displayName || 'Unknown')}</span>
                    <span class="text-xs text-gray-400">${dateString}</span>
                </div>
                <div class="ml-8 text-sm text-gray-300">${escapeHtml(c.text || '')}</div>
            `;
            targetEl.appendChild(li);
        });
    }

    /** Close post overlay */
    function closePostOverlay() {
        const overlay = document.getElementById('postOverlay');
        overlay.classList.add('hidden');
        document.getElementById('poBody').innerHTML = '';
        if (currentPostPath) {
            db.ref(`${currentPostPath}/reactions`).off();
            db.ref(`${currentPostPath}/comments`).off();
            currentPostPath = null;
        }
    }

    // ========== UI ELEMENTS ==========
    const userProfileFull = document.getElementById('user-profile-full');
    const biggestClansContainer = document.getElementById('biggest-clans');
    const biggestClansContainerWrapper = document.getElementById('biggest-clans-container');
    const clanDisplayArea = document.getElementById('clan-display-area');
    const createClanPasswordModal = document.getElementById('createClanPasswordModal');
    const createClanModal = document.getElementById('createClanModal');
    const adminPasswordModal = document.getElementById('adminPasswordModal');
    const adminPanelModal = document.getElementById('adminPanelModal');
    const adminPanelBtn = document.getElementById('adminPanelBtn');
    const createClanBtn = document.getElementById('createClanBtn');
    const leaveClanBtn = document.getElementById('leaveClanBtn');
    const kcAlertEl = document.getElementById('kc-alert');

    // ========== GLOBAL STATE ==========
    let allClansData = {}, allUsersData = {}, allBadgesData = {}, allAdminsData = {}, allBattlesData = {};
    let currentUser = null, selectedClanId = null;
    let activeSettingsTab = null;
    let isAdminSession = false;
    let showTopScoreClans = false;
    let allClansPage = 0;
    let selectedRegion = null;
    let originalRanksOrder = [];
    let dragSrcElement = null;

    // Clan Battles Local State
    let battlesPage = 0;
    let battlesSort = 'recent'; // 'recent' or 'players'
    let currentBattlesView = 'all'; // 'all', 'my', 'past', 'leaderboard'
    const PAGE_SIZE_BATTLES = 3;


    // ========== CUSTOM ALERT ==========
    const kcAlert = (message) => {
        document.getElementById('kc-alert-message').textContent = message;
        kcAlertEl.classList.remove('hidden');
        return new Promise(resolve => {
            document.getElementById('kc-alert-ok').onclick = () => {
                kcAlertEl.classList.add('hidden');
                resolve();
            };
        });
    };

    const kcConfirm = (message, onYes) => {
        const el = document.getElementById('kc-confirm');
        document.getElementById('kc-confirm-message').textContent = message;
        el.classList.remove('hidden');
        document.getElementById('kc-confirm-yes').onclick = () => { el.classList.add('hidden'); if (onYes) onYes(); };
        document.getElementById('kc-confirm-cancel').onclick = () => el.classList.add('hidden');
    };

    // ========== HELPERS ==========
    function formatClanDisplayName(user, clan) {
        const tag = clan && clan.letterTag ? `[${clan.letterTag}] ` : '';
        return `${tag}${(user && user.displayName) || 'Unknown'}`;
    }

    function getAvatarUrl(u){
      if(!u) return 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return u.avatar || u.photoURL || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
    }

    function avatarImg(src, cls=''){
      const safe = src || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return `<img referrerpolicy="no-referrer" src="${safe}" onerror="this.onerror=null;this.src='https://kevinmidnight7-sudo.github.io/messageboardkc/1.png'" class="${cls}">`;
    }

    // Opens the universal KC profile popup for a clan member
    function openProfileOverlay(uid) {
        window.openKcProfile(uid);
    }

    function getUserScores(uid){
      const u = allUsersData[uid] || {};
      const s = (u.stats) || {};
      const b = allBadgesData[uid] || {};
      const offence = Number(s.offence ?? b.offence ?? 0) || 0;
      const defence = Number(s.defence ?? b.defence ?? 0) || 0;
      const overall = Number(s.overall ?? b.overall ?? 0) || 0;
      return { offence, defence, overall, total: offence + defence + overall };
    }

    function computeClanScore(clan){
      if(!clan || !clan.members) return 0;
      let sum = 0;
      Object.keys(clan.members).forEach(uid => {
        sum += getUserScores(uid).total;
      });
      return sum;
    }

    // Permission helpers
    function getOwnerUid(clan){
      if (!clan) return null;
      if (typeof clan.owner === 'string') return clan.owner;
      if (clan.owner && typeof clan.owner === 'object') {
        const keys = Object.keys(clan.owner).filter(k => clan.owner[k] === true);
        return keys[0] || null;
      }
      return null;
    }
    function userIsLeader(clan, uid){
      return !!(clan && clan.leaders && clan.leaders[uid] === true);
    }
    function userIsAdmin(uid){
      return !!(isAdminSession || (allAdminsData && allAdminsData[uid] === true));
    }

    // Color generation for Clan Battles
    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      let color = '#';
      for (let i = 0; i < 3; i++) {
        let value = (hash >> (i * 8)) & 0xFF;
        // Boost brightness
        value = Math.min(255, value + 60);
        color += ('00' + value.toString(16)).substr(-2);
      }
      return color;
    }

    // Helper for Ranks
    function getRankName(clan, uid) {
        if (!clan) return 'Member';
        const orderedRanks = clan.ranks?.order || ["Owner", "Member"];
        const ownerUid = getOwnerUid(clan);
        if (uid === ownerUid) return orderedRanks[0] || 'Owner';
        const memberRank = clan.memberRanks?.[uid];
        if (memberRank && orderedRanks.includes(memberRank)) return memberRank;
        return orderedRanks[orderedRanks.length - 1] || 'Member';
    }

    function clanScoreCard(clan) {
      const total = computeClanScore(clan);
      const battlesWon = clan.battlesWon || 0; // NEW: Get battles won stat

      let gradient = 'linear-gradient(135deg, #cd7f32, #a05a26)';
      if (total >= 50) { gradient = 'linear-gradient(135deg, #ffd700, #f4a300)'; }
      else if (total >= 25) { gradient = 'linear-gradient(135deg, #c0c0c0, #8b94a5)'; }

      const memberIds = Object.keys(clan.members || {});
      const ranked = memberIds.map(uid => {
          const u = allUsersData[uid];
          if (!u) return { uid, user: { displayName: 'Loading...' }, score: 0 };
          const score = getUserScores(uid).total;
          return {uid, user: u, score};
      }).sort((a,b) => b.score - a.score).slice(0,3);

      let nextLevelMessage = 'Max level reached!';
      if (total < 25) nextLevelMessage = `${25 - total} points until Silver`;
      else if (total < 50) nextLevelMessage = `${50 - total} points until Gold`;

       return `
  <div class="clan-score-card w-64 md:w-72 rounded-xl overflow-hidden select-none"
       style="background:rgba(30,32,42,0.85); border:1px solid rgba(255,255,255,0.10); box-shadow:0 8px 24px rgba(0,0,0,.35)">
    <div class="flex items-center justify-between px-3 py-2 text-white" style="background:${gradient}">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-trophy"></i>
        <span class="text-xs uppercase tracking-wide opacity-90">Score</span>
      </div>
      <span class="font-bold text-lg tabular-nums leading-none pr-0.5">${total}</span>
    </div>
    <div class="px-3 py-2">
      <p class="text-[11px] uppercase text-gray-400 font-semibold mb-1.5 tracking-wide">Top Scorers</p>
      <div class="space-y-1.5">
        ${ranked.map((r,i) => {
          const medal = ['#ffd700','#c0c0c0','#cd7f32'][i] || '#e5e7eb';
          return `
            <div class="flex items-center gap-3 text-sm leading-tight">
              ${avatarImg(getAvatarUrl(r.user),'w-6 h-6 rounded-full object-cover')}
              <span class="truncate max-w-[160px] md:max-w-[190px]" style="color:${medal}">
                ${r.user?.displayName || 'Unknown'}
              </span>
              <span class="ml-auto font-semibold tabular-nums pr-1.5">${r.score}</span>
            </div>`;
        }).join('')}
        ${ranked.length === 0 ? '<p class="text-xs text-gray-400">No members yet.</p>' : ''}
      </div>
    </div>
    <div class="px-3 pb-2 pt-1 mt-1 border-t border-white/10 text-xs text-gray-400 flex flex-col gap-1">
      <span>${nextLevelMessage}</span>
      <span class="text-orange-400 font-bold">🔥 ${battlesWon} Clan Battles Won</span>
    </div>
  </div>`;
    }

    // ========== DATA LISTENERS ==========
    // COST: was 5x persistent .on('value') on full collections — re-downloaded ALL data
    // on every change. Switched to .once() for initial load + targeted child_changed
    // listeners for clans only (the most frequently mutated collection).
    let _clansChangeRef = null;
    function attachDataListeners() {
        // /users and /badges served from 5-min localStorage cache when available
        const cachedUsers  = _clGet('_kcUsersCache_v3');
        const cachedBadges = _clGet('_kcBadgesCache_v1');
        const usersFetch   = cachedUsers  ? Promise.resolve(null) : db.ref('users').once('value');
        const badgesFetch  = cachedBadges ? Promise.resolve(null) : db.ref('badges').once('value');
        Promise.all([
            db.ref('clans').once('value'),
            usersFetch,
            badgesFetch,
            db.ref('admins').once('value'),
            db.ref('battles').once('value'),
        ]).then(([clansSnap, usersSnap, badgesSnap, adminsSnap, battlesSnap]) => {
            allClansData   = clansSnap.val()   || {};
            if (usersSnap)  { allUsersData  = usersSnap.val()  || {}; _clSet('_kcUsersCache_v3',  allUsersData);  }
            else              allUsersData  = cachedUsers  || {};
            if (badgesSnap) { allBadgesData = badgesSnap.val() || {}; _clSet('_kcBadgesCache_v1', allBadgesData); }
            else              allBadgesData = cachedBadges || {};
            allAdminsData  = adminsSnap.val()  || {};
            allBattlesData = battlesSnap.val() || {};
            renderPage();

            // After initial load, listen for clan mutations (joins, settings changes, battles)
            // using child_changed so only the modified clan re-downloads, not the whole collection.
            if (_clansChangeRef) _clansChangeRef.off();
            _clansChangeRef = db.ref('clans');
            _clansChangeRef.on('child_changed', snap => {
                allClansData[snap.key] = snap.val();
                renderPage();
            });
            _clansChangeRef.on('child_added', snap => {
                if (!allClansData[snap.key]) { allClansData[snap.key] = snap.val(); renderPage(); }
            });
            _clansChangeRef.on('child_removed', snap => {
                delete allClansData[snap.key]; renderPage();
            });
        });
    }

    function detachDataListeners() {
        if (_clansChangeRef) { _clansChangeRef.off(); _clansChangeRef = null; }
    }

    // Call to force a full data refresh (e.g. after creating/deleting a clan)
    function refreshAllData() {
        detachDataListeners();
        attachDataListeners();
    }


    // ========== RENDER LOGIC ==========
    function renderPage() {
        if (!document.body) return;
        if (!currentUser) {
            renderLoginView();
            return;
        }

        adminPanelBtn.classList.remove('hidden');
        createClanBtn.classList.remove('hidden');
        biggestClansContainerWrapper.classList.remove('hidden');

        renderFullUserProfile();
        renderBiggestClans();

        if (selectedClanId && allClansData[selectedClanId]) {
             if (activeSettingsTab) {
                renderClanSettingsContent(selectedClanId, activeSettingsTab);
            } else {
                renderClanDisplayArea();
            }
        } else {
            const userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[currentUser.uid]);
            if(userClanId) {
                selectClan(userClanId, true);
            } else {
                renderClanHub();
            }
        }
    }

    function renderFullUserProfile() {
        const loggedInUserId = currentUser.uid;
        const user = allUsersData[loggedInUserId];
        const badges = allBadgesData[loggedInUserId] || {};

        if (!user) {
            userProfileFull.innerHTML = `<div class="text-white">Loading profile...</div>`;
            return;
        }

        const profileCustom = user.profileCustomization || {};

        let userClanDisplay = "Not in a clan";
        let userClanIcon = null;
        let userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[loggedInUserId]);

        if(userClanId){
            const clan = allClansData[userClanId];
            userClanIcon = clan.icon;
            const clanName = clan.name;
            const rankName = getRankName(clan, loggedInUserId);
            userClanDisplay = `${clanName} | ${rankName}`;
        }

        let badgesHtml = '';
        if (badges.verified || user.emailVerified) badgesHtml += `<div class="badge" style="background: #2dd4bf;">✔️ Verified</div>`;
        if (badges.offence > 0) badgesHtml += `<div class="badge" style="background: #ff6b6b;">🔥 Best Offence x${badges.offence}</div>`;
        if (badges.defence > 0) badgesHtml += `<div class="badge" style="background: #74c0fc;">🛡️ Best Defence x${badges.defence}</div>`;
        if (badges.diamond) badgesHtml += `<div class="badge" style="background: #55d9e5;">💎 Diamond User</div>`;
        if(user.customBadges){

    function renderBiggestClans(){
      try{
        const entries = Object.entries(allClansData).map(([id, clan]) => {
          const memberCount = clan.members ? Object.keys(clan.members).length : 0;
          const score = computeClanScore(clan);
          return { id, ...clan, memberCount, score };
        });

        const sorted = showTopScoreClans
          ? entries.sort((a,b) => b.score - a.score)
          : entries.sort((a,b) => b.memberCount - a.memberCount);

        const top = sorted.slice(0, 20);
        biggestClansContainer.innerHTML = top.map(clan => `
          <div class="flex flex-col items-center text-center cursor-pointer w-24 flex-shrink-0" onclick="selectClan('${clan.id}')">

            <p class="font-semibold text-sm truncate w-full">${clan.name}</p>
            <p class="text-xs text-gray-400">
              ${showTopScoreClans ? ('Score: ' + clan.score) : (clan.memberCount + ' members')}
            </p>
          </div>
        `).join('') || '<p class="text-gray-400">No clans yet.</p>';
      } catch(e){
        console.error('Failed to render clans:', e);
        biggestClansContainer.innerHTML = '<p class="text-gray-400">Could not load clans.</p>';
      }
    }

    // Drag Helper
    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.rank-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    window.addNewRank = (id) => {
        const name = document.getElementById('newRankName').value.trim();
        if(!name) return;
        const clan = allClansData[id];
        const ranks = [...(clan.ranks?.order || ['Owner', 'Member'])];
        if(!ranks.includes(name)) {
            // Insert before the last one (Member usually) to keep Member at bottom, or just append
            ranks.splice(ranks.length - 1, 0, name);
            db.ref(`clans/${id}/ranks/order`).set(ranks).then(()=>renderClanSettingsContent(id, 'ranks'));
        }
    };

    window.deleteRank = (id, rankName) => {
        const clan = allClansData[id];
        const ranks = (clan.ranks?.order || []).filter(r => r !== rankName);
        db.ref(`clans/${id}/ranks/order`).set(ranks).then(()=>renderClanSettingsContent(id, 'ranks'));
    };

    window.saveRanks = (id) => {
        const list = document.getElementById('ranksList');
        const newOrder = [];
        list.querySelectorAll('.rank-item').forEach(item => {
            newOrder.push(item.querySelector('span').innerText.replace('(Cannot move/delete)', '').trim());
        });
        db.ref(`clans/${id}/ranks/order`).set(newOrder).then(() => kcAlert("Ranks Saved!"));
    };

    window.setRelation = (myId, targetId, type) => {
        const updates = {};
        if (type === 'ally') {
            updates[`clans/${myId}/allies/${targetId}`] = true;
            updates[`clans/${myId}/enemies/${targetId}`] = null;
        } else if (type === 'enemy') {
            updates[`clans/${myId}/enemies/${targetId}`] = true;
            updates[`clans/${myId}/allies/${targetId}`] = null;
        } else {
            updates[`clans/${myId}/allies/${targetId}`] = null;
            updates[`clans/${myId}/enemies/${targetId}`] = null;
        }
        db.ref().update(updates).then(() => renderClanSettingsContent(myId, 'connections'));
    };

        const updates = {
            name: document.getElementById('editClanName').value,
            letterTag: document.getElementById('editClanTag').value,
            icon: document.getElementById('editClanIcon').value,
            description: document.getElementById('editClanDesc').value,

    function renderAllClansList(filter = '') {
        const listEl = document.getElementById('allClansList');
        const paginationEl = document.getElementById('paginationControls');
        if (!listEl || !paginationEl) return;
        const lowerFilter = filter.toLowerCase();
        const entries = Object.entries(allClansData)
            .filter(([id, c]) => c.name?.toLowerCase().includes(lowerFilter))
            .filter(([id, c]) => !selectedRegion || c.region === selectedRegion)
            .sort((a,b) => a[1].name.localeCompare(b[1].name));
        const total = entries.length;
        const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
        allClansPage = Math.min(allClansPage, maxPage);
        allClansPage = Math.max(0, allClansPage);
        const pageSlice = entries.slice(allClansPage * PAGE_SIZE, (allClansPage * PAGE_SIZE) + PAGE_SIZE);

        if (total === 0) {
            listEl.innerHTML = `<p class="text-center text-gray-400 py-16">No clans found.</p>`;
        } else {
            listEl.innerHTML = pageSlice.map(([id, clan]) => {
                const btnClass = clan.isOpen ? 'bg-blue-500 hover:bg-blue-600' : 'bg-green-500 hover:bg-green-600';
                const btnText = clan.isOpen ? 'Join' : 'Request to Join';
                const memberCount = clan.members ? Object.keys(clan.members).length : 0;
                return `
                <div class="flex items-start p-3 rounded-xl bg-white/5 hover:bg-white/10 transition cursor-pointer" onclick="selectClan('${id}')">
                    ${avatarImg(clan.icon, 'w-16 h-16 rounded-lg mr-4 object-contain')}
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center">
                        <span class="font-bold text-lg truncate">${escapeHtml(clan.name)}</span>
                        <span class="ml-2 px-2 py-0.5 text-xs rounded-full bg-white/10 border border-white/10 flex-shrink-0">${escapeHtml(clan.letterTag || '')}</span>
                      </div>
                      <p class="text-sm text-gray-300 mt-1 mb-2 truncate">${truncate(escapeHtml(clan.description), 160)}</p>
                      <div class="flex items-center justify-between">
                          <p class="text-sm text-gray-400">${memberCount} members</p>
                          <button onclick="event.stopPropagation(); joinOrRequestToJoinClan('${id}')" class="${btnClass} text-white font-bold py-1.5 px-4 rounded-full transition-transform transform hover:scale-105 text-sm flex-shrink-0">${btnText}</button>
                      </div>
                    </div>
                </div>
            `}).join('');
        }
        paginationEl.innerHTML = `
          <button id="prevPageBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-lg transition" ${allClansPage === 0 ? 'disabled' : ''}>← Prev</button>
          <span class="text-gray-300">${total > 0 ? `Page ${allClansPage + 1} of ${maxPage + 1}` : 'No results'}</span>
          <button id="nextPageBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-lg transition" ${allClansPage === maxPage || total === 0 ? 'disabled' : ''}>Next →</button>
        `;
        document.getElementById('prevPageBtn').onclick = () => { if(allClansPage > 0) { allClansPage--; renderAllClansList(filter); }};
        document.getElementById('nextPageBtn').onclick = () => { if(allClansPage < maxPage) { allClansPage++; renderAllClansList(filter); }};
    }

    // ========== CLAN BATTLE FUNCTIONS ==========

    window.openBattleRequestModal = (targetClanId) => {
        const target = allClansData[targetClanId];
        document.getElementById('battleTargetName').textContent = target.name;
        document.getElementById('battleRequestModal').classList.remove('hidden');
        
        document.getElementById('sendBattleBtn').onclick = () => {
             const server = document.getElementById('battleServer').value.trim();
             const dateTimeVal = document.getElementById('battleDateTime').value;
             const rules = document.getElementById('battleRules').value.trim();
             
             if(!server || !dateTimeVal || !rules) return kcAlert("Please fill all fields.");
             
             // Check if date is future
             const scheduledTime = new Date(dateTimeVal).getTime();
             if(scheduledTime < Date.now()) return kcAlert("Must schedule for future.");

             // Get current user's clan ID (Challenger)
             const challengerId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[currentUser.uid]);
             
             if(!challengerId) return kcAlert("You must be in a clan to challenge.");
             
             const battleData = {
                 challengerId: challengerId,
                 targetId: targetClanId,
                 server: server,
                 scheduledTime: scheduledTime,
                 time: new Date(scheduledTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), // Legacy display
                 rules: rules,
                 status: 'pending',
                 createdAt: firebase.database.ServerValue.TIMESTAMP
             };
             
             db.ref('battles').push(battleData).then(() => {
                 document.getElementById('battleRequestModal').classList.add('hidden');
                 kcAlert("Challenge Sent!");
                 renderClanDisplayArea(); // Refresh to show pending state
             });
        };
    };

    window.respondToBattle = (battleId, accept) => {
        if(accept) {
            db.ref(`battles/${battleId}`).update({ status: 'accepted' }).then(() => {
                kcAlert("Battle Accepted!");
                renderClanDisplayArea();
            });

            db.ref(`battles/${battleId}`).remove().then(() => {
                kcAlert("Battle Declined.");

            });

    };

    function renderBattlesList() {
        const container = document.getElementById('battlesListContent');
        const titleEl = document.getElementById('battlesModalTitle');
        const paginationEl = document.getElementById('battlesPagination');
        
        if(currentBattlesView === 'leaderboard') {
            titleEl.textContent = "Clan Leaderboard";
            titleEl.className = "text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600";
            renderLeaderboard(container);
            paginationEl.classList.add('hidden');
            return;
        }

        // --- Theme Switching ---
        if(currentBattlesView === 'past') {
            titleEl.textContent = "Clan Battles";
            titleEl.className = "text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-200 to-white";
        } else {
            titleEl.textContent = "Upcoming Clan Battles";
            titleEl.className = "text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-600";
        }

        const battles = Object.entries(allBattlesData);
        let filtered = [];

        let userClanId = null;
        if(currentUser) userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[currentUser.uid]);

        // Filter Logic
        if (currentBattlesView === 'past') {
            filtered = battles.filter(([id, b]) => b.status === 'finished');
        } else {
            // Upcoming
            filtered = battles.filter(([id, b]) => b.status === 'accepted');
            if (currentBattlesView === 'my') {
                filtered = filtered.filter(([id, b]) => b.challengerId === userClanId || b.targetId === userClanId);
            }
        }

        // Sorting Logic
        if(battlesSort === 'players') {
            filtered.sort((a,b) => {
                const lenA = Object.keys(a[1].participants||{}).length;
                const lenB = Object.keys(b[1].participants||{}).length;
                return lenB - lenA; // Most players first
            });
        } else {
            // Recent (Added) - Default to CreatedAt descending (newest added first)
            filtered.sort((a,b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
        }

        const totalBattles = filtered.length;
        const maxPage = Math.max(0, Math.ceil(totalBattles / PAGE_SIZE_BATTLES) - 1);
        battlesPage = Math.min(battlesPage, maxPage);
        const paginated = filtered.slice(battlesPage * PAGE_SIZE_BATTLES, (battlesPage * PAGE_SIZE_BATTLES) + PAGE_SIZE_BATTLES);

        if (totalBattles === 0) {
            container.innerHTML = `<p class="text-gray-400 text-center py-8">No battles found.</p>`;
            paginationEl.classList.add('hidden');
            return;
        }

        container.innerHTML = paginated.map(([bid, b]) => {
            const c1 = allClansData[b.challengerId] || {name: 'Unknown', icon: ''};
            const c2 = allClansData[b.targetId] || {name: 'Unknown', icon: ''};
            
            // Determine Participants
            const parts = b.participants || {};
            const pList = Object.keys(parts).map(uid => {
                const u = allUsersData[uid];
                if(!u) return null;
                const clanColor = stringToColor(parts[uid]); 
                return `<div class="relative w-8 h-8 rounded-full border-2" style="border-color:${clanColor}" title="${u.displayName}">
                    <img src="${getAvatarUrl(u)}" class="w-full h-full rounded-full object-cover">
                </div>`;
            }).filter(Boolean).join('');

            // Format Date
            const battleDate = new Date(b.scheduledTime);
            const dateStr = battleDate.toLocaleDateString();
            const timeStr = battleDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // --- Action Section (Winner or Buttons) ---
            let actionHtml = '';
            
            if (currentBattlesView === 'past') {
                const winner = allClansData[b.winnerId];
                if (winner) {
                    actionHtml = `
                        <div class="flex items-center gap-2 bg-black/30 px-3 py-1 rounded-full border border-yellow-500/30">
                            <span class="text-xs text-yellow-400 font-bold uppercase">Winner:</span>
                            ${avatarImg(winner.icon, 'w-6 h-6 rounded object-contain')}
                            <span class="text-sm font-bold text-white">${escapeHtml(winner.name)}</span>
                        </div>
                    `;
                } else {
                    actionHtml = `<span class="text-xs text-gray-500 italic">No winner recorded</span>`;
                }
            } else {
                // Upcoming Logic (Join/Leave/Finish/Delete)
                const inInvolvedClan = userClanId && (b.challengerId === userClanId || b.targetId === userClanId);
                const alreadyJoined = parts[currentUser?.uid];
                
                let btns = '';

                // Join / Leave Logic
                if (inInvolvedClan) {
                    if (alreadyJoined) {
                         btns += `<button onclick="handleBattleClick(this, () => leaveBattle('${bid}'))" class="bg-red-500/20 hover:bg-red-500/40 text-red-200 border border-red-500/30 text-xs px-3 py-1 rounded ml-2 transition-all active:scale-95">Leave</button>`;
                    } else {
                         btns += `<button onclick="handleBattleClick(this, () => joinBattle('${bid}', '${userClanId}'))" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded ml-auto transition-all active:scale-95">Join</button>`;
                    }
                }

                const isOwner1 = getOwnerUid(c1) === currentUser?.uid;
                const isOwner2 = getOwnerUid(c2) === currentUser?.uid;
                const isOwnerInvolved = isOwner1 || isOwner2;

                if (isOwnerInvolved) {
                    btns += `<button onclick="openFinishBattleModal('${bid}', '${b.challengerId}', '${b.targetId}')" class="text-xs text-orange-400 hover:text-orange-300 underline ml-2">Finish</button>`;
                    // Delete Button
                    btns += `<button onclick="deleteBattle('${bid}')" class="text-gray-500 hover:text-red-500 ml-2" title="Delete Battle"><i class="fa-solid fa-trash"></i></button>`;
                }
                
                actionHtml = `<div class="flex items-center ml-auto">${btns}</div>`;
            }

            return `
            <div class="bg-white/5 p-4 rounded-xl border border-white/10 hover:bg-white/10 transition-colors">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-lg text-white truncate max-w-[100px] sm:max-w-none">${escapeHtml(c1.name)}</span>
                        <span class="text-red-500 font-bold text-xl">VS</span>
                        <span class="font-bold text-lg text-white truncate max-w-[100px] sm:max-w-none">${escapeHtml(c2.name)}</span>
                        <button onclick="document.getElementById('details-${bid}').classList.toggle('hidden')" class="text-gray-400 hover:text-white ml-2"><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                    ${actionHtml}
                </div>
                
                <div id="details-${bid}" class="hidden bg-black/20 p-2 rounded mb-3 text-sm text-gray-300">
                    <p><span class="text-gray-500">Server:</span> ${escapeHtml(b.server)}</p>
                    <p><span class="text-gray-500">Date:</span> ${dateStr} at ${timeStr}</p>
                    <p><span class="text-gray-500">Rules:</span> ${escapeHtml(b.rules)}</p>
                </div>

                <div class="flex items-center gap-[-8px]">
                    ${pList || '<span class="text-gray-500 text-xs italic">0 Joined</span>'}
                </div>
            </div>`;
        }).join('');

        // Pagination Controls Rendering
        if (totalBattles > PAGE_SIZE_BATTLES) {
             paginationEl.classList.remove('hidden');
             const prev = document.getElementById('battlesPrev');
             const next = document.getElementById('battlesNext');
             const info = document.getElementById('battlesPageInfo');
             
             info.textContent = `Page ${battlesPage + 1} of ${maxPage + 1}`;
             prev.disabled = battlesPage === 0;
             next.disabled = battlesPage === maxPage;
             
             prev.classList.toggle('opacity-50', battlesPage === 0);
             next.classList.toggle('opacity-50', battlesPage === maxPage);

             prev.onclick = () => { if(battlesPage > 0) { battlesPage--; renderBattlesList(); } };
             next.onclick = () => { if(battlesPage < maxPage) { battlesPage++; renderBattlesList(); } };
        } else {
             paginationEl.classList.add('hidden');
        }
    }

    function renderLeaderboard(container) {
        const sortedClans = Object.entries(allClansData)
            .map(([id, c]) => ({id, ...c, wins: c.battlesWon || 0}))
            .sort((a,b) => b.wins - a.wins)
            .slice(0, 3); // Top 3
            
        if(sortedClans.length === 0) {
            container.innerHTML = `<p class="text-gray-400 text-center py-8">No clans found.</p>`;
            return;
        }
        
        container.innerHTML = sortedClans.map((c, index) => {
            let bgClass = '';
            let medal = '';
            if(index === 0) { bgClass = 'bg-gold'; medal = '🥇'; }
            else if(index === 1) { bgClass = 'bg-silver'; medal = '🥈'; }
            else if(index === 2) { bgClass = 'bg-bronze'; medal = '🥉'; }
            
            return `
            <div class="${bgClass} p-4 rounded-xl flex items-center justify-between mb-3 transform hover:scale-[1.02] transition-transform">
                <div class="flex items-center gap-4">
                    <span class="text-2xl font-bold">${medal}</span>
                    ${avatarImg(c.icon, 'w-12 h-12 rounded-full object-contain bg-black/20')}
                    <div>
                        <h3 class="font-bold text-lg leading-tight">${escapeHtml(c.name)}</h3>
                        <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Rank #${index + 1}</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-bold">${c.wins}</p>
                    <p class="text-xs opacity-80 uppercase">Wins</p>
                </div>
            </div>`;
        }).join('');
    }

    document.getElementById('submitPassword').onclick = () => { if(document.getElementById('createClanPasswordInput').value === 'C1anR3p') { createClanPasswordModal.classList.add('hidden'); createClanModal.classList.remove('hidden'); } else kcAlert('Wrong Password'); };
    document.getElementById('confirmCreateClan').onclick = () => {
        const n = document.getElementById('clanNameInput').value, t = document.getElementById('clanTagInput').value;
        if(!n || !t) return kcAlert("Fill all fields");
        const id = n.toLowerCase().replace(/[^a-z0-9]/g, '_');
        db.ref('clans/'+id).set({name:n, letterTag:t, icon: document.getElementById('clanIconInput').value, description: document.getElementById('clanDescInput').value, region: document.getElementById('clanRegionInput').value, owner:currentUser.uid, members:{[currentUser.uid]:true}, leaders:{[currentUser.uid]:true}, ranks:{order:['Owner','Member']}, memberRanks:{[currentUser.uid]:'Owner'}, createdAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{createClanModal.classList.add('hidden'); selectClan(id);});
    };
    window.selectClan = (id) => { selectedClanId = id; activeSettingsTab = null; renderClanDisplayArea(); };
    window.clearSelectedClan = () => { selectedClanId = null; renderClanHub(); };
    window.joinOrRequestToJoinClan = (id) => { /* Same as before logic */ 
        if(!currentUser) return kcAlert("Log in first");
        if(Object.keys(allClansData).some(cid=>allClansData[cid].members?.[currentUser.uid])) return kcAlert("Already in a clan");
        const c = allClansData[id];
        if(c.isOpen) db.ref(`clans/${id}/members/${currentUser.uid}`).set(true).then(()=>kcAlert("Joined!"));
        else db.ref(`clans/${id}/requests/${currentUser.uid}`).set(true).then(()=>kcAlert("Request Sent"));
    };
    window.leaveClan = (id) => {
        if(!currentUser) return;
        if(getOwnerUid(allClansData[id]) === currentUser.uid && Object.keys(allClansData[id].members).length > 1) return kcAlert("Owner cannot leave.");
        if(getOwnerUid(allClansData[id]) === currentUser.uid) db.ref('clans/'+id).remove();
        else { db.ref(`clans/${id}/members/${currentUser.uid}`).remove(); db.ref(`clans/${id}/memberRanks/${currentUser.uid}`).remove(); }
        clearSelectedClan();
    };

</script>
</body>
</html>
