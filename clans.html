<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KC Clans</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://kevinmidnight7-sudo.github.io/messageboardkc/silver.png') center/cover fixed;
      color: #e5e7eb;
    }
    .glass-bg {
      background: rgba(30,32,42,0.78);
      backdrop-filter: blur(20px) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) brightness(1.1);
      box-shadow: 0 10px 48px 0 #10152044, 0 2px 8px #5a668133;
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.10);
    }
    .profile-card {
        background: linear-gradient(135deg, rgba(30, 20, 50, 0.7), rgba(20, 30, 60, 0.7));
        overflow: hidden;
        position: relative;
    }
    .profile-banner {
        width: 100%;
        height: 120px;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: white;
    }
    /* Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Modal & Alert styles */
    .modal-overlay, .kc-alert-overlay {
        animation: fadeIn 0.3s ease;
    }
    .modal-content, .kc-alert-box {
        animation: zoomIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .tab-btn.active {
      background-color: #3b82f6;
      color: white;
    }
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(26px); }

    /* Compact switch */
    .switch-sm { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch-sm input { opacity: 0; width: 0; height: 0; }
    .slider-sm { position:absolute; cursor:pointer; inset:0; background:#9ca3af; transition:.25s; border-radius:9999px; }
    .slider-sm:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:9999px; transition:.25s; }
    .switch-sm input:checked + .slider-sm { background:#3b82f6; }
    .switch-sm input:checked + .slider-sm:before { transform: translateX(16px); }
    
    /* Post card styles from socialfeed */
    .post-card { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .embed-placeholder { background-color: #2d3748; border-radius: 0.5rem; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    .post-media { width: 100%; height: 100%; object-fit: cover; }
    .embed-play {
      position: absolute; font-size: 3rem; color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4); width: 60px; height: 60px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .post-card:hover .embed-play { transform: scale(1.1); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: User Profile or Login -->
    <div id="user-profile-full" class="lg:col-span-1 glass-bg p-6 rounded-2xl profile-card flex flex-col items-center text-center">
        <!-- Profile content or Login form will be injected by JS -->
    </div>

    <!-- Right Column: Clans -->
    <div class="lg:col-span-2 space-y-8 relative">
        <!-- Add/Leave Buttons -->
        <div class="absolute top-4 right-4 z-10 flex gap-2">
            <button id="createClanBtn" class="hidden w-10 h-10 bg-green-500 hover:bg-green-600 rounded-full text-white text-2xl flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="Create Clan">+</button>
            <button id="leaveClanBtn" class="hidden w-10 h-10 bg-red-500 hover:bg-red-600 rounded-full text-white text-2xl flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="Leave Clan">-</button>
        </div>

        <!-- Biggest Clans -->
        <div id="biggest-clans-container" class="glass-bg p-6 rounded-2xl">
            <div class="flex items-center justify-between mb-4 relative">
              <!-- Compact toggle on the LEFT -->
              <div class="absolute left-0 top-1 flex items-center gap-1 text-xs bg-white/5 px-1.5 py-0.5 rounded-md">
                <span id="toggleLabel">Biggest</span>
                <label class="switch switch-sm">
                  <input id="clanToggle" type="checkbox">
                  <span class="slider slider-sm"></span>
                </label>
                <span>Top Score</span>
              </div>
              <!-- Title centered -->
              <h2 class="w-full text-center text-2xl font-bold">Clans</h2>
            </div>
            <!-- Carousel container -->
            <div class="max-w-md mx-auto">
                <div class="relative">
                    <button id="clans-prev" class="absolute -left-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white transition-opacity duration-300 opacity-70 hover:opacity-100">‹</button>
                    <div id="biggest-clans-wrapper" class="overflow-x-auto no-scrollbar scroll-smooth">
                        <div id="biggest-clans" class="flex items-start gap-4 flex-nowrap px-2">
                            <!-- Biggest clan icons will be injected by JS -->
                        </div>
                    </div>
                    <button id="clans-next" class="absolute -right-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white transition-opacity duration-300 opacity-70 hover:opacity-100">›</button>
                </div>
            </div>
        </div>


        <!-- Main Clan Display Area -->
        <div id="clan-display-area" class="glass-bg p-6 rounded-2xl min-h-[400px]">
            <!-- Content changes based on user's clan status and selection -->
        </div>
    </div>
</div>

<!-- Floating Admin Button -->
<div class="fixed bottom-8 right-8 z-40">
    <button id="adminPanelBtn" class="hidden w-14 h-14 bg-purple-500 hover:bg-purple-600 rounded-full text-white text-2xl flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="Admin Panel">A</button>
</div>


<!-- Modals -->
<div id="adminPasswordModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Admin Access</h2>
        <input id="adminPasswordInput" type="password" placeholder="Password" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex gap-4">
            <button id="cancelAdminPassword" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="submitAdminPassword" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
        </div>
    </div>
</div>

<div id="createClanPasswordModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Enter Password</h2>
        <input id="createClanPasswordInput" type="password" placeholder="Password" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex gap-4">
            <button id="cancelPassword" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="submitPassword" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Submit</button>
        </div>
    </div>
</div>

<div id="createClanModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-sm p-6 rounded-2xl modal-content">
        <h2 class="text-xl font-bold mb-4 text-center">Create a Clan</h2>
        <input id="clanNameInput" type="text" placeholder="Clan Name" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clanIconInput" type="text" placeholder="Clan Icon URL" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clanTagInput" type="text" placeholder="Letter Tag (e.g., VL)" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="clanRegionInput" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-2 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        <textarea id="clanDescInput" placeholder="Clan Description" class="w-full bg-gray-700 text-white p-3 rounded-lg mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
        <div class="flex gap-4">
            <button id="cancelCreateClan" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirmCreateClan" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Create</button>
        </div>
    </div>
</div>

<div id="adminPanelModal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="glass-bg w-full max-w-2xl p-6 rounded-2xl modal-content flex flex-col max-h-[90vh]">
        <h2 class="text-xl font-bold mb-4 text-center">Admin Panel</h2>
        <div class="flex justify-center border-b border-white/10 mb-4">
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="clans">Clans</button>
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="leaders">Leaders & Owners</button>
            <button class="admin-tab-btn tab-btn p-2 flex-1" data-tab="danger">Danger Zone</button>
        </div>
        <div id="adminPanelContent" class="flex-1 overflow-y-auto no-scrollbar"></div>
        <div id="adminPanelFooter" class="mt-4 space-y-2">
             <button id="endAdminSession" class="w-full bg-gray-700 hover:bg-gray-800 p-2 rounded">End Admin Session</button>
             <button id="closeAdminPanel" class="w-full bg-gray-600 hover:bg-gray-700 p-2 rounded">Close</button>
        </div>
    </div>
</div>

<!-- Profile Overlay Modal -->
<div id="profileOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[60] modal-overlay">
  <div class="glass-bg max-w-lg w-[94%] mx-auto mt-10 p-6 rounded-2xl modal-content relative">
    <button onclick="document.getElementById('profileOverlay').classList.add('hidden')" class="absolute top-3 right-3 text-white">✖</button>
    <div id="profileOverlayBody"></div>
  </div>
</div>

<!-- Post Overlay Modal (replaces clipOverlay) -->
<div id="postOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden z-[70] modal-overlay flex items-center justify-center p-4">
  <div class="glass-bg max-w-lg w-full mx-auto p-4 rounded-2xl modal-content relative max-h-[90vh] flex flex-col">
    <button onclick="closePostOverlay()" class="absolute top-3 right-3 text-white z-10 bg-black/30 rounded-full w-8 h-8 flex items-center justify-center">✖</button>
    <div id="poBody" class="overflow-y-auto no-scrollbar">
        <!-- Post content will be injected here -->
    </div>
  </div>
</div>

<!-- Custom Alert -->
<div id="kc-alert" class="kc-alert-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-[100]">
    <div class="kc-alert-box glass-bg p-6 rounded-2xl max-w-sm w-full text-center">
        <p id="kc-alert-message" class="mb-4"></p>
        <button id="kc-alert-ok" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">OK</button>
    </div>
</div>

<!-- Tooltip for reaction names -->
<div id="reactTip" class="hidden fixed px-3 py-2 rounded-lg text-xs text-white bg-gray-700 shadow z-[100] whitespace-pre pointer-events-none"></div>

<script>
    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
        authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
        databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kckillerscompany-ab1ec"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    // ========== CONSTANTS ==========
    const ADMIN_PASSWORD = "events2025KC";
    const REGIONS = ["North America","South America","Europe","Africa","Middle East","Asia","Oceania"];

    // ========== GLOBAL CONTEXT & POST INTERACTION HELPERS ==========
    // Track the currently opened post's database path for reactions/comments observers
    let currentPostPath = null;
    // Define available post reactions consistent with the social feed
    const POST_EMOJIS = ['👍','❤️','😂','😮','🔥','👎'];

    /** Escape HTML to prevent injection */
    function escapeHtml(str) {
        return (str || '').toString().replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
    }

    /** Render the reaction buttons for a post. Updates dynamically when reactions change */
    function renderPostReactions(snap, targetEl) {
        const data = snap.val() || {};
        targetEl.innerHTML = '';
        POST_EMOJIS.forEach(emo => {
            const reactors = data[emo] ? Object.keys(data[emo]) : [];
            const count = reactors.length;
            const userReacted = currentUser && data[emo] && data[emo][currentUser.uid];
            const btn = document.createElement('button');
            btn.className = `px-2 py-1 rounded-full border text-sm flex items-center gap-1 ${userReacted ? 'bg-indigo-500 text-white border-indigo-400' : 'bg-slate-600/50 text-gray-200 border-slate-500'}`;
            btn.innerHTML = `<span>${emo}</span><span>${count || ''}</span>`;
            btn.dataset.emoji = emo;
            btn.onclick = ev => {
                ev.stopPropagation();
                togglePostReaction(emo);
            };
            // simple tooltip showing reactor names on hover
            btn.onmouseenter = ev => {
                const rect = ev.target.getBoundingClientRect();
                const names = reactors.slice(0,25).map(uid => (allUsersData[uid]?.displayName) || 'User');
                const tip = document.getElementById('reactTip');
                if (tip) {
                    tip.textContent = names.length ? names.join('\n') : 'No reactions yet';
                    tip.style.left = (rect.left + rect.width/2) + 'px';
                    tip.style.top = (rect.top - 8) + 'px';
                    tip.classList.remove('hidden');
                }
            };
            btn.onmouseleave = () => {
                const tip = document.getElementById('reactTip');
                if(tip) tip.classList.add('hidden');
            };
            targetEl.appendChild(btn);
        });
    }

    /** Toggle a reaction on/off for the currently open post */
    function togglePostReaction(emo) {
        const u = currentUser;
        if (!u) { kcAlert('Please log in to react.'); return; }
        if (!currentPostPath) return;
        const ref = db.ref(`${currentPostPath}/reactions/${emo}/${u.uid}`);
        ref.transaction(curr => curr ? null : true);
    }

    /** Render comments for a post */
    function renderPostComments(snap, targetEl) {
        const data = snap.val() || {};
        // Sort comments chronologically
        const comments = Object.values(data).sort((a,b) => (a.time || 0) - (b.time || 0));
        targetEl.innerHTML = '';
        comments.forEach(c => {
            const user = allUsersData[c.uid] || {};
            const hasCust = user.profileCustomization && (user.codesUnlocked?.diamond || user.codesUnlocked?.emerald);
            const nameColor = hasCust && user.profileCustomization?.nameColor ? user.profileCustomization.nameColor : '#e5e7eb';
            const dateString = c.time ? new Date(c.time).toLocaleString() : '';
            const li = document.createElement('li');
            li.className = 'space-y-1';
            li.innerHTML = `
                <div class="flex items-center gap-2">
                    ${avatarImg(getAvatarUrl(user), 'w-6 h-6 rounded-full object-cover')}
                    <span class="font-semibold text-sm" style="color:${nameColor}">${escapeHtml(user.displayName || 'Unknown')}</span>
                    <span class="text-xs text-gray-400">${dateString}</span>
                </div>
                <div class="ml-8 text-sm text-gray-300">${escapeHtml(c.text || '')}</div>
            `;
            targetEl.appendChild(li);
        });
    }

    /** Close the post overlay and detach realtime listeners */
    function closePostOverlay() {
        const overlay = document.getElementById('postOverlay');
        overlay.classList.add('hidden');
        document.getElementById('poBody').innerHTML = '';
        if (currentPostPath) {
            db.ref(`${currentPostPath}/reactions`).off();
            db.ref(`${currentPostPath}/comments`).off();
            currentPostPath = null;
        }
    }

    // ========== UI ELEMENTS ==========
    const userProfileFull = document.getElementById('user-profile-full');
    const biggestClansContainer = document.getElementById('biggest-clans');
    const biggestClansContainerWrapper = document.getElementById('biggest-clans-container');
    const clanDisplayArea = document.getElementById('clan-display-area');
    const createClanPasswordModal = document.getElementById('createClanPasswordModal');
    const createClanModal = document.getElementById('createClanModal');
    const adminPasswordModal = document.getElementById('adminPasswordModal');
    const adminPanelModal = document.getElementById('adminPanelModal');
    const adminPanelBtn = document.getElementById('adminPanelBtn');
    const createClanBtn = document.getElementById('createClanBtn');
    const leaveClanBtn = document.getElementById('leaveClanBtn');
    const kcAlertEl = document.getElementById('kc-alert');

    // ========== GLOBAL STATE ==========
    let allClansData = {}, allUsersData = {}, allBadgesData = {}, allAdminsData = {}, currentUser = null, selectedClanId = null;
    let activeSettingsTab = null;
    let isAdminSession = false;
    let showTopScoreClans = false;

    // ========== CUSTOM ALERT ==========
    const kcAlert = (message) => {
        document.getElementById('kc-alert-message').textContent = message;
        kcAlertEl.classList.remove('hidden');
        return new Promise(resolve => {
            document.getElementById('kc-alert-ok').onclick = () => {
                kcAlertEl.classList.add('hidden');
                resolve();
            };
        });
    };
    
    // ========== HELPERS ==========
    function formatClanDisplayName(user, clan) {
        const tag = clan && clan.letterTag ? `[${clan.letterTag}] ` : '';
        return `${tag}${(user && user.displayName) || 'Unknown'}`;
    }

    function getAvatarUrl(u){
      if(!u) return 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return u.avatar || u.photoURL || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
    }

    function avatarImg(src, cls=''){
      const safe = src || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return `<img referrerpolicy="no-referrer" src="${safe}" onerror="this.onerror=null;this.src='https://kevinmidnight7-sudo.github.io/messageboardkc/1.png'" class="${cls}">`;
    }

    function getUserScores(uid){
      const u = allUsersData[uid] || {};
      const s = (u.stats) || {};
      const b = allBadgesData[uid] || {};
      const offence = Number(s.offence ?? b.offence ?? 0) || 0;
      const defence = Number(s.defence ?? b.defence ?? 0) || 0;
      const overall = Number(s.overall ?? b.overall ?? 0) || 0;
      return { offence, defence, overall, total: offence + defence + overall };
    }

    function computeClanScore(clan){
      if(!clan || !clan.members) return 0;
      let sum = 0;
      Object.keys(clan.members).forEach(uid => {
        sum += getUserScores(uid).total;
      });
      return sum;
    }
    
    // NEW FUNCTION START
    function clanScoreCard(clan) {
        const total = computeClanScore(clan);

        // Determine gradient
        let gradient = 'linear-gradient(135deg, #c0c7d1, #8b94a5)'; // default (silver)
        if (total >= 50) gradient = 'linear-gradient(135deg, #ffd700, #f4a300)'; // gold
        else if (total >= 25) gradient = 'linear-gradient(135deg, #cd7f32, #a05a26)'; // bronze

        // Find top three members
        const memberIds = Object.keys(clan.members || {});
        const ranked = memberIds.map(uid => {
            const u = allUsersData[uid];
            // Handle case where user data might be loading/missing
            if (!u) return { uid, user: { displayName: 'Loading...' }, score: 0 };
            const score = getUserScores(uid).total;
            return {uid, user: u, score};
        }).sort((a,b) => b.score - a.score).slice(0,3);

        // Determine next level threshold
        let needed = 0;
        let nextLevelMessage = 'Max level reached!';
        if (total < 25) {
            needed = 25 - total;
            nextLevelMessage = `${needed} points until Bronze`;
        } else if (total < 50) {
            needed = 50 - total;
            nextLevelMessage = `${needed} points until Gold`;
        }

        // Construct HTML
       return `
  <div class="clan-score-card w-64 md:w-72 rounded-xl overflow-hidden select-none"
       style="background:rgba(30,32,42,0.85); border:1px solid rgba(255,255,255,0.10); box-shadow:0 8px 24px rgba(0,0,0,.35)">
    <!-- header -->
    <div class="flex items-center justify-between px-3 py-2 text-white"
         style="background:${gradient}">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-trophy"></i>
        <span class="text-xs uppercase tracking-wide opacity-90">Score</span>
      </div>
      <span class="font-bold text-lg tabular-nums leading-none pr-0.5">${total}</span>
    </div>

    <!-- body -->
    <div class="px-3 py-2">
      <p class="text-[11px] uppercase text-gray-400 font-semibold mb-1.5 tracking-wide">
        Top Scorers
      </p>
      <div class="space-y-1.5">

    function clanScoreBadge(total){

      else if (total >= 25) gradient = 'linear-gradient(135deg, #cd7f32, #a05a26)'; // bronze
      // Render a compact circular badge showing a trophy icon above the score.
      // The parent container should position this badge absolutely as needed.
      return `
        <div class="w-12 h-12 rounded-full flex flex-col items-center justify-center text-xs font-semibold text-white select-none"
             style="background:${gradient}; box-shadow:0 0 18px rgba(255,255,255,.25)">

    // ========== DATA LISTENERS ==========
    function attachDataListeners() {
        db.ref('clans').on('value', snap => { allClansData = snap.val() || {}; renderPage(); });
        db.ref('users').on('value', snap => { allUsersData = snap.val() || {}; renderPage(); });
        db.ref('badges').on('value', snap => { allBadgesData = snap.val() || {}; renderPage(); });
        db.ref('admins').on('value', snap => { allAdminsData = snap.val() || {}; renderPage(); });
    }

    function detachDataListeners() {
        db.ref('clans').off();
        db.ref('users').off();
        db.ref('badges').off();
        db.ref('admins').off();
    }


    // ========== RENDER LOGIC ==========
    function renderPage() {
        if (!document.body) return;
        if (!currentUser) { 
            renderLoginView(); 
            return; 
        }

        adminPanelBtn.classList.remove('hidden');
        createClanBtn.classList.remove('hidden');
        biggestClansContainerWrapper.classList.remove('hidden');

    function renderBiggestClans(){
      try{
        const entries = Object.entries(allClansData).map(([id, clan]) => {
          const memberCount = clan.members ? Object.keys(clan.members).length : 0;
          const score = computeClanScore(clan);
          return { id, ...clan, memberCount, score };
        });

        const sorted = showTopScoreClans
          ? entries.sort((a,b) => b.score - a.score)
          : entries.sort((a,b) => b.memberCount - a.memberCount);

        const top = sorted.slice(0, 20); // Show more clans for the carousel
        biggestClansContainer.innerHTML = top.map(clan => `

            <p class="font-semibold text-sm truncate w-full">${clan.name}</p>
            <p class="text-xs text-gray-400">

            </p>
          </div>
        `).join('') || '<p class="text-gray-400">No clans yet.</p>';

            (() => {
              const btn = document.getElementById('clanScoreBtn');
              const pop = document.getElementById('clanScorePopover');
              if (!btn || !pop) return;
            
              let hideTimer;
            
              const show = () => {
                clearTimeout(hideTimer);
                pop.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
              };
            
              const hide = (delay = 120) => {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                  pop.classList.add('hidden');
                  btn.setAttribute('aria-expanded', 'false');
                }, delay);
              };
            
              // Click toggles (works on mobile)
              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const open = !pop.classList.contains('hidden');
                open ? hide(0) : show();
              });
            
              // Hover opens (desktop convenience)
              btn.addEventListener('mouseenter', show);
              btn.addEventListener('mouseleave', () => hide(150));
              pop.addEventListener('mouseenter', show);
              pop.addEventListener('mouseleave', () => hide(150));
            
              // Click-away to close
              const onDocClick = (e) => {
                if (!pop.classList.contains('hidden') &&
                    !pop.contains(e.target) &&
                    e.target !== btn) {
                  hide(0);
                }
              };
              document.addEventListener('click', onDocClick, { once: true });
            
              // Re-arm click-away after each toggle-open
              const rearm = () => {
                if (!pop.classList.contains('hidden')) {
                  document.addEventListener('click', onDocClick, { once: true });
                }
              };
              btn.addEventListener('click', rearm);
              pop.addEventListener('mouseenter', rearm);
            })();

            const btnMembers = document.getElementById('tabMembers');
            const btnConnections = document.getElementById('tabConnections');
            const btnClanClips = document.getElementById('tabClanClips');
            
            btnMembers.onclick = () => {

            };
            btnClanClips.onclick = () => {
              btnMembers.classList.remove('active');
              btnConnections.classList.remove('active');
              btnClanClips.classList.add('active');
              renderClanClips();
            };
        })();

    function buildReactionBar(reactionsObj){
      const EMOJIS = ['👍','❤️','😂','😮','🔥','👎'];
      const counts = {}; EMOJIS.forEach(e => counts[e] = 0);
      Object.entries(reactionsObj || {}).forEach(([emoji, users]) => {
        counts[emoji] = users ? Object.keys(users).length : 0;
      });
      return `<div class="flex items-center gap-2 mt-2 text-sm text-gray-300">` + 
        EMOJIS.map(e => counts[e] > 0 ? `<span class="inline-flex items-center gap-1"><span>${e}</span><span>${counts[e]}</span></span>` : '').join('') + 
        `</div>`;
    }

    function clipCardHTML(p){
      // Build a rich card similar to the social feed.
      const user = allUsersData[p.uid] || {};
      const hasCust = user.profileCustomization && (user.codesUnlocked?.diamond || user.codesUnlocked?.emerald);
      const nameColor = hasCust && user.profileCustomization?.nameColor ? user.profileCustomization.nameColor : '#ffffff';
      const cardBg = hasCust && user.profileCustomization?.gradient ? user.profileCustomization.gradient : '';
      // Compute reaction counts: fire = any emoji except thumbs-down, thumbsDown = 👎
      let fireCount = 0, thumbsDown = 0;
      if (p.reactions) {
        Object.entries(p.reactions).forEach(([emo, reactors]) => {
          const count = reactors ? Object.keys(reactors).length : 0;
          if (emo === '👎') thumbsDown += count;
          else fireCount += count;
        });
      }
      const views = p.views || 0;
      // Determine thumbnail: prefer explicit thumbnail/image/cover; fallback to YouTube preview or placeholder
      let thumb = p.thumbnail || p.image || p.cover || '';
      if (!thumb && p.ytId) thumb = `https://i.ytimg.com/vi/${p.ytId}/hqdefault.jpg`;
      if (!thumb) thumb = 'https://kevinmidnight7-sudo.github.io/messageboardkc/placeholder.png';
      // Compose media element with play icon
      const mediaHtml = `
        <div class="embed-placeholder aspect-video relative">
          <img src="${thumb}" alt="Preview" class="w-full h-full object-cover rounded-lg">
          <div class="embed-play flex items-center justify-center">
            <i class="fas fa-play"></i>
          </div>
        </div>`;
      // Build card
      return `
        <div class="snap-start inline-block min-w-[280px] max-w-[320px]">
          <div class="p-4 rounded-2xl bg-white/5 hover:bg-white/10 cursor-pointer post-card" onclick="openPostOverlay('${p.uid}','${p.postId}')">
            <div class="flex items-center gap-3 mb-3">
              <div class="relative w-10 h-10 rounded-full overflow-hidden" style="${cardBg ? `box-shadow:0 0 0 2px ${nameColor}` : ''}">
                <img src="${getAvatarUrl(user)}" alt="${escapeHtml(user.displayName || 'Unknown')}" class="w-full h-full object-cover">
              </div>
              <div>
                <span class="font-bold block" style="color:${nameColor}">${escapeHtml(user.displayName || 'Unknown')}</span>
                <span class="block text-xs text-gray-500">
                  ${p.timestamp ? new Date(p.timestamp).toLocaleDateString() : (p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '')}

    // Override the default openPostOverlay with a version that mirrors the social feed overlay.
    window.openPostOverlay = (uid, postId) => {
        const overlay = document.getElementById('postOverlay');
        const body = document.getElementById('poBody');
        // Detach existing listeners if another post is open
        if (currentPostPath) {
            db.ref(`${currentPostPath}/reactions`).off();
            db.ref(`${currentPostPath}/comments`).off();
            currentPostPath = null;
        }
        body.innerHTML = '<div class="text-center p-8">Loading clip...</div>';
        overlay.classList.remove('hidden');
        const path = `users/${uid}/posts/${postId}`;
        db.ref(path).once('value').then(snap => {
            const post = snap.val();
            const author = allUsersData[uid] || {};
            if (!post || !author) {
                body.innerHTML = '<div class="text-center p-8">Could not load clip.</div>';
                return;
            }
            currentPostPath = path;
            // Determine media element: support video, image or YouTube
            let mediaHtml = '';
            if (post.video) {
                mediaHtml = `<video controls class="w-full rounded-lg bg-black max-h-[60vh]" src="${post.video}"></video>`;
            } else if (post.image) {
                mediaHtml = `<img src="${post.image}" class="w-full rounded-lg bg-black object-contain max-h-[60vh]">`;
            } else if (post.ytId) {
                mediaHtml = `<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/${post.ytId}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
            }
            // Determine author name color
            const hasCust = author.profileCustomization && (author.codesUnlocked?.diamond || author.codesUnlocked?.emerald);
            const nameColor = hasCust && author.profileCustomization?.nameColor ? author.profileCustomization.nameColor : '#ffffff';
            const displayName = escapeHtml(author.displayName || 'Unknown');
            const timestamp = post.timestamp ? new Date(post.timestamp).toLocaleString() : (post.createdAt ? new Date(post.createdAt).toLocaleString() : '');
            const description = escapeHtml(post.description || post.caption || '');
            // Render overlay body with reaction and comment placeholders
            body.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    ${avatarImg(getAvatarUrl(author), 'w-12 h-12 rounded-full object-cover')}
                    <div>
                        <p class="font-bold" style="color:${nameColor}">${displayName}</p>
                        <p class="text-xs text-gray-400">${timestamp || 'Just now'}</p>
                    </div>
                </div>
                ${description ? `<p class="mb-3">${description}</p>` : ''}
                ${mediaHtml}
                <div class="mt-3 flex flex-wrap gap-2" id="poReactions"></div>
                <div class="mt-4 border-t border-white/10 pt-4">
                    <h4 class="font-bold mb-2">Comments</h4>
                    <ul class="space-y-3" id="poComments"></ul>
                </div>
            `;
            // Increment view count
            db.ref(`${path}/views`).transaction(n => (n || 0) + 1);
            // Attach realtime listeners for reactions and comments
            db.ref(`${path}/reactions`).on('value', snap2 => renderPostReactions(snap2, document.getElementById('poReactions')));
            db.ref(`${path}/comments`).on('value', snap3 => renderPostComments(snap3, document.getElementById('poComments')));
        }).catch(error => {
            console.error("Error fetching post:", error);
            body.innerHTML = '<div class="text-center p-8 text-red-400">Error loading clip.</div>';
        });
    };

    async function joinOrRequestToJoinClan(clanId) {
        if (!currentUser) return kcAlert("You must be logged in to join a clan.");
        
        const userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[currentUser.uid]);
        if (userClanId) {
            return kcAlert("You are already in a clan. Please leave it before joining a new one.");
        }

        const targetClan = allClansData[clanId];
        if (targetClan.isOpen) { // Free for all
            try {
                await db.ref(`clans/${clanId}/members/${currentUser.uid}`).set(true);
                selectClan(clanId);
                kcAlert(`Successfully joined ${targetClan.name}!`);
            } catch (error) {
                kcAlert("Error joining clan: " + error.message);
            }
        } else { // Request to join
            try {
                await db.ref(`clans/${clanId}/requests/${currentUser.uid}`).set(true);
                kcAlert("Your request to join has been sent.");
            } catch (error) {
                kcAlert("Error sending request: " + error.message);
            }
        }
    }

    async function leaveClan(clanId) {
      if (!currentUser) return kcAlert("You must be logged in.");
      const uid = currentUser.uid;
      const clan = allClansData[clanId];

      try {
        const ops = [
          db.ref(`clans/${clanId}/members/${uid}`).remove()
        ];
        if (clan?.leaders && clan.leaders[uid]) {
          ops.push(db.ref(`clans/${clanId}/leaders/${uid}`).remove());
        }
        await Promise.allSettled(ops);
        clearSelectedClan();
        kcAlert("You have left the clan.");
      } catch (error) {
        kcAlert("Unexpected error while leaving: " + error.message);
      }
    }

    function attachAuthFormListeners() {
        const toLoginLink = document.getElementById('toLoginLink');
        const toRegisterLink = document.getElementById('toRegisterLink');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('formTitle');

        if(toLoginLink) toLoginLink.onclick = e => { e.preventDefault(); registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); formTitle.innerText = 'Login'; };
        if(toRegisterLink) toRegisterLink.onclick = e => { e.preventDefault(); loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); formTitle.innerText = 'Register'; };
        
        loginForm.onsubmit = e => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value).catch(err => kcAlert(err.message));
        };
        
        registerForm.onsubmit = e => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(cred => {
                    const userRef = db.ref('users/' + cred.user.uid);
                    userRef.set({ displayName: name, email: email, joined: firebase.database.ServerValue.TIMESTAMP, avatar: `https://kevinmidnight7-sudo.github.io/messageboardkc/${Math.floor(Math.random() * 12) + 1}.png` });
                    return cred.user.updateProfile({ displayName: name });
                })
                .then(() => kcAlert('Registration successful! Please log in.'))
                .catch(err => kcAlert(err.message));
        };
    }

            </div>
        `;
        const tabs = clanDisplayArea.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.onclick = () => {
                activeSettingsTab = tab.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderClanSettingsContent(clanId, tab.dataset.tab);
            }
        });

        // Restore active tab or default to first
        const tabToActivate = activeSettingsTab || 'details';
        const activeTabEl = Array.from(tabs).find(t => t.dataset.tab === tabToActivate) || tabs[0];
        activeTabEl.click();
    }

    function renderClanSettingsContent(clanId, tab) {
        const contentEl = document.getElementById('clanSettingsContent');
        const clan = allClansData[clanId];

        if(tab === 'details') {
            const regionOptions = REGIONS.map(r => `<option value="${r}" ${clan.region === r ? 'selected' : ''}>${r}</option>`).join('');
            contentEl.innerHTML = `
                <input id="editClanName" class="w-full bg-gray-800 p-2 rounded mb-2" value="${clan.name}">
                <input id="editClanIcon" class="w-full bg-gray-800 p-2 rounded mb-2" value="${clan.icon}">
                <input id="editClanTag" class="w-full bg-gray-800 p-2 rounded mb-2" value="${clan.letterTag || ''}">
                <select id="editClanRegion" class="w-full bg-gray-800 p-2 rounded mb-2">${regionOptions}</select>
                <textarea id="editClanDesc" class="w-full bg-gray-800 p-2 rounded mb-2" rows="3">${clan.description || ''}</textarea>
                <div class="flex items-center justify-between p-2 bg-gray-800 rounded mb-4">
                    <label for="joinToggle" class="font-semibold">Free for All Join</label>
                    <label class="switch">
                        <input type="checkbox" id="joinToggle" ${clan.isOpen ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="saveClanDetails" class="w-full bg-blue-500 hover:bg-blue-600 p-2 rounded">Save</button>
            `;
            document.getElementById('saveClanDetails').onclick = () => saveClanDetails(clanId);
        } else if (tab === 'users') {
             const requests = clan.requests ? Object.keys(clan.requests).map(uid => {
                const user = allUsersData[uid];
                return user ? `
                    <div class="flex items-center p-2 bg-gray-800 rounded">
                        ${avatarImg(getAvatarUrl(user), 'w-8 h-8 rounded-full mr-2 object-cover')}
                        <span>${formatClanDisplayName(user, clan)}</span>
                        <div class="ml-auto flex gap-2">
                            <button onclick="handleRequest('${clanId}','${uid}', true)" class="bg-green-500 px-2 rounded">✔️</button>
                            <button onclick="handleRequest('${clanId}','${uid}', false)" class="bg-red-500 px-2 rounded">❌</button>
                        </div>
                    </div>` : '';
            }).join('') : '';

            const members = Object.keys(clan.members).map(uid => {
                const user = allUsersData[uid];
                const isOwner = clan.owner === uid;
                if (!user || uid === currentUser.uid) return '';
                return `
                    <div class="flex items-center p-2 bg-gray-800 rounded">
                        ${avatarImg(getAvatarUrl(user), 'w-8 h-8 rounded-full mr-2 object-cover')}
                        <span>${formatClanDisplayName(user, clan)}${isOwner ? ' 👑' : ''}</span>
                        ${!isOwner ? `<button onclick="removeMember('${clanId}', '${uid}')" class="ml-auto bg-red-500 px-2 rounded">Kick</button>`: ''}
                    </div>`;
            }).join('');

            contentEl.innerHTML = `
                <h4 class="font-bold mb-2">Join Requests</h4>
                <div class="space-y-2 mb-4">${requests || '<p class="text-gray-400">No pending requests.</p>'}</div>
                <h4 class="font-bold mb-2">Current Members</h4>
                <div class="space-y-2">${members || '<p class="text-gray-400">No other members.</p>'}</div>
            `;
        } else if (tab === 'relationships') {
            const otherClans = Object.entries(allClansData).filter(([id]) => id !== clanId);
            const allies = clan.allies || {};
            const enemies = clan.enemies || {};

            const relationList = otherClans.map(([id, otherClan]) => {
                const state = allies[id] ? 'ally' : enemies[id] ? 'enemy' : 'neutral';
                const stateColor = state === 'ally' ? 'bg-green-600' : state === 'enemy' ? 'bg-red-600' : 'bg-gray-600';
                return `
                 <div class="flex items-center p-2 bg-gray-800 rounded">
                    ${avatarImg(otherClan.icon, 'w-10 h-10 rounded-full mr-3')}
                    <div class="flex-1">
                        <p>${otherClan.name}</p>
                        <span class="px-2 py-0.5 text-xs rounded-full ${stateColor}">${state.charAt(0).toUpperCase() + state.slice(1)}</span>
                    </div>
                    <div class="ml-auto flex gap-2">
                        <button onclick="setRelation('${clanId}', '${id}', 'allies')" class="${allies[id] ? 'bg-green-600' : 'bg-green-800'} px-2 rounded">Ally</button>
                        <button onclick="setRelation('${clanId}', '${id}', 'enemies')" class="${enemies[id] ? 'bg-red-600' : 'bg-red-800'} px-2 rounded">Enemy</button>
                        <button onclick="setRelation('${clanId}', '${id}', null)" class="bg-gray-600 px-2 rounded">Neutral</button>
                    </div>
                </div>
            `}).join('');
            contentEl.innerHTML = `<div class="space-y-2">${relationList}</div>`;
        }
    }

    async function saveClanDetails(clanId) {
      try {
        const name = document.getElementById('editClanName').value;
        const icon = document.getElementById('editClanIcon').value;
        const description = document.getElementById('editClanDesc').value;
        const letterTag = document.getElementById('editClanTag').value.trim().toUpperCase();
        const region = document.getElementById('editClanRegion').value;
        const isOpen = document.getElementById('joinToggle').checked;

        if (!/^[A-Z]{1,4}$/.test(letterTag)) return kcAlert("Letter Tag must be 1–4 uppercase letters.");
        if (!REGIONS.includes(region)) return kcAlert("Please choose a valid region.");

        await db.ref(`clans/${clanId}`).update({ name, icon, description, isOpen, letterTag, region });
        kcAlert('Clan details saved!');
      } catch (e) {
        kcAlert('Save failed: ' + (e?.message || e));
      }
    }
    
    async function handleRequest(clanId, userId, accept) {
        await db.ref(`clans/${clanId}/requests/${userId}`).remove();
        if(accept) {
            await db.ref(`clans/${clanId}/members/${userId}`).set(true);
        }
    }

    async function removeMember(clanId, userId) {
        // Prevent kicking the owner (double check)
        const clan = allClansData[clanId];
        if (clan && clan.owner === userId) {
            kcAlert("You cannot kick the clan owner.");
            return;
        }
        await db.ref(`clans/${clanId}/members/${userId}`).remove();
        await db.ref(`clans/${clanId}/leaders/${userId}`).remove(); // Also remove as leader
    }

    async function setRelation(clanId, otherClanId, status) {
        await db.ref(`clans/${clanId}/allies/${otherClanId}`).remove();
        await db.ref(`clans/${clanId}/enemies/${otherClanId}`).remove();
        if (status) {
            await db.ref(`clans/${clanId}/${status}/${otherClanId}`).set(true);
        }
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
        const regionSelect = document.getElementById('clanRegionInput');
        REGIONS.forEach(r => {
            const option = document.createElement('option');
            option.value = r;
            option.textContent = r;
            regionSelect.appendChild(option);
        });
        
        document.getElementById('clanToggle').addEventListener('change', (e) => {
          showTopScoreClans = e.target.checked;
          document.getElementById('toggleLabel').textContent = showTopScoreClans ? 'Top Score' : 'Biggest';
          renderBiggestClans();
        });

        // Carousel Logic for Biggest Clans
        const clansWrapper = document.getElementById('biggest-clans-wrapper');
        const prevBtn = document.getElementById('clans-prev');
        const nextBtn = document.getElementById('clans-next');

        if (clansWrapper && prevBtn && nextBtn) {
            prevBtn.addEventListener('click', () => {
                const scrollAmount = clansWrapper.clientWidth;
                clansWrapper.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            });
            nextBtn.addEventListener('click', () => {
                const scrollAmount = clansWrapper.clientWidth;
                clansWrapper.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            });
        }
        
        auth.onAuthStateChanged(user => {
            detachDataListeners();
            currentUser = user;
            if(user){
                if (sessionStorage.getItem('kc_isAdminSession') === '1') {
                  isAdminSession = true;
                  const sRef = db.ref(`sessionAdmins/${auth.currentUser.uid}`);
                  sRef.set(true);
                  sRef.onDisconnect().remove();
                }
                attachDataListeners();
            } else {
                isAdminSession = false;
                sessionStorage.removeItem('kc_isAdminSession');
                renderLoginView();
            }
        });
    });

</script>
</body>
</html>
