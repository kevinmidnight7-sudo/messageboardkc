<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KC Clans</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://kevinmidnight7-sudo.github.io/messageboardkc/silver.png') center/cover fixed;
      color: #e5e7eb;
    }
    .glass-bg {
      background: rgba(30,32,42,0.78);
      backdrop-filter: blur(20px) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) brightness(1.1);
      box-shadow: 0 10px 48px 0 #10152044, 0 2px 8px #5a668133;
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.10);
    }
    .profile-card {
        background: linear-gradient(135deg, rgba(30, 20, 50, 0.7), rgba(20, 30, 60, 0.7));
        overflow: hidden; /* Changed from hidden to visible to allow overlay */
        position: relative;
    }
    .profile-banner {
        width: 100%;
        height: 120px;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: white;
    }
    /* Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Modal & Alert styles */
    .modal-overlay, .kc-alert-overlay {
        animation: fadeIn 0.3s ease;
    }
    .modal-content, .kc-alert-box {
        animation: zoomIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .tab-btn.active {
      background-color: #3b82f6;
      color: white;
    }
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(26px); }

    /* Compact switch */
    .switch-sm { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch-sm input { opacity: 0; width: 0; height: 0; }
    .slider-sm { position:absolute; cursor:pointer; inset:0; background:#9ca3af; transition:.25s; border-radius:9999px; }
    .slider-sm:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:9999px; transition:.25s; }
    .switch-sm input:checked + .slider-sm { background:#3b82f6; }
    .switch-sm input:checked + .slider-sm:before { transform: translateX(16px); }

    /* Post card styles from socialfeed */
    .post-card { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .embed-placeholder { background-color: #2d3748; border-radius: 0.5rem; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    .post-media { width: 100%; height: 100%; object-fit: cover; }
    .embed-play {
      position: absolute; font-size: 3rem; color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4); width: 60px; height: 60px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .post-card:hover .embed-play { transform: scale(1.1); }

    /* Pagination and Rank styles */
    button:disabled, .rank-editor-row button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .rank-editor-row.dragging {
        opacity: 0.5;
        background: #3b82f6;
    }
    .rank-editor-row .drag-handle {
        cursor: grab;
    }
    .rank-editor-row .drag-handle:active {
        cursor: grabbing;
    }

    /* ---- Collapsible profile card ---- */
    .profile-card { position: relative; overflow: visible; } /* Changed overflow */
    .profile-collapsible {
      /* collapsed by default */
      max-height: 280px;           /* Increased slightly based on content */
      transition: max-height .45s cubic-bezier(.2, .9, .25, 1);
      position: relative;
      overflow: hidden; /* Add overflow hidden here for the mask */
      /* soft fade/blur at bottom edge */
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,.7) 82%, rgba(0,0,0,0) 100%);
              mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,.7) 82%, rgba(0,0,0,0) 100%);
    }
    .profile-collapsible.blur-on { backdrop-filter: blur(0.3px); } /* tiny to trigger GPU compositing */
    .profile-collapsible.expanded {
      max-height: 1200px;          /* large enough for full card */
      overflow: visible; /* Make visible when expanded */
      -webkit-mask-image: none;
              mask-image: none;
    }
    /* Chevron toggle */
    .profile-toggle {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: 10px; z-index: 5;
      width: 36px; height: 36px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px) brightness(1.1);
      transition: transform .35s cubic-bezier(.2, .9, .25, 1), background .2s;
      cursor: pointer;
    }
    .profile-toggle:hover { background: rgba(255,255,255,.18); }
    .profile-toggle.rotate { transform: translateX(-50%) rotate(180deg); }
    /* Elastic open/close micro-animation */
    @keyframes elastic-open { 0%{transform:scaleY(.96)} 50%{transform:scaleY(1.02)} 100%{transform:scaleY(1)} }
    @keyframes elastic-close{ 0%{transform:scaleY(1.02)} 100%{transform:scaleY(1)} }
    .profile-collapsible.elastic-open { animation: elastic-open .35s ease-out; }
    .profile-collapsible.elastic-close{ animation: elastic-close .25s ease-in; }
    /* Make the expanded card overlay the buttons below */
    .profile-card.overlay-open { z-index: 20; position: relative; margin-bottom: -120px; } /* pulls card over buttons */

    /* ---- Liquid buttons ---- */
    .liquid-row { position: relative; z-index: 0; } /* below the card */
    .liquid-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .70rem 1rem; border-radius: 9999px; font-weight: 700;
      color: #fff; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08); backdrop-filter: blur(12px) saturate(1.15);
      box-shadow: 0 8px 22px rgba(0,0,0,.25), inset 0 0 0 999px var(--liquid-color, transparent);
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
      text-decoration: none; /* Ensure links look like buttons */
    }
    .liquid-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.35), inset 0 0 0 999px var(--liquid-color, transparent); }
    /* color fills (icon stays white) */
    .liquid-green  { --liquid-color: rgba(34,197,94,.30); }   /* emerald/green */
    .liquid-blue   { --liquid-color: rgba(59,130,246,.30); }  /* blue */
    .liquid-cyan   { --liquid-color: rgba(6,182,212,.30); }   /* cyan */
    .liquid-amber  { --liquid-color: rgba(0, 255, 191, 0.26); }  /* yellow/orange */
    /* icons always white */
    .liquid-btn i, .liquid-btn svg { color:#fff !important; fill:#fff !important; width:18px; height:18px; }
    
  .icon-img { width: 18px; height: 18px; object-fit: contain; display:inline-block; }
  /* keep fills subtle so buttons look liquid/glassy */
  .liquid-green {  --liquid-color: rgba(34,197,94,.26);  }
  .liquid-blue  {  --liquid-color: rgba(59,130,246,.26); }
  .liquid-cyan  {  --liquid-color: rgba(6,182,212,.26);  }
  .liquid-amber {  --liquid-color: rgba(0, 255, 191, 0.26); }


  </style>
</head>

<script>
    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
        authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
        databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kckillerscompany-ab1ec"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ========== CONSTANTS ==========
    const ADMIN_PASSWORD = "events2025KC"; // PATCH E: Password constant
    const REGIONS = ["North America","South America","Europe","Africa","Middle East","Asia","Oceania"];
    const PAGE_SIZE = 5;

    // ========== GLOBAL CONTEXT & POST INTERACTION HELPERS ==========
    let currentPostPath = null;
    const POST_EMOJIS = ['👍','❤️','😂','😮','🔥','👎'];

    /** Escape HTML */
    function escapeHtml(str) {
        return (str || '').toString().replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
    }

    /** Truncate text */
    function truncate(str, len) {
        if (!str) return '';
        return str.length > len ? str.substring(0, len) + '...' : str;
    }

    /** Render post reactions */
    function renderPostReactions(snap, targetEl) {
        const data = snap.val() || {};
        targetEl.innerHTML = '';
        POST_EMOJIS.forEach(emo => {
            const reactors = data[emo] ? Object.keys(data[emo]) : [];
            const count = reactors.length;
            const userReacted = currentUser && data[emo] && data[emo][currentUser.uid];
            const btn = document.createElement('button');
            btn.className = `px-2 py-1 rounded-full border text-sm flex items-center gap-1 ${userReacted ? 'bg-indigo-500 text-white border-indigo-400' : 'bg-slate-600/50 text-gray-200 border-slate-500'}`;
            btn.innerHTML = `<span>${emo}</span><span>${count || ''}</span>`;
            btn.dataset.emoji = emo;
            btn.onclick = ev => {
                ev.stopPropagation();
                togglePostReaction(emo);
            };
            btn.onmouseenter = ev => {
                const rect = ev.target.getBoundingClientRect();
                const names = reactors.slice(0,25).map(uid => (allUsersData[uid]?.displayName) || 'User');
                const tip = document.getElementById('reactTip');
                if (tip) {
                    tip.textContent = names.length ? names.join('\n') : 'No reactions yet';
                    tip.style.left = (rect.left + rect.width/2) + 'px';
                    tip.style.top = (rect.top - 8) + 'px';
                    tip.classList.remove('hidden');
                }
            };
            btn.onmouseleave = () => {
                const tip = document.getElementById('reactTip');
                if(tip) tip.classList.add('hidden');
            };
            targetEl.appendChild(btn);
        });
    }

    /** Toggle post reaction */
    function togglePostReaction(emo) {
        const u = currentUser;
        if (!u) { kcAlert('Please log in to react.'); return; }
        if (!currentPostPath) return;
        const ref = db.ref(`${currentPostPath}/reactions/${emo}/${u.uid}`);
        ref.transaction(curr => curr ? null : true);
    }

    /** Render post comments */
    function renderPostComments(snap, targetEl) {
        const data = snap.val() || {};
        const comments = Object.values(data).sort((a,b) => (a.time || 0) - (b.time || 0));
        targetEl.innerHTML = '';
        comments.forEach(c => {
            const user = allUsersData[c.uid] || {};
            const hasCust = user.profileCustomization && (user.codesUnlocked?.diamond || user.codesUnlocked?.emerald);
            const nameColor = hasCust && user.profileCustomization?.nameColor ? user.profileCustomization.nameColor : '#e5e7eb';
            const dateString = c.time ? new Date(c.time).toLocaleString() : '';
            const li = document.createElement('li');
            li.className = 'space-y-1';
            li.innerHTML = `
                <div class="flex items-center gap-2">
                    ${avatarImg(getAvatarUrl(user), 'w-6 h-6 rounded-full object-cover')}
                    <span class="font-semibold text-sm" style="color:${nameColor}">${escapeHtml(user.displayName || 'Unknown')}</span>
                    <span class="text-xs text-gray-400">${dateString}</span>
                </div>
                <div class="ml-8 text-sm text-gray-300">${escapeHtml(c.text || '')}</div>
            `;
            targetEl.appendChild(li);
        });
    }

    /** Close post overlay */
    function closePostOverlay() {
        const overlay = document.getElementById('postOverlay');
        overlay.classList.add('hidden');
        document.getElementById('poBody').innerHTML = '';
        if (currentPostPath) {
            db.ref(`${currentPostPath}/reactions`).off();
            db.ref(`${currentPostPath}/comments`).off();
            currentPostPath = null;
        }
    }

    // ========== UI ELEMENTS ==========
    const userProfileFull = document.getElementById('user-profile-full');
    const biggestClansContainer = document.getElementById('biggest-clans');
    const biggestClansContainerWrapper = document.getElementById('biggest-clans-container');

    // ========== HELPERS ==========
    function formatClanDisplayName(user, clan) {

      if(!u) return 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return u.avatar || u.photoURL || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';

    function avatarImg(src, cls=''){
      const safe = src || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
      return `<img referrerpolicy="no-referrer" src="${safe}" onerror="this.onerror=null;this.src='https://kevinmidnight7-sudo.github.io/messageboardkc/1.png'" class="${cls}">`;
    }

    function getUserScores(uid){
      const u = allUsersData[uid] || {};
      const s = (u.stats) || {};
      const b = allBadgesData[uid] || {};
      const offence = Number(s.offence ?? b.offence ?? 0) || 0;
      const defence = Number(s.defence ?? b.defence ?? 0) || 0;
      const overall = Number(s.overall ?? b.overall ?? 0) || 0;
      return { offence, defence, overall, total: offence + defence + overall };
    }

    function computeClanScore(clan){
      if(!clan || !clan.members) return 0;
      let sum = 0;
      Object.keys(clan.members).forEach(uid => {
        sum += getUserScores(uid).total;
      });
      return sum;
    }

    // START PATCH 1A: Add permission helper functions
    function getOwnerUid(clan){
      if (!clan) return null;
      if (typeof clan.owner === 'string') return clan.owner;
      if (clan.owner && typeof clan.owner === 'object') {
        const keys = Object.keys(clan.owner).filter(k => clan.owner[k] === true);
        return keys[0] || null;
      }
      return null;
    }
    function userIsLeader(clan, uid){
      return !!(clan && clan.leaders && clan.leaders[uid] === true);
    }
    function userIsAdmin(uid){
      // Check both session admin and global admin list
      return !!(isAdminSession || (allAdminsData && allAdminsData[uid] === true));
    }
    // END PATCH 1A

    async function debugRankWrite(clanId){
      const uid = auth.currentUser?.uid;

        console.log('[DEBUG] No user logged in.');
        return;

      const paths = [
        `clans/${clanId}/owner`,
        `clans/${clanId}/leaders/${uid}`,
        `admins/${uid}`,
        `sessionAdmins/${uid}`
      ];
      try {
        const vals = await Promise.all(paths.map(p => db.ref(p).once('value').then(s=>s.val())));
        console.log('[DEBUG] Rank Write Permissions Check for UID:', uid, {
          ownerData: vals[0], // Log the raw owner data
          isLeader: vals[1] === true,
          isGlobalAdmin: vals[2] === true,
          isSessionAdmin: vals[3] === true,
          localIsAdminSessionFlag: isAdminSession // Compare with local flag
        });
      } catch (error) {
          console.error('[DEBUG] Error fetching permission data:', error);
      }
    }
    // END DEBUG HELPER

    // Helper for Ranks
    function getRankName(clan, uid) {
        if (!clan) return 'Member';
        const orderedRanks = clan.ranks?.order || ["Owner", "Member"];

        const ownerUid = getOwnerUid(clan); // Use helper
        if (uid === ownerUid) {
            return orderedRanks[0] || 'Owner';
        }

        const memberRank = clan.memberRanks?.[uid];

        if (memberRank && orderedRanks.includes(memberRank)) {
            return memberRank;
        }

        return orderedRanks[orderedRanks.length - 1] || 'Member';
    }

    // PATCH B1: Correct Bronze/Silver order in score card

      const total = computeClanScore(clan);

      // Bronze < Silver < Gold
      let gradient = 'linear-gradient(135deg, #cd7f32, #a05a26)'; // bronze (default lowest)
      if (total >= 50) {
        gradient = 'linear-gradient(135deg, #ffd700, #f4a300)'; // gold
      } else if (total >= 25) {
        gradient = 'linear-gradient(135deg, #c0c0c0, #8b94a5)'; // silver
      }

      const memberIds = Object.keys(clan.members || {});
      const ranked = memberIds.map(uid => {
          const u = allUsersData[uid];
          if (!u) return { uid, user: { displayName: 'Loading...' }, score: 0 };
          const score = getUserScores(uid).total;
          return {uid, user: u, score};
      }).sort((a,b) => b.score - a.score).slice(0,3);

      // Next level messaging (to Silver first, then Gold)
      let nextLevelMessage = 'Max level reached!';
      if (total < 25) {
        nextLevelMessage = `${25 - total} points until Silver`;
      } else if (total < 50) {
        nextLevelMessage = `${50 - total} points until Gold`;
      }

       return `

        Top Scorers
      </p>
      <div class="space-y-1.5">
        ${ranked.map((r,i) => {
          const medal = ['#ffd700','#c0c0c0','#cd7f32'][i] || '#e5e7eb'; // Gold, Silver, Bronze
          return `
            <div class="flex items-center gap-3 text-sm leading-tight">

`;

    function renderBiggestClans(){
      try{
        const entries = Object.entries(allClansData).map(([id, clan]) => {
          const memberCount = clan.members ? Object.keys(clan.members).length : 0;
          const score = computeClanScore(clan);
          return { id, ...clan, memberCount, score };
        });

        const sorted = showTopScoreClans
          ? entries.sort((a,b) => b.score - a.score)
          : entries.sort((a,b) => b.memberCount - a.memberCount);

        const top = sorted.slice(0, 20);
        biggestClansContainer.innerHTML = top.map(clan => `
          <div class="flex flex-col items-center text-center cursor-pointer w-24 flex-shrink-0" onclick="selectClan('${clan.id}')">

            <p class="text-xs text-gray-400">

            </p>
          </div>
        `).join('') || '<p class="text-gray-400">No clans yet.</p>';

    }

    function renderAllClansList(filter = '') {
        const listEl = document.getElementById('allClansList');
        const paginationEl = document.getElementById('paginationControls');
        if (!listEl || !paginationEl) return;

        const lowerFilter = filter.toLowerCase();

        const entries = Object.entries(allClansData)
            .filter(([id, c]) => c.name?.toLowerCase().includes(lowerFilter))
            .filter(([id, c]) => !selectedRegion || c.region === selectedRegion)
            .sort((a,b) => a[1].name.localeCompare(b[1].name));

        const total = entries.length;
        const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
        allClansPage = Math.min(allClansPage, maxPage);
        allClansPage = Math.max(0, allClansPage);

        const pageSlice = entries.slice(allClansPage * PAGE_SIZE, (allClansPage * PAGE_SIZE) + PAGE_SIZE);

            listEl.innerHTML = pageSlice.map(([id, clan]) => {
                const btnClass = clan.isOpen ? 'bg-blue-500 hover:bg-blue-600' : 'bg-green-500 hover:bg-green-600';

                const memberCount = clan.members ? Object.keys(clan.members).length : 0;

                return `
                <div class="flex items-start p-3 rounded-xl bg-white/5 hover:bg-white/10 transition cursor-pointer" onclick="selectClan('${id}')">

                      <div class="flex items-center">
                        <span class="font-bold text-lg truncate">${escapeHtml(clan.name)}</span>
                        <span class="ml-2 px-2 py-0.5 text-xs rounded-full bg-white/10 border border-white/10 flex-shrink-0">${escapeHtml(clan.letterTag || '')}</span>
                      </div>
                      <p class="text-sm text-gray-300 mt-1 mb-2 truncate">${truncate(escapeHtml(clan.description), 160)}</p>
                      <div class="flex items-center justify-between">
                          <p class="text-sm text-gray-400">${memberCount} members</p>
                          <button onclick="event.stopPropagation(); joinOrRequestToJoinClan('${id}')" class="${btnClass} text-white font-bold py-1.5 px-4 rounded-full transition-transform transform hover:scale-105 text-sm flex-shrink-0">${btnText}</button>
                      </div>
                    </div>
                </div>
            `}).join('');
        }

        const prevDisabled = allClansPage === 0;
        const nextDisabled = allClansPage === maxPage || total === 0;

        paginationEl.innerHTML = `
          <button id="prevPageBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-lg transition" ${prevDisabled ? 'disabled' : ''}>← Prev</button>
          <span class="text-gray-300">${total > 0 ? `Page ${allClansPage + 1} of ${maxPage + 1}` : 'No results'}</span>
          <button id="nextPageBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-lg transition" ${nextDisabled ? 'disabled' : ''}>Next →</button>
        `;

        if (!prevDisabled) {
            document.getElementById('prevPageBtn').onclick = () => {
                allClansPage--;
                renderAllClansList(filter);
            };
        }
        if (!nextDisabled) {
            document.getElementById('nextPageBtn').onclick = () => {
                allClansPage++;
                renderAllClansList(filter);
            };
        }
    }

            </div>
        `;

        // Tab logic
        (function(){
            const content = document.getElementById('clanTabContent');
            const clan = allClansData[clanId];

            function renderMembers(){
                const orderedRanks = clan.ranks?.order || ["Owner", "Member"];
                const memberCount = Object.keys(clan.members || {}).length;

                content.innerHTML = `
                <div class="w-full max-w-xl mx-auto mb-4">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-xl">Members (${memberCount})</h3>
                    <div class="flex items-center gap-2">
                      <span class="text-sm text-gray-400">Filter by Rank:</span>
                      <select id="memberRankFilter" class="bg-gray-700 text-white p-2 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        ${orderedRanks.map(rank => `<option value="${escapeHtml(rank)}">${escapeHtml(rank)}</option>`).join('')}
                      </select>
                    </div>
                  </div>
                </div>
                <!-- Member Carousel -->
                <div class="relative w-full">
                  <button onclick="this.nextElementSibling.scrollBy({left:-300,behavior:'smooth'})"
                          class="absolute -left-3 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white">‹</button>

                  <div class="overflow-x-auto no-scrollbar snap-x snap-mandatory flex gap-3 px-8 min-h-[100px]" id="clanMembersStrip">
                    <!-- Members injected here by renderMemberCarousel -->
                  </div>

                  <button onclick="this.previousElementSibling.scrollBy({left:300,behavior:'smooth'})"
                          class="absolute -right-3 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white">›</button>
                </div>`;

                const rankSelect = document.getElementById('memberRankFilter');

                function renderMemberCarousel(rankFilter) {
                    const carouselEl = document.getElementById('clanMembersStrip');
                    if (!carouselEl) return;

                    const ownerUID = getOwnerUid(clan);
                    const defaultRank = orderedRanks[orderedRanks.length - 1] || 'Member';
                    const ownerRank = orderedRanks[0] || 'Owner';

                    const filteredMembers = Object.keys(clan.members || {}).filter(uid => {
                        let memberRank;
                        if (uid === ownerUID) memberRank = ownerRank;
                        else memberRank = clan.memberRanks?.[uid] || defaultRank;

                        // Fallback if member rank isn't in the official order
                        if (!orderedRanks.includes(memberRank)) memberRank = defaultRank;

                        return memberRank === rankFilter;
                    });

                    carouselEl.innerHTML = filteredMembers.map(uid => {
                        const u = allUsersData[uid];
                        if(!u) return '';
                        const crown = uid === ownerUID ? ' 👑' : '';
                        return `
                          <button onclick="openProfileOverlay('${uid}')"

                            ${avatarImg(getAvatarUrl(u), 'w-12 h-12 rounded-full object-cover border-2 border-gray-600')}

                }

                // Render with the first rank initially
                renderMemberCarousel(orderedRanks[0] || 'Owner');
                rankSelect.onchange = (e) => renderMemberCarousel(e.target.value);
            }


            function renderConnections(){
              const allies = clan.allies || {};
              const enemies = clan.enemies || {};
              const mkRow = (title, ids, color) => {
                const idsArr = Object.keys(ids||{});
                if (idsArr.length === 0) return `<p class="text-gray-400">${title}: none</p>`;
                return `
                  <h4 class="font-bold mb-2 ${color}">${title}</h4>
                  <div class="flex flex-wrap gap-3 justify-center">
                    ${idsArr.map(id => {
                      const c = allClansData[id];
                      return c ? `<div class="flex flex-col items-center">
                        ${avatarImg(c.icon, 'w-12 h-12 rounded-full object-contain')}
                        <span class="text-xs mt-1">${escapeHtml(c.name)}</span>
                      </div>` : '';
                    }).join('')}
                  </div>`;
              };
              content.innerHTML = '<div class="space-y-4">' + mkRow('Allies', allies, 'text-green-400') + mkRow('Enemies', enemies, 'text-red-400') + '</div>';
            }

            function renderClanClips(){
              const memberIds = Object.keys(clan.members || {});
              const posts = [];
              content.innerHTML = `<p class="text-gray-400">Loading clips...</p>`;

              const readUserPosts = uid => new Promise(resolve => {
                db.ref(`users/${uid}/posts`).once('value').then(s => {
                  const v = s.val() || {};
                  Object.keys(v).forEach(postId => {
                    const p = v[postId];
                    // Basic check for video/image/ytId before adding
                    if (p && (p.video || p.image || p.ytId)) {
                        posts.push({ uid, postId, ...p });
                    }
                  });
                  resolve();
                }).catch(() => resolve()); // Resolve even on error to continue
              });

              Promise.all(memberIds.map(readUserPosts)).then(() => {
                // Sort posts by timestamp descending (newest first)
                posts.sort((a, b) => (b.timestamp || b.createdAt || 0) - (a.timestamp || a.createdAt || 0));

                const html = posts.slice(0, 36).map(clipCardHTML).join('');
                content.innerHTML = `
                  <h3 class="font-bold text-xl mb-3 self-start">Clan Clips</h3>
                  <div class="relative">
                    <button onclick="this.nextElementSibling.scrollBy({left:-320, behavior:'smooth'})"
                            class="absolute -left-3 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white">‹</button>
                    <div class="overflow-x-auto no-scrollbar snap-x snap-mandatory flex gap-4 px-8" id="clanClipsStrip">
                      ${html || '<p class="text-gray-400">No clips found for clan members.</p>'}
                    </div>
                    <button onclick="this.previousElementSibling.scrollBy({left:320, behavior:'smooth'})"
                            class="absolute -right-3 top-1/2 -translate-y-1/2 z-10 bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-white">›</button>
                  </div>
                `;
              });
            }

            // initial load
            renderMembers();

            // Trophy popover behavior
            (() => {
              const btn = document.getElementById('clanScoreBtn');
              const pop = document.getElementById('clanScorePopover');
              if (!btn || !pop) return;

              let hideTimer;

              const show = () => {
                clearTimeout(hideTimer);
                pop.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
              };

              const hide = (delay = 120) => {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                  pop.classList.add('hidden');
                  btn.setAttribute('aria-expanded', 'false');
                }, delay);
              };

              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const open = !pop.classList.contains('hidden');
                open ? hide(0) : show();
              });

              btn.addEventListener('mouseenter', show);
              btn.addEventListener('mouseleave', () => hide(150));
              pop.addEventListener('mouseenter', show);
              pop.addEventListener('mouseleave', () => hide(150));

              // Close on outside click
              const onDocClick = (e) => {
                  if (!pop.classList.contains('hidden') && !pop.contains(e.target) && e.target !== btn) {
                      hide(0);
                      // Remove listener after closing
                      document.removeEventListener('click', onDocClick);
                  }
              };

              btn.addEventListener('click', (e) => {
                  // Re-add listener only if opening
                  if(pop.classList.contains('hidden')) {
                      // Use setTimeout to ensure listener is added *after* current click bubbles up
                      setTimeout(() => document.addEventListener('click', onDocClick), 0);
                  }
              });

            })();


            const btnMembers = document.getElementById('tabMembers');
            const btnConnections = document.getElementById('tabConnections');
            const btnClanClips = document.getElementById('tabClanClips');

            btnMembers.onclick = () => {
                btnMembers.classList.add('active');
                btnConnections.classList.remove('active');
                btnClanClips.classList.remove('active');
                renderMembers();
            };
            btnConnections.onclick = () => {
                btnConnections.classList.add('active');
                btnMembers.classList.remove('active');
                btnClanClips.classList.remove('active');
                renderConnections();
            };
            btnClanClips.onclick = () => {
              btnMembers.classList.remove('active');
              btnConnections.classList.remove('active');
              btnClanClips.classList.add('active');
              renderClanClips();
            };
        })();
    }

    // ========== SOCIAL FEED STYLE CLIPS ==========
    function buildReactionBar(reactionsObj){
      const EMOJIS = ['👍','❤️','😂','😮','🔥','👎'];
      const counts = {}; EMOJIS.forEach(e => counts[e] = 0);
      Object.entries(reactionsObj || {}).forEach(([emoji, users]) => {
        counts[emoji] = users ? Object.keys(users).length : 0;
      });
      return `<div class="flex items-center gap-2 mt-2 text-sm text-gray-300">` +
        EMOJIS.map(e => counts[e] > 0 ? `<span class="inline-flex items-center gap-1"><span>${e}</span><span>${counts[e]}</span></span>` : '').join('') +
        `</div>`;
    }

    function clipCardHTML(p){
      const user = allUsersData[p.uid] || {};
      const hasCust = user.profileCustomization && (user.codesUnlocked?.diamond || user.codesUnlocked?.emerald);
      const nameColor = hasCust && user.profileCustomization?.nameColor ? user.profileCustomization.nameColor : '#ffffff';
      const cardBg = hasCust && user.profileCustomization?.gradient ? user.profileCustomization.gradient : '';
      let fireCount = 0, thumbsDown = 0;
      if (p.reactions) {
        Object.entries(p.reactions).forEach(([emo, reactors]) => {
          const count = reactors ? Object.keys(reactors).length : 0;
          if (emo === '👎') thumbsDown += count;
          else fireCount += count;
        });
      }
      const views = p.views || 0;
      let thumb = p.thumbnail || p.image || p.cover || '';
      if (!thumb && p.ytId) thumb = `https://i.ytimg.com/vi/${p.ytId}/hqdefault.jpg`;
      if (!thumb) thumb = 'https://kevinmidnight7-sudo.github.io/messageboardkc/placeholder.png'; // Fallback image

      const mediaHtml = `
        <div class="embed-placeholder aspect-video relative">
          <img src="${thumb}" alt="Preview" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://kevinmidnight7-sudo.github.io/messageboardkc/placeholder.png'">
          <div class="embed-play flex items-center justify-center">
            <i class="fas fa-play"></i>
          </div>
        </div>`;
      return `
        <div class="snap-start inline-block min-w-[280px] max-w-[320px]">
          <div class="p-4 rounded-2xl bg-white/5 hover:bg-white/10 cursor-pointer post-card" onclick="openPostOverlay('${p.uid}','${p.postId}')">
            <div class="flex items-center gap-3 mb-3">
              <div class="relative w-10 h-10 rounded-full overflow-hidden" style="${cardBg ? `box-shadow:0 0 0 2px ${nameColor}` : ''}">
                <img src="${getAvatarUrl(user)}" alt="${escapeHtml(user.displayName || 'Unknown')}" class="w-full h-full object-cover">
              </div>
              <div>
                <span class="font-bold block" style="color:${nameColor}">${escapeHtml(user.displayName || 'Unknown')}</span>
                <span class="block text-xs text-gray-500">
                  ${p.timestamp ? new Date(p.timestamp).toLocaleDateString() : (p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '')}
                </span>
              </div>
            </div>
            ${mediaHtml}
            <div class="text-sm text-gray-300 mt-3 line-clamp-2">${escapeHtml(p.description || p.caption || '')}</div>
            <div class="flex justify-between items-center pt-2 mt-2 border-t border-white/10">
              <div class="flex items-center gap-4 text-gray-400 text-sm">
                <div class="flex items-center gap-1.5" title="Views"><i class="fas fa-eye"></i><span>${views.toLocaleString()}</span></div>
                <div class="flex items-center gap-1.5 text-orange-400" title="Reactions"><i class="fas fa-fire"></i><span>${fireCount.toLocaleString()}</span></div>
                <div class="flex items-center gap-1.5 text-blue-400" title="Thumbs Down"><i class="fas fa-thumbs-down"></i><span>${thumbsDown.toLocaleString()}</span></div>
              </div>
              <button class="open-post-indicator text-xs px-3 py-1 rounded-full bg-white/10 hover:bg-white/20" onclick="event.stopPropagation(); openPostOverlay('${p.uid}','${p.postId}')">Open</button>
            </div>
          </div>
        </div>
      `;
    }

    window.openPostOverlay = (uid, postId) => {
        const overlay = document.getElementById('postOverlay');
        const body = document.getElementById('poBody');
        if (currentPostPath) {
            db.ref(`${currentPostPath}/reactions`).off();
            db.ref(`${currentPostPath}/comments`).off();
            currentPostPath = null;
        }
        body.innerHTML = '<div class="text-center p-8">Loading clip...</div>';
        overlay.classList.remove('hidden');
        const path = `users/${uid}/posts/${postId}`;
        db.ref(path).once('value').then(snap => {
            const post = snap.val();
            const author = allUsersData[uid] || {};
            if (!post || !author) {
                body.innerHTML = '<div class="text-center p-8">Could not load clip.</div>';
                return;
            }
            currentPostPath = path;
            let mediaHtml = '';
            if (post.video) {
                mediaHtml = `<video controls class="w-full rounded-lg bg-black max-h-[60vh]" src="${post.video}"></video>`;
            } else if (post.image) {
                mediaHtml = `<img src="${post.image}" class="w-full rounded-lg bg-black object-contain max-h-[60vh]">`;
            } else if (post.ytId) {
                mediaHtml = `<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/${post.ytId}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
            } else {
                 mediaHtml = `<p class="text-center text-gray-400 p-4">No media found for this post.</p>`;
            }
            const hasCust = author.profileCustomization && (author.codesUnlocked?.diamond || author.codesUnlocked?.emerald);
            const nameColor = hasCust && author.profileCustomization?.nameColor ? author.profileCustomization.nameColor : '#ffffff';
            const displayName = escapeHtml(author.displayName || 'Unknown');
            const timestamp = post.timestamp ? new Date(post.timestamp).toLocaleString() : (post.createdAt ? new Date(post.createdAt).toLocaleString() : '');
            const description = escapeHtml(post.description || post.caption || '');
            body.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    ${avatarImg(getAvatarUrl(author), 'w-12 h-12 rounded-full object-cover')}
                    <div>
                        <p class="font-bold" style="color:${nameColor}">${displayName}</p>
                        <p class="text-xs text-gray-400">${timestamp || 'Just now'}</p>
                    </div>
                </div>
                ${description ? `<p class="mb-3">${description}</p>` : ''}
                ${mediaHtml}
                <div class="mt-3 flex flex-wrap gap-2" id="poReactions"></div>
                <div class="mt-4 border-t border-white/10 pt-4">
                    <h4 class="font-bold mb-2">Comments</h4>
                    <ul class="space-y-3" id="poComments"></ul>
                    <!-- Add Comment Input -->
                     <div class="mt-4 flex gap-2">
                        <input id="newCommentInput" type="text" placeholder="Add a comment..." class="flex-1 bg-gray-700 text-white p-2 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="submitCommentBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Send</button>
                    </div>
                </div>
            `;

            // Add comment submission logic
            document.getElementById('submitCommentBtn').onclick = () => {
                const text = document.getElementById('newCommentInput').value.trim();
                if (text && currentUser && currentPostPath) {
                    db.ref(`${currentPostPath}/comments`).push({
                        uid: currentUser.uid,
                        text: text,
                        time: firebase.database.ServerValue.TIMESTAMP
                    });
                    document.getElementById('newCommentInput').value = ''; // Clear input
                } else if (!currentUser) {
                    kcAlert('Please log in to comment.');
                }
            };

            // Increment views (if not already counted recently by this user?) - simple increment for now
            db.ref(`${path}/views`).transaction(n => (n || 0) + 1);
            // Listen for reactions and comments
            db.ref(`${path}/reactions`).on('value', snap2 => renderPostReactions(snap2, document.getElementById('poReactions')));
            db.ref(`${path}/comments`).on('value', snap3 => renderPostComments(snap3, document.getElementById('poComments')));
        }).catch(error => {
            console.error("Error fetching post:", error);
            body.innerHTML = '<div class="text-center p-8 text-red-400">Error loading clip.</div>';
        });
    };

            </div>
            <h3 class="text-xl font-bold" style="color:${u.profileCustomization?.nameColor || '#e5e7eb'}">${escapeHtml(u.displayName || 'Unknown')}</h3>

    // PATCH 2: Replace joinOrRequestToJoinClan (No changes needed here, it was correct)
    function joinOrRequestToJoinClan(clanId){
      const u = currentUser;
      if(!u) { kcAlert('Please log in.'); return; }
      const clan = allClansData[clanId];
      if(!clan){ kcAlert('Clan not found.'); return; }

      const uid = u.uid;
      const alreadyMember = !!(clan.members && clan.members[uid]);

      if (alreadyMember) { kcAlert('You are already a member of this clan.'); return; }

      const userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[currentUser.uid]);
        if (userClanId) {
            return kcAlert("You are already in a clan. Please leave it before joining a new one.");
        }

      if (clan.isOpen) {
        // 1) Add to members — allowed by rules for the user themselves
        db.ref(`clans/${clanId}/members/${uid}`).set(true).then(() => {
          // 2) BEST-EFFORT: set default rank AFTER membership exists (ignore errors)
          const ordered = (clan.ranks && clan.ranks.order) || ['Owner','Member'];
          const defaultRank = ordered[ordered.length - 1] || 'Member';
          return db.ref(`clans/${clanId}/memberRanks/${uid}`).set(defaultRank).catch(()=>{ console.warn("Could not set default rank after join."); });
        }).then(() => {
          selectClan(clanId); // Select the clan after successfully joining
          kcAlert('You have joined this clan.');
        }).catch(err => {
          console.error('Join failed:', err);
          kcAlert('Unable to join this clan right now.');
        });
      } else {
        // Private clan — request to join
        db.ref(`clans/${clanId}/requests/${uid}`).set(true).then(() => {
          kcAlert('Request sent to the clan leaders.');
        }).catch(err => {
          console.error('Request failed:', err);
          kcAlert('Unable to send request right now.');
        });
      }
    }


    async function leaveClan(clanId) {
      if (!currentUser) return kcAlert("You must be logged in.");
      const uid = currentUser.uid;
      const clan = allClansData[clanId];
      if (!clan || !clan.members || !clan.members[uid]) {
           return kcAlert("You are not currently a member of this clan.");
      }

      // Check if the user is the owner
      const ownerUid = getOwnerUid(clan);
      if (ownerUid === uid) {
          // Check if there are other members
          const memberCount = Object.keys(clan.members).length;
          if (memberCount > 1) {
              return kcAlert("You cannot leave the clan as the owner. Please transfer ownership first or remove all other members.");
          } else {
              // Owner is the only member, allow deletion after confirmation
              // TODO: Replace window.prompt with a custom modal for better UX/security
              const confirmDelete = window.prompt(`You are the last member and owner. Type the clan name "${clan.name}" to confirm deletion.`);
              if (confirmDelete === clan.name) {
                  try {
                      await db.ref(`clans/${clanId}`).remove();
                      clearSelectedClan();
                      kcAlert("Clan deleted as you were the last member.");
                      return; // Exit function after deletion
                  } catch (error) {
                      console.error("Error deleting clan:", error);
                      return kcAlert("Error deleting clan: " + error.message);
                  }
              } else {
                  return kcAlert("Clan deletion cancelled.");
              }
          }
      }

      // If not the owner or if deletion was handled above, proceed with leaving
      try {
        // Use scoped updates for safety
        await db.ref(`clans/${clanId}/members/${uid}`).remove();
        await db.ref(`clans/${clanId}/memberRanks/${uid}`).remove();

        // Also remove from leaders if they are one
        if (clan?.leaders && clan.leaders[uid]) {
          await db.ref(`clans/${clanId}/leaders/${uid}`).remove();
        }

        clearSelectedClan(); // Go back to hub view
        kcAlert("You have left the clan.");
      } catch (error) {
        console.error("Error leaving clan:", error);
        kcAlert("Unexpected error while leaving: " + error.message);
      }
    }

    function attachAuthFormListeners() {
        const toLoginLink = document.getElementById('toLoginLink');
        const toRegisterLink = document.getElementById('toRegisterLink');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('formTitle');

        if(toLoginLink) toLoginLink.onclick = e => { e.preventDefault(); registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); formTitle.innerText = 'Login'; };
        if(toRegisterLink) toRegisterLink.onclick = e => { e.preventDefault(); loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); formTitle.innerText = 'Register'; };

        loginForm.onsubmit = e => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value).catch(err => kcAlert(err.message));

        registerForm.onsubmit = e => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(cred => {
                    const userRef = db.ref('users/' + cred.user.uid);
                    userRef.set({
                        displayName: name,
                        email: email,
                        joined: firebase.database.ServerValue.TIMESTAMP,
                        avatar: `https://kevinmidnight7-sudo.github.io/messageboardkc/${Math.floor(Math.random() * 12) + 1}.png`,

                           nameColor: '#e5e7eb'
                        }

                    return cred.user.updateProfile({ displayName: name });
                })
                .then(() => kcAlert('Registration successful! Please log in.'))
                .catch(err => kcAlert(err.message));
        };
    }

            delClanSel.innerHTML = clanEntriesDel.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${c.id})</option>`).join('')
                                || '<option value="">No clans found</option>';

            document.getElementById('deleteClanBtn').onclick = async () => {
                const clanIdToDelete = document.getElementById('deleteClanSelect').value;
                const confirmName = document.getElementById('deleteClanConfirmInput').value;

                if (!clanIdToDelete) return kcAlert('Please select a clan to delete.');

                const clanToDelete = allClansData[clanIdToDelete];
                if (!clanToDelete) return kcAlert('Selected clan data not found.');

                if (clanToDelete.name === confirmName) {
                    // Double check with a non-standard prompt
                    // TODO: Replace window.prompt with a custom modal
                    const finalConfirm = window.prompt(`ARE YOU ABSOLUTELY SURE you want to delete "${clanToDelete.name}"? This cannot be undone. Type 'DELETE FOREVER' to confirm.`);
                    if (finalConfirm === 'DELETE FOREVER') {
                        try {
                            await db.ref(`clans/${clanIdToDelete}`).remove();
                            kcAlert(`Clan "${clanToDelete.name}" deleted successfully.`);
                            // Refresh admin panel view if needed, or close modal
                            renderAdminPanel('clans');
                            document.getElementById('deleteClanConfirmInput').value = ''; // Clear confirmation
                        } catch (e) {
                             console.error("Error deleting clan:", e);
                             kcAlert('Error deleting clan: ' + e.message);
                        }
                    } else {
                        kcAlert('Deletion cancelled.');
                    }
                } else {
                    kcAlert('Confirmation name does not match the selected clan name.');
                }
            };
        }
    }

    function renderClanSettingsContent(clanId, tab) {
        const contentEl = document.getElementById('clanSettingsContent');
        if (!contentEl) return;
        const clan = allClansData[clanId];
        if (!clan) return; // Exit if clan data isn't loaded yet

        // Permissions check for sensitive tabs

        const isLeader = userIsLeader(clan, currentUser.uid);

        const canManageUsers = isAdmin || isOwner || isLeader;

        const canManageRelations = isAdmin || isOwner || isLeader;

                <label class="block text-sm font-medium text-gray-300 mb-1">Icon URL</label>
                <input id="editClanIcon" class="w-full bg-gray-800 p-2 rounded mb-3 border border-gray-600" value="${escapeHtml(clan.icon)}">

                <label class="block text-sm font-medium text-gray-300 mb-1">Letter Tag (1-4 letters)</label>
                <input id="editClanTag" class="w-full bg-gray-800 p-2 rounded mb-3 border border-gray-600" value="${escapeHtml(clan.letterTag || '')}">

                 contentEl.innerHTML = `<p class="text-gray-400 text-center py-8">Only Admins, the Clan Owner, or Leaders can manage users.</p>`;
                 return;
             }
            const orderedRanks = clan.ranks?.order || ["Owner", "Member"];
            const ownerRank = orderedRanks[0] || 'Owner';
            const defaultRank = orderedRanks[orderedRanks.length - 1] || 'Member';

             // Join Requests Section
             const requests = clan.requests ? Object.keys(clan.requests) : [];
             let requestsHtml = '<p class="text-gray-400 italic">No pending requests.</p>';
             if (requests.length > 0) {
                 requestsHtml = requests.map(uid => {
                    const user = allUsersData[uid];
                    if (!user) return ''; // Skip if user data not loaded
                    return `
                        <div class="flex items-center p-2 bg-gray-800 rounded border border-gray-700 gap-3">
                            ${avatarImg(getAvatarUrl(user), 'w-8 h-8 rounded-full mr-2 object-cover flex-shrink-0')}
                            <span class="truncate flex-1">${escapeHtml(user.displayName || 'Unknown User')}</span>
                            <div class="ml-auto flex gap-2 flex-shrink-0">

                                <button title="Decline Request" onclick="handleRequest('${clanId}','${uid}', false)" class="bg-red-500 hover:bg-red-600 w-8 h-8 rounded flex items-center justify-center text-white">❌</button>

                    const rankOptions = orderedRanks.map(rank =>

            const maxRanks = 8;

            contentEl.innerHTML = `
                <h4 class="font-bold mb-2 text-lg">Manage Ranks</h4>
                <p class="text-sm text-gray-400 mb-3">Create up to ${maxRanks} ranks. Drag to re-order (highest rank first). The top rank is always the Owner and cannot be moved, renamed, or deleted.</p>
                <div id="rankEditorList" class="space-y-2">
                    ${originalRanksOrder.map((rank, index) => renderRankEditorRow(rank, index, originalRanksOrder.length)).join('')}
                </div>
                <button id="addRankBtn" class="w-full bg-green-600 hover:bg-green-700 p-2 rounded mt-4 font-semibold" ${originalRanksOrder.length >= maxRanks ? 'disabled' : ''}>+ Add New Rank</button>
                <button id="saveRanksBtn" class="w-full bg-blue-500 hover:bg-blue-600 p-2 rounded mt-2 font-semibold">Save Rank Order & Names</button>
            `;

            // Attach event listeners
            document.getElementById('addRankBtn').onclick = () => addRankRow();
            document.getElementById('saveRanksBtn').onclick = () => handleSaveRanksClick(clanId);

            const rankList = document.getElementById('rankEditorList');
            // Use event delegation for delete buttons
            rankList.addEventListener('click', (e) => {
                const delBtn = e.target.closest('.delete-rank-btn');
                if (delBtn && !delBtn.disabled) {
                    // Confirmation before deleting
                     const row = delBtn.closest('.rank-editor-row');
                     const rankName = row.querySelector('.rank-name-input')?.dataset.originalName || 'this rank';

                     if (window.confirm(`Are you sure you want to delete the rank "${rankName}"? Members with this rank will be moved to the lowest rank.`)) {
                         deleteRankRow(row);
                     }

             updateRankEditorControls();

    async function saveClanDetails(clanId) {
      // Basic validation
      const name = document.getElementById('editClanName').value.trim();
      const icon = document.getElementById('editClanIcon').value.trim();
      const description = document.getElementById('editClanDesc').value.trim();
      const letterTag = document.getElementById('editClanTag').value.trim().toUpperCase();
      const region = document.getElementById('editClanRegion').value;
      const isOpen = document.getElementById('joinToggle').checked;

      if (!name) return kcAlert("Clan Name cannot be empty.");
      if (!icon) return kcAlert("Icon URL cannot be empty."); // Basic check, could add URL validation
      if (!/^[A-Z]{1,4}$/.test(letterTag)) return kcAlert("Letter Tag must be 1–4 uppercase letters.");
      if (!REGIONS.includes(region)) return kcAlert("Please choose a valid region.");

      // Check for name collision (case-insensitive, excluding self)
      const nameLower = name.toLowerCase();
      const nameCollision = Object.entries(allClansData).some(([id, c]) => id !== clanId && c.name.toLowerCase() === nameLower);
      if (nameCollision) {
          return kcAlert("Another clan with this name already exists.");
      }

      try {
        await db.ref(`clans/${clanId}`).update({ name, icon, description, isOpen, letterTag, region });
        kcAlert('Clan details saved successfully!');
      } catch (e) {
        console.error("Error saving clan details:", e);
        kcAlert('Save failed: ' + (e?.message || 'Unknown error'));
      }
    }

    async function handleRequest(clanId, userId, accept) {
       try {
            await db.ref(`clans/${clanId}/requests/${userId}`).remove(); // Always remove request
            if(accept) {
                const clan = allClansData[clanId];
                if (!clan) return kcAlert("Clan data not found."); // Safety check

                // Check if user is already in another clan
                const userClanId = Object.keys(allClansData).find(id => allClansData[id].members && allClansData[id].members[userId]);
                 if (userClanId) {
                    return kcAlert("This user is already in another clan. They must leave it first.");
                }

                const orderedRanks = clan.ranks?.order || ["Owner", "Member"];
                const defaultRank = orderedRanks[orderedRanks.length - 1] || "Member";

                // Add member and set default rank using scoped updates
                await db.ref(`clans/${clanId}/members/${userId}`).set(true);
                await db.ref(`clans/${clanId}/memberRanks/${userId}`).set(defaultRank);
                kcAlert("Member accepted.");
            } else {
                 kcAlert("Request declined.");
            }
        } catch (e) {
            console.error("Error handling request:", e);
            kcAlert("Error processing request: " + e.message);
        }
    }

    async function removeMember(clanId, userId) {
        const clan = allClansData[clanId];
        // Cannot kick owner
        if (clan && getOwnerUid(clan) === userId) {
            kcAlert("You cannot kick the clan owner. Transfer ownership first.");
            return;
        }

        // Confirmation
        const user = allUsersData[userId];
        // TODO: Replace window.confirm with a custom modal
        const confirmKick = window.confirm(`Are you sure you want to kick ${user?.displayName || 'this member'} from the clan?`);
        if (!confirmKick) return;

        try {
            // Remove from members, leaders (if applicable), and memberRanks
             await db.ref(`clans/${clanId}/members/${userId}`).remove();
             await db.ref(`clans/${clanId}/leaders/${userId}`).remove(); // Safe to call even if not leader
             await db.ref(`clans/${clanId}/memberRanks/${userId}`).remove();
             kcAlert("Member kicked successfully.");
        } catch (e) {
            console.error("Error removing member:", e);
            kcAlert("Error kicking member: " + e.message);
        }
    }


    async function setRelation(clanId, otherClanId, status) {
        // status can be 'allies', 'enemies', or null (for neutral)
        try {
            // Use a single multi-path update for atomicity
            const updates = {};
            updates[`clans/${clanId}/allies/${otherClanId}`] = null; // Clear both potential statuses
            updates[`clans/${clanId}/enemies/${otherClanId}`] = null;

            if (status) { // If setting ally or enemy
                updates[`clans/${clanId}/${status}/${otherClanId}`] = true;
            }

            await db.ref().update(updates);
            // Optional: Add a subtle confirmation or just rely on UI update
            // console.log(`Relationship with ${otherClanId} set to ${status || 'neutral'}`);
        } catch (e) {
             console.error("Error setting relation:", e);
             kcAlert("Error updating relationship: " + e.message);
        }
    }
