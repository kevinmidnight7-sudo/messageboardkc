    /** Changes a member's rank in the database */
    async function changeMemberRank(clanId, uid, newRank) {
         const clan = allClansData[clanId];
         const ownerUid = getOwnerUid(clan);
         if (uid === ownerUid) {
             kcAlert("Cannot change the owner's rank.");
             // Re-render to reset the dropdown if needed
             renderClanSettingsContent(clanId, 'users');
             return;
         }
         // Optional: Add confirmation?
        try {
            await db.ref(`clans/${clanId}/memberRanks/${uid}`).set(newRank);
            // Maybe add a subtle success indicator? For now, relies on data listener refresh.
        } catch (e) {
            console.error("Error updating rank:", e);
            kcAlert('Error updating rank: ' + e.message);
            // Re-render to reset dropdown on failure
            renderClanSettingsContent(clanId, 'users');
        }
    }

    /** Renders a single row for the rank editor */
    function renderRankEditorRow(rankName, index, totalRanks) {
        const isOwnerRank = index === 0;
        // Owner rank cannot be deleted or renamed
        const canDelete = totalRanks > 2 && !isOwnerRank;
        const isReadOnly = isOwnerRank;

        return `
        <div class="rank-editor-row flex items-center gap-2 p-2 bg-gray-800 rounded border border-gray-700" draggable="${!isOwnerRank}" data-index="${index}">
            <span class="drag-handle ${isOwnerRank ? 'text-gray-600 cursor-not-allowed' : 'text-gray-400 cursor-grab active:cursor-grabbing'}">
                <i class="fa-solid fa-grip-vertical"></i>
            </span>
            <input type="text"
                   class="rank-name-input flex-1 bg-gray-700 p-1 rounded border border-gray-600 focus:ring-1 focus:ring-blue-500"
                   value="${escapeHtml(rankName)}"
                   data-original-name="${escapeHtml(rankName)}"
                   ${isReadOnly ? 'readonly disabled title="Owner rank cannot be renamed"' : ''}>
            <button class="delete-rank-btn text-red-500 hover:text-red-400 disabled:text-gray-600 disabled:cursor-not-allowed"
                    ${!canDelete ? 'disabled title="Cannot delete owner or if only 2 ranks exist"' : 'title="Delete Rank"'} >
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
        `;
    }

    /** Updates controls in the rank editor (delete buttons, add button) */
    function updateRankEditorControls() {
        const list = document.getElementById('rankEditorList');
        if (!list) return;
        const rows = list.querySelectorAll('.rank-editor-row');
        const totalRanks = rows.length;
        const canDeleteAny = totalRanks > 2; // Can delete if more than Owner + 1 Member exist

        rows.forEach((row, index) => {
            const isOwnerRank = index === 0;
            const delBtn = row.querySelector('.delete-rank-btn');
            const nameInput = row.querySelector('.rank-name-input');
            const dragHandle = row.querySelector('.drag-handle');

            // Disable delete for owner or if only 2 ranks total
            if (delBtn) delBtn.disabled = isOwnerRank || !canDeleteAny;
            // Disable rename for owner
            if (nameInput) nameInput.readOnly = isOwnerRank;
             if (nameInput) nameInput.disabled = isOwnerRank;
            // Disable drag for owner
            row.draggable = !isOwnerRank;
            if(dragHandle) dragHandle.classList.toggle('cursor-not-allowed', isOwnerRank);
            if(dragHandle) dragHandle.classList.toggle('text-gray-600', isOwnerRank);
            if(dragHandle) dragHandle.classList.toggle('cursor-grab', !isOwnerRank);
            if(dragHandle) dragHandle.classList.toggle('text-gray-400', !isOwnerRank);
        });

        // Disable add button if max ranks reached
        const addBtn = document.getElementById('addRankBtn');
        if (addBtn) addBtn.disabled = totalRanks >= 8;
    }

    /** Adds a new rank row to the editor UI */
    function addRankRow() {
        const list = document.getElementById('rankEditorList');
        if (!list) return;
        const rows = list.querySelectorAll('.rank-editor-row');
        if (rows.length >= 8) {
             kcAlert("Maximum of 8 ranks reached.");
             return;
        }

        // Find a unique default name
        let newRankName = 'New Rank';
        let counter = 1;
        const existingNames = Array.from(rows).map(row => row.querySelector('.rank-name-input').value.toLowerCase());
        while (existingNames.includes(newRankName.toLowerCase())) {
            newRankName = `New Rank ${counter++}`;
        }

        const newIndex = rows.length;
        const newRowHtml = renderRankEditorRow(newRankName, newIndex, rows.length + 1);
        list.insertAdjacentHTML('beforeend', newRowHtml);

        // Focus the new input
        list.lastElementChild.querySelector('.rank-name-input')?.focus();

        updateRankEditorControls(); // Update delete button states etc.
    }

    /** Removes a rank row element from the editor UI */
    function deleteRankRow(rowElement) {
        rowElement.remove();
        // Re-index remaining rows after deletion
        const list = document.getElementById('rankEditorList');
         if (list) {
            list.querySelectorAll('.rank-editor-row').forEach((row, index) => {
                row.dataset.index = index;
            });
        }
        updateRankEditorControls(); // Update buttons based on new count
    }

    // +++ START NEW HELPER +++
    // Builds a default map where every rank is renameable
    function buildRanksMapFromOrder(order) {
      const m = {};
      order.forEach(r => { m[r] = { renameable: true }; });
      // Force owner to be non-renameable, as a safeguard
      if(order[0]) {
        m[order[0]] = { renameable: false };
      }
      return m;
    }
    // +++ END NEW HELPER +++

    // START_PATCH: Use the exact provided saveRanks function
    // ==== DROP-IN REPLACEMENT ====
    async function saveRanks(clanId, newOrder, newMap, renameMap = {}, deletedRanks = []) {
      const u = currentUser;
      if (!u) { kcAlert('Please log in.'); return; }

      const clan = allClansData[clanId];
      if (!clan) { kcAlert('Clan not found.'); return; }

      // --- Define helpers locally within saveRanks ---
      function getOwnerUid(cl) {
        if (!cl) return null;
        if (typeof cl.owner === 'string') return cl.owner;
        if (cl.owner && typeof cl.owner === 'object') {
          const keys = Object.keys(cl.owner).filter(k => cl.owner[k] === true);
          return keys[0] || null;
        }
        return null;
      }

      function userIsLeader(cl, uid) {
        return !!(cl && cl.leaders && cl.leaders[uid] === true);
      }
      function userIsAdmin(uid) { // Checks session AND global
        return !!(isAdminSession || (allAdminsData && allAdminsData[uid] === true));
      }
      // --- End local helpers ---


      const ownerUid = getOwnerUid(clan);
      const isOwner  = ownerUid && ownerUid === u.uid;
      const isLeader = userIsLeader(clan, u.uid);
      let canManage  = userIsAdmin(u.uid) || isOwner || isLeader; // Initial check

      // JIT Elevation Logic
      if (isOwner && !isLeader && !userIsAdmin(u.uid)) { // Check includes isAdminSession
        try {
          await db.ref(`sessionAdmins/${u.uid}`).set(true);
          isAdminSession = true;
          canManage = true; // Update flag after elevation
          console.log("Owner elevated to session admin for rank save.");
          // Note: onDisconnect() should already be set elsewhere (e.g., during password submit)
        } catch (e) {
          console.error('Owner elevation failed during rank save:', e);
          kcAlert('Unable to gain temporary permission to save ranks. Please try again.');
          return; // Stop if elevation fails
        }
      }

      // Final permission check AFTER potential elevation
      if (!canManage) {
        kcAlert('Permission denied. Only clan owner, leaders, or admins can change ranks.');
        return;
      }

      // DEBUG LOG: Call debugRankWrite right before the rank write attempt
      await debugRankWrite(clanId);

      // 1) Write ONLY the ranks node, with BOTH keys, ensuring correct types
      try {
        // +++ START MODIFICATION: Add payload logging +++
        const ranksPayload = {
          order: Array.isArray(newOrder) ? newOrder : [],
          map: (newMap && typeof newMap === 'object') ? newMap : {}
        };
        console.log('[DEBUG] ranks payload →', JSON.stringify(ranksPayload));
        await db.ref(`clans/${clanId}/ranks`).set(ranksPayload);
        // +++ END MODIFICATION +++
      } catch (e) {
        console.error('Error writing ranks node:', e);
        kcAlert('Error saving ranks configuration: ' + e.message);
        return; // Stop if this critical step fails
      }

      // 2) Adjust memberRanks using a scoped update
      try {
        const snap = await db.ref(`clans/${clanId}/memberRanks`).once('value');
        const currMemberRanks = snap.val() || {};
        const memberUpdates = {}; // Build updates for a single .update() call

        // Apply Renames
        Object.entries(currMemberRanks).forEach(([uid, currentRankName]) => {
          if (renameMap[currentRankName]) {
             memberUpdates[uid] = renameMap[currentRankName];
          }
        });

        // Handle Deletions: fallback to the lowest rank
        const fallbackRank = newOrder.length > 0 ? newOrder[newOrder.length - 1] : 'Member';
        Object.entries(currMemberRanks).forEach(([uid, currentRankName]) => {
          // If the rank was deleted AND it wasn't already handled by a rename
          if (deletedRanks.includes(currentRankName) && !(uid in memberUpdates)) {
            memberUpdates[uid] = fallbackRank;
          }
        });


        // Perform the scoped update only if there are changes
        if (Object.keys(memberUpdates).length > 0) {
          console.log(`[DEBUG] Updating memberRanks for ${Object.keys(memberUpdates).length} users.`);
          await db.ref(`clans/${clanId}/memberRanks`).update(memberUpdates);
        } else {
           console.log("[DEBUG] No memberRank updates needed.");
        }
      } catch (e) {
        console.error('Error updating member ranks:', e);
        kcAlert('Ranks configuration saved, but failed to update some member assignments: ' + e.message);
        // Continue to UI refresh even if this part fails
      }

      // Success message (only if no previous alert was shown)
      if (kcAlertEl.classList.contains('hidden')) { // Check if alert is hidden
          kcAlert('Ranks saved successfully.');
      }

      // Update local state and refresh UI
      originalRanksOrder = [...newOrder];
      activeSettingsTab = 'ranks';
      renderClanSettingsContent(clanId, 'ranks');
    }
    // END_PATCH

    // Handler for the "Save Ranks" button click
    function handleSaveRanksClick(clanId) {
        const list = document.getElementById('rankEditorList');
        if (!list) return;

        const inputs = Array.from(list.querySelectorAll('.rank-name-input'));
        const newOrder = [];
        const renames = {};
        const oldNamesInDOM = []; // Store original names currently in the DOM
        let validationError = null;

        // --- Validation and Data Collection ---
        inputs.forEach((input, index) => {
            const newName = input.value.trim();
            const oldName = input.dataset.originalName; // Original name when tab loaded/row created

            // Basic Name Validation
            if (!newName || newName.length < 1 || newName.length > 24) {
                validationError = 'Rank names must be between 1 and 24 characters.';
            }
            // Uniqueness Check (case-insensitive)
            if (newOrder.some(existing => existing.toLowerCase() === newName.toLowerCase())) {
                 validationError = `Rank name "${newName}" is duplicated. Names must be unique (case-insensitive).`;
            }
             // Owner rank cannot be renamed (redundant check, input is disabled, but good safeguard)
            if (index === 0 && newName !== oldName) {
                 validationError = `The Owner rank cannot be renamed.`;
                 input.value = oldName; // Reset visually
            }

             if (validationError) return; // Stop processing this input if error found

            newOrder.push(newName); // Add validated name to the new order

            // Track renames: If the original name existed and is different from the new name
            if (oldName && newName !== oldName && index !== 0) { // Don't track owner rename attempt
                renames[oldName] = newName;
            }
            // Keep track of which *original* ranks are still present
            if (oldName) {
                oldNamesInDOM.push(oldName);
            }
        });

        // If validation failed during loop, show error and stop
        if (validationError) {
            return kcAlert(validationError);
        }

        // Rank Count Validation
        if (newOrder.length < 2 || newOrder.length > 8) {
            validationError = 'You must have between 2 and 8 ranks.';
        }

        // If count validation failed, show error and stop
        if (validationError) {
            return kcAlert(validationError);
        }

        // Determine deleted ranks by comparing the initial `originalRanksOrder`
        // with the list of *original names* still present in the DOM (`oldNamesInDOM`)
        const deletedRanks = originalRanksOrder.filter(r => !oldNamesInDOM.includes(r));

        // +++ START MODIFICATION: Build the map +++
        const newMap = buildRanksMapFromOrder(newOrder);
        // +++ END MODIFICATION +++

        console.log("[DEBUG] handleSaveRanksClick Data:", { clanId, newOrder, newMap, renames, deletedRanks, originalRanksOrder, oldNamesInDOM });

        // --- Call the saveRanks function ---
        // Pass the newly built newMap
        saveRanks(clanId, newOrder, newMap, renames, deletedRanks)
            .catch(e => {
                // Catch potential promise rejections from saveRanks itself
                console.error("Error during saveRanks call:", e);
                 // Show generic error only if saveRanks didn't already show one
                 if (kcAlertEl.classList.contains('hidden')) {
                    kcAlert('An unexpected error occurred while saving ranks: ' + e.message);
                 }
            });
    }

    // --- Drag and Drop Handlers for Ranks ---
    function handleDragStart(e) {
        // Only allow dragging non-owner rows
        if (e.target.classList.contains('rank-editor-row') && e.target.dataset.index !== '0') {
            dragSrcElement = e.target;
            e.dataTransfer.effectAllowed = 'move';
            // Optional: You could set data, but we mainly rely on DOM manipulation
            // e.dataTransfer.setData('text/plain', e.target.dataset.index);
            e.target.classList.add('dragging'); // Add visual style for dragging element
        } else {
            e.preventDefault(); // Prevent dragging owner row
        }
    }

    function handleDragOver(e) {
        e.preventDefault(); // Necessary to allow dropping
        e.dataTransfer.dropEffect = 'move';

        // Optional: Add a visual indicator where the drop will happen
        const targetRow = e.target.closest('.rank-editor-row');
        // Remove previous indicators
        document.querySelectorAll('.drop-indicator').forEach(el => el.remove());

        if (targetRow && targetRow !== dragSrcElement && targetRow.dataset.index !== '0') { // Don't indicate on self or owner row
            const rect = targetRow.getBoundingClientRect();
            const offsetY = e.clientY - rect.top;
            const indicator = document.createElement('div');
            indicator.className = 'drop-indicator h-1 bg-blue-500 my-1'; // Style as needed

            if (offsetY < rect.height / 2) {
                // Insert indicator before the target row
                targetRow.parentNode.insertBefore(indicator, targetRow);
            } else {
                // Insert indicator after the target row
                 targetRow.parentNode.insertBefore(indicator, targetRow.nextSibling);
            }
        }
    }

    function handleDrop(e) {
        e.stopPropagation(); // Prevent default browser behavior
        e.preventDefault(); // Prevent default drop handling
         // Remove any drop indicators
        document.querySelectorAll('.drop-indicator').forEach(el => el.remove());

        if (dragSrcElement) {
            const dropTarget = e.target.closest('.rank-editor-row');

            // Ensure drop is valid: target exists, not dropping on self, not dropping on owner row (index 0)
            if (dropTarget && dragSrcElement !== dropTarget && dropTarget.dataset.index !== '0') {
                const list = document.getElementById('rankEditorList');
                const rect = dropTarget.getBoundingClientRect();
                const offsetY = e.clientY - rect.top;

                // Insert dragged element before or after the drop target based on drop position
                if (offsetY < rect.height / 2) {
                     list.insertBefore(dragSrcElement, dropTarget);
                } else {
                     list.insertBefore(dragSrcElement, dropTarget.nextSibling);
                }
            }
        }
        // No return false needed with preventDefault
    }

    function handleDragEnd(e) {
         // Remove dragging class from the source element
        if (dragSrcElement) {
            dragSrcElement.classList.remove('dragging');
        }
        dragSrcElement = null; // Clear reference
         // Remove any lingering drop indicators
        document.querySelectorAll('.drop-indicator').forEach(el => el.remove());

        // Update dataset indices and button states after the DOM has been reordered
        const list = document.getElementById('rankEditorList');
        if (list) {
            list.querySelectorAll('.rank-editor-row').forEach((row, index) => {
                row.dataset.index = index; // Re-assign index based on new DOM order
            });
            updateRankEditorControls(); // Refresh delete/drag enable/disable states
        }
    }

    // +++ START PROFILE COLLAPSE JS +++
    function initProfileCollapse() {
      const card   = document.getElementById('profileCollapsible');
      const toggle = document.getElementById('profileToggle');
      const shell  = document.getElementById('user-profile-full'); // outer card already has class "profile-card"

      if (!card || !toggle || !shell) {
        console.warn("Profile collapse elements not found.");
        return;
      }

      let expanded = false;

      const setState = (open) => {
        expanded = open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('title', open ? 'Collapse profile' : 'Show full profile');
        card.classList.toggle('expanded', open);
        toggle.classList.toggle('rotate', open);
        shell.classList.toggle('overlay-open', open);

        // Clear previous animation classes before adding new one
        card.classList.remove('elastic-open', 'elastic-close');

        // Apply elastic micro-animation
        // We need a reflow between removing and adding the class for animation to restart
        void card.offsetWidth;
        card.classList.add(open ? 'elastic-open' : 'elastic-close');
      };

      toggle.onclick = (e) => {
        e.preventDefault();
        setState(!expanded);
      };

      // Set initial state (collapsed) without animation on load
      expanded = false;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('title', 'Show full profile');
      card.classList.remove('expanded');
      toggle.classList.remove('rotate');
      shell.classList.remove('overlay-open');
    }
    // +++ END PROFILE COLLAPSE JS +++

        if (clanToggleInput) {

              showTopScoreClans = e.target.checked;
              document.getElementById('toggleLabel').textContent = showTopScoreClans ? 'Top Score' : 'Biggest';
              renderBiggestClans(); // Re-render the carousel with new sorting
            });
        }

        // Clan Carousel Buttons
        const clansWrapper = document.getElementById('biggest-clans-wrapper');
        const prevBtn = document.getElementById('clans-prev');
        const nextBtn = document.getElementById('clans-next');
        if (clansWrapper && prevBtn && nextBtn) {
            const scrollAmount = () => clansWrapper.clientWidth * 0.8; // Calculate based on current width
            prevBtn.addEventListener('click', () => clansWrapper.scrollBy({ left: -scrollAmount(), behavior: 'smooth' }));
            nextBtn.addEventListener('click', () => clansWrapper.scrollBy({ left: scrollAmount(), behavior: 'smooth' }));
        }

        // Firebase Auth State Change Listener
        auth.onAuthStateChanged(user => {
            detachDataListeners(); // Stop listening to previous user's data (or public data)
            currentUser = user; // Update global current user state

            if(user){
                 console.log("User logged in:", user.uid);
                // Check for existing session admin status on page load/refresh
                if (sessionStorage.getItem('kc_isAdminSession') === '1') {
                    isAdminSession = true;
                    console.log("Admin session restored from sessionStorage.");
                    // Re-establish sessionAdmin flag and onDisconnect handler
                    const sRef = db.ref(`sessionAdmins/${user.uid}`);
                     sRef.set(true).then(() => {
                        sRef.onDisconnect().remove(); // Ensure cleanup on disconnect
                     }).catch(e => console.error("Error re-setting session admin flag:", e));
                } else {
                    isAdminSession = false; // Ensure it's false if not in session storage
                }
                attachDataListeners(); // Start listening to data, which triggers renderPage
            } else {
                console.log("User logged out.");
                // Clear session state on logout
                isAdminSession = false;
                sessionStorage.removeItem('kc_isAdminSession');
                // Clear all fetched data
                allClansData = {}; allUsersData = {}; allBadgesData = {}; allAdminsData = {};
                selectedClanId = null; // Reset selection
                activeSettingsTab = null;
                renderLoginView(); // Show the login form
            }
        });

        // Close modals on Escape key press
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                 document.getElementById('adminPasswordModal').classList.add('hidden');
                 document.getElementById('createClanPasswordModal').classList.add('hidden');
                 document.getElementById('createClanModal').classList.add('hidden');
                 document.getElementById('adminPanelModal').classList.add('hidden');
                 document.getElementById('profileOverlay').classList.add('hidden');
                 closePostOverlay(); // Use existing function for post overlay
            }
        });

    }); // End DOMContentLoaded
