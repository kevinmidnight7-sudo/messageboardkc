<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - User Verification & Badge Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs (Compat version to match your login.html) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    /* Custom scrollbar for logs modal */
    #badgeLogsList::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #badgeLogsList::-webkit-scrollbar-thumb {
      background-color: rgba(100, 116, 139, 0.5);
      border-radius: 4px;
    }
    #badgeLogsList::-webkit-scrollbar-thumb:hover {
      background-color: rgba(71, 85, 105, 0.7);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Admin Login Overlay -->
  <div id="admin-login-container" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm text-center">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Admin Access</h2>
      <p class="text-gray-600 mb-6">Please sign in with your admin account.</p>
      <input type="email" id="adminEmail" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Admin Email">
      <input type="password" id="adminPass" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Admin Password">
      <button id="adminLoginBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold mt-6 hover:bg-blue-700 transition duration-300">Login</button>
      <p id="loginError" class="text-red-500 text-sm mt-4"></p>
    </div>
  </div>

  <!-- Admin Dashboard (Hidden by default) -->
  <div id="admin-dashboard" class="hidden container mx-auto p-4 md:p-8">
    <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
      <div class="p-6 border-b border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800">User Verification Management</h1>
        <p class="text-gray-600 mt-1">Real-time list of all registered users.</p>
      </div>
      <!-- Controls: Manage Badges & Logs -->
      <div class="p-4 flex flex-col md:flex-row justify-end space-y-2 md:space-y-0 md:space-x-3">
        <button id="manageBadgesBtn" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition duration-200">Manage Badges</button>
        <button id="viewBadgeLogsBtn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition duration-200">Recent Badge Changes</button>
      </div>
      <!-- User List Header -->
      <div class="hidden md:flex bg-gray-50 p-4 font-semibold text-gray-600 text-sm">
        <div class="w-2/5">User Email</div>
        <div class="w-1/5">Status</div>
        <div class="w-2/5 text-right">Actions</div>
      </div>
      <!-- User List Container -->
      <div id="userList" class="divide-y divide-gray-200">
        <div class="p-8 text-center text-gray-500">Loading user list...</div>
      </div>
    </div>
  </div>

  <!-- Badge Management Modal -->
  <div id="badgeAdminModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Manage User Badges</h2>
      <label for="badgeUserSearch" class="block text-sm font-medium text-gray-700">Search User</label>
      <input id="badgeUserSearch" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md mb-3" placeholder="Search by display name or email">
      <label for="badgeUserSelect" class="block text-sm font-medium text-gray-700">Select User</label>
      <select id="badgeUserSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md mb-4">
        <!-- Options will be populated dynamically -->
      </select>
      <!-- Current badge counts -->
      <div id="badgeCounts" class="flex justify-around mb-4 text-gray-700 font-medium">
        <div class="text-center">
          <span>Offence:</span> <span id="badgeOffenceCount">0</span>
        </div>
        <div class="text-center">
          <span>Defence:</span> <span id="badgeDefenceCount">0</span>
        </div>
        <div class="text-center">
          <span>Overall:</span> <span id="badgeOverallCount">0</span>
        </div>
      </div>
      <!-- Add badges -->
      <div class="flex justify-around mb-3">
        <button id="addOffenceBtn" data-badge="offence" class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700 transition duration-150">+ Offence</button>
        <button id="addDefenceBtn" data-badge="defence" class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700 transition duration-150">+ Defence</button>
        <button id="addOverallBtn" data-badge="overall" class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700 transition duration-150">+ Overall</button>
      </div>
      <!-- Remove badges -->
      <div class="flex justify-around mb-4">
        <button id="removeOffenceBtn" data-badge="offence" class="bg-red-600 text-white px-3 py-2 rounded hover:bg-red-700 transition duration-150">- Offence</button>
        <button id="removeDefenceBtn" data-badge="defence" class="bg-red-600 text-white px-3 py-2 rounded hover:bg-red-700 transition duration-150">- Defence</button>
        <button id="removeOverallBtn" data-badge="overall" class="bg-red-600 text-white px-3 py-2 rounded hover:bg-red-700 transition duration-150">- Overall</button>
      </div>
      <!-- Modal actions -->
      <div class="flex justify-end space-x-2">
        <button id="saveBadgesBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition duration-150">Save</button>
        <button id="closeBadgeAdminModal" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition duration-150">Close</button>
      </div>
    </div>
  </div>

  <!-- Badge Logs Modal -->
  <div id="badgeLogsModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Badge Changes</h2>
      <ul id="badgeLogsList" class="space-y-3 text-sm text-gray-700">
        <!-- Log items will be added here -->
      </ul>
      <div class="flex justify-end mt-4">
        <button id="closeBadgeLogsModal" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition duration-150">Close</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase Configuration ---
    const cfg = {
      apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
      authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
      databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kckillerscompany-ab1ec",
      storageBucket: "kckillerscompany-ab1ec.appspot.com",
      messagingSenderId: "198711213988",
      appId: "1:198711213988:web:f3cacc413ac9e80dd8cb31",
      measurementId: "G-4LKP2M3JXE"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- DOM References ---
    const adminLoginContainer = document.getElementById('admin-login-container');
    const adminDashboard     = document.getElementById('admin-dashboard');
    const adminEmailInput    = document.getElementById('adminEmail');
    const adminPassInput     = document.getElementById('adminPass');
    const adminLoginBtn      = document.getElementById('adminLoginBtn');
    const loginError         = document.getElementById('loginError');
    const userListContainer  = document.getElementById('userList');
    const manageBadgesBtn    = document.getElementById('manageBadgesBtn');
    const viewBadgeLogsBtn   = document.getElementById('viewBadgeLogsBtn');
    const badgeAdminModal    = document.getElementById('badgeAdminModal');
    const badgeUserSelect    = document.getElementById('badgeUserSelect');
    const badgeUserSearch    = document.getElementById('badgeUserSearch');
    const badgeOffenceCount  = document.getElementById('badgeOffenceCount');
    const badgeDefenceCount  = document.getElementById('badgeDefenceCount');
    const badgeOverallCount  = document.getElementById('badgeOverallCount');
    const addOffenceBtn      = document.getElementById('addOffenceBtn');
    const addDefenceBtn      = document.getElementById('addDefenceBtn');
    const addOverallBtn      = document.getElementById('addOverallBtn');
    const removeOffenceBtn   = document.getElementById('removeOffenceBtn');
    const removeDefenceBtn   = document.getElementById('removeDefenceBtn');
    const removeOverallBtn   = document.getElementById('removeOverallBtn');
    const saveBadgesBtn      = document.getElementById('saveBadgesBtn');
    const closeBadgeAdminModal = document.getElementById('closeBadgeAdminModal');
    const badgeLogsModal     = document.getElementById('badgeLogsModal');
    const badgeLogsList      = document.getElementById('badgeLogsList');
    const closeBadgeLogsModal= document.getElementById('closeBadgeLogsModal');

    // --- Admin Login Logic ---
    adminLoginBtn.addEventListener('click', async () => {
      loginError.textContent = "";
      adminPassInput.classList.remove('border-red-500');
      adminEmailInput.classList.remove('border-red-500');
      const email = adminEmailInput.value.trim();
      const pass = adminPassInput.value;
      if (!email || !pass) {
        loginError.textContent = "Please enter both admin email and password.";
        if (!email) adminEmailInput.classList.add('border-red-500');
        if (!pass) adminPassInput.classList.add('border-red-500');
        return;
      }
      try {
        loginError.textContent = "Authenticating...";
        adminLoginBtn.disabled = true;
        const userCredential = await auth.signInWithEmailAndPassword(email, pass);
        const user = userCredential.user;
        if (user && user.email) {
          const adminEmailKey = user.email.replace(/\./g, ',');
          const adminSnapshot = await db.ref(`admins/${adminEmailKey}`).once('value');
          if (adminSnapshot.val() === true) {
            adminLoginContainer.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            initUserListListener();
            return;
          } else {
            loginError.textContent = "Access Denied. You are not an authorized admin.";
            adminLoginBtn.disabled = false;
            auth.signOut();
            return;
          }
        }
      } catch (err) {
        console.error(err);
        loginError.textContent = err.message;
        adminLoginBtn.disabled = false;
      }
    });
    // Allow Enter key to trigger login
    [adminPassInput, adminEmailInput].forEach(input => {
      input.addEventListener('keyup', e => {
        if (e.key === 'Enter') adminLoginBtn.click();
      });
    });

    // --- User List Logic ---
    function initUserListListener() {
      const usersRef = db.ref("users");
      usersRef.on('value', (snapshot) => {
        userListContainer.innerHTML = '';
        if (!snapshot.exists()) {
          userListContainer.innerHTML = '<div class="p-8 text-center text-gray-500">No users found in the database.</div>';
          return;
        }
        const userArray = [];
        snapshot.forEach((childSnap) => {
          const user = childSnap.val();
          if (user && user.email) {
            userArray.push({ uid: childSnap.key, ...user });
          }
        });
        userArray.sort((a, b) => a.email.localeCompare(b.email));
        userArray.forEach((user) => {
          const uid = user.uid;
          const isVerified = user.emailVerified === true;
          const li = document.createElement('div');
          li.className = 'p-4 flex flex-col md:flex-row md:items-center md:justify-between hover:bg-gray-50 transition duration-150';
          const statusClass = isVerified ? 'text-green-600 bg-green-100' : 'text-red-600 bg-red-100';
          const statusText = isVerified ? 'Verified' : 'Not Verified';
          const verifyBtn = isVerified ?
            `<button class="revoke-btn w-full md:w-auto px-4 py-2 text-sm font-medium text-white bg-yellow-600 rounded-lg hover:bg-yellow-700 transition duration-200" data-uid="${uid}">Revoke</button>` :
            `<button class="verify-btn w-full md:w-auto px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition duration-200" data-uid="${uid}">Verify</button>`;
          const deleteBtn = `<button class="delete-btn w-full md:w-auto px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition duration-200" data-uid="${uid}">Delete</button>`;
          li.innerHTML = `
            <div class="w-full md:w-2/5 mb-2 md:mb-0">
              <div class="font-semibold text-gray-800">${user.email}</div>
              <div class="text-sm text-gray-500">${user.displayName || 'No name'}</div>
            </div>
            <div class="w-full md:w-1/5 mb-2 md:mb-0">
              <span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">${statusText}</span>
            </div>
            <div class="w-full md:w-2/5 flex md:justify-end space-x-2">
              ${verifyBtn}
              ${deleteBtn}
            </div>
          `;
          userListContainer.appendChild(li);
        });
        addEventListenersToButtons();
      }, (error) => {
        console.error(error);
        userListContainer.innerHTML = '<div class="p-8 text-center text-red-500">Error loading user list. Check console.</div>';
      });
    }

    function addEventListenersToButtons() {
      document.querySelectorAll('.verify-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          const uid = e.target.dataset.uid;
          toggleVerification(uid, true);
        });
      });
      document.querySelectorAll('.revoke-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          const uid = e.target.dataset.uid;
          toggleVerification(uid, false);
        });
      });
      document.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          const uid = e.target.dataset.uid;
          if (!uid) return;
          const confirmed = confirm('Are you sure you want to permanently delete this user? This action cannot be undone.');
          if (confirmed) {
            // Remove user data and badges
            Promise.all([
              db.ref('users/' + uid).remove(),
              db.ref('badges/' + uid).remove()
            ]).then(() => {
              console.log('User ' + uid + ' deleted');
              // After deletion, user list will refresh automatically via listener
            }).catch(err => {
              console.error('Failed to delete user:', err);
              alert('Error deleting user. Check console.');
            });
          }
        });
      });
    }

    function toggleVerification(uid, status) {
      if (!uid) return;
      db.ref('users/' + uid + '/emailVerified').set(status)
        .then(() => {
          console.log('User ' + uid + ' status set to ' + status);
        })
        .catch(err => {
          console.error('Failed to update verification status:', err);
          alert('An error occurred. Check the console.');
        });
    }

    // --- Badge Management Logic ---
    let badgeUsers = [];
    let badgeChanges = { offence: 0, defence: 0, overall: 0 };
    let selectedUserId = null;

    // Load users into badge management modal
    async function loadBadgeUsers() {
      const usersSnap = await db.ref('users').once('value');
      badgeUsers = [];
      usersSnap.forEach(uSnap => {
        const val = uSnap.val() || {};
        badgeUsers.push({ uid: uSnap.key, displayName: val.displayName || '', email: val.email || '' });
      });
      renderBadgeUserOptions('');
    }

    // Render user options based on search
    function renderBadgeUserOptions(filter) {
      badgeUserSelect.innerHTML = '';
      const lower = filter.toLowerCase();
      const filtered = badgeUsers.filter(u => {
        return u.displayName.toLowerCase().includes(lower) || u.email.toLowerCase().includes(lower);
      });
      filtered.sort((a, b) => a.displayName.localeCompare(b.displayName) || a.email.localeCompare(b.email));
      filtered.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.uid;
        opt.textContent = u.displayName ? `${u.displayName} (${u.email})` : u.email;
        badgeUserSelect.appendChild(opt);
      });
      // If no selected user or selected user filtered out, select first
      if (!selectedUserId || !filtered.some(u => u.uid === selectedUserId)) {
        selectedUserId = filtered.length > 0 ? filtered[0].uid : null;
      }
      badgeUserSelect.value = selectedUserId || '';
      updateBadgeCountsDisplay();
    }

    // Update the badge counts display for the selected user, including staged changes
    function updateBadgeCountsDisplay() {
      if (!selectedUserId) {
        badgeOffenceCount.textContent = '0';
        badgeDefenceCount.textContent = '0';
        badgeOverallCount.textContent = '0';
        return;
      }
      db.ref('badges/' + selectedUserId).once('value').then(snap => {
        const cur = snap.val() || {};
        badgeOffenceCount.textContent = (cur.offence || 0) + badgeChanges.offence;
        badgeDefenceCount.textContent = (cur.defence || 0) + badgeChanges.defence;
        badgeOverallCount.textContent = (cur.overall || 0) + badgeChanges.overall;
      });
    }

    // Reset staged changes
    function resetBadgeChanges() {
      badgeChanges = { offence: 0, defence: 0, overall: 0 };
    }

    // Event handlers for plus/minus buttons
    function handleBadgeChange(type, delta) {
      badgeChanges[type] += delta;
      updateBadgeCountsDisplay();
    }

    // Save changes to database and log them
    async function saveBadgeChanges() {
      if (!selectedUserId) return;
      // Fetch current values
      const currentSnap = await db.ref('badges/' + selectedUserId).once('value');
      const cur = currentSnap.val() || {};
      const updates = {};
      const logs = [];
      ['offence', 'defence', 'overall'].forEach(k => {
        const diff = badgeChanges[k];
        if (diff !== 0) {
          const newVal = Math.max(0, (cur[k] || 0) + diff);
          updates[k] = newVal;
          logs.push({ type: k, change: diff, newVal });
        }
      });
      if (Object.keys(updates).length === 0) {
        alert('No changes to save.');
        return;
      }
      await db.ref('badges/' + selectedUserId).update(updates);
      // Write logs
      const userInfo = badgeUsers.find(u => u.uid === selectedUserId) || { displayName: '', email: '' };
      const logPromises = logs.map(entry => {
        const logData = {
          uid: selectedUserId,
          displayName: userInfo.displayName || '',
          email: userInfo.email || '',
          badgeType: entry.type,
          change: entry.change,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        };
        return db.ref('badgeLogs').push(logData);
      });
      await Promise.all(logPromises);
      resetBadgeChanges();
      updateBadgeCountsDisplay();
      // Refresh user list if current user is in view
      if (auth.currentUser && auth.currentUser.uid === selectedUserId) {
        // For demonstration we simply reload counts; no user-specific UI here
      }
      alert('Badge changes saved successfully.');
    }

    // Load logs into logs modal
    async function loadBadgeLogs() {
      badgeLogsList.innerHTML = '';
      const logsSnap = await db.ref('badgeLogs').limitToLast(50).once('value');
      const logsArr = [];
      logsSnap.forEach(child => {
        const log = child.val();
        logsArr.push({ ...log, key: child.key });
      });
      // Sort descending by timestamp
      logsArr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      if (logsArr.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No recent badge changes.';
        badgeLogsList.appendChild(li);
        return;
      }
      logsArr.forEach(log => {
        const li = document.createElement('li');
        const date = new Date(log.timestamp || 0);
        const formatted = date.toLocaleString();
        const userName = log.displayName || log.email || log.uid;
        const sign = log.change > 0 ? '+' : '';
        li.innerHTML = `<span class="font-semibold">${userName}</span> ${sign}${log.change} <span class="italic">${log.badgeType}</span> (${formatted})`;
        badgeLogsList.appendChild(li);
      });
    }

    // Event Listeners for badge management modal
    manageBadgesBtn.addEventListener('click', async () => {
      await loadBadgeUsers();
      badgeAdminModal.classList.remove('hidden');
    });
    closeBadgeAdminModal.addEventListener('click', () => {
      badgeAdminModal.classList.add('hidden');
      resetBadgeChanges();
    });
    badgeUserSearch.addEventListener('input', (e) => {
      const val = e.target.value || '';
      renderBadgeUserOptions(val);
    });
    badgeUserSelect.addEventListener('change', (e) => {
      selectedUserId = e.target.value;
      resetBadgeChanges();
      updateBadgeCountsDisplay();
    });
    addOffenceBtn.addEventListener('click', () => handleBadgeChange('offence', 1));
    addDefenceBtn.addEventListener('click', () => handleBadgeChange('defence', 1));
    addOverallBtn.addEventListener('click', () => handleBadgeChange('overall', 1));
    removeOffenceBtn.addEventListener('click', () => handleBadgeChange('offence', -1));
    removeDefenceBtn.addEventListener('click', () => handleBadgeChange('defence', -1));
    removeOverallBtn.addEventListener('click', () => handleBadgeChange('overall', -1));
    saveBadgesBtn.addEventListener('click', () => saveBadgeChanges());

    // Logs modal controls
    viewBadgeLogsBtn.addEventListener('click', async () => {
      await loadBadgeLogs();
      badgeLogsModal.classList.remove('hidden');
    });
    closeBadgeLogsModal.addEventListener('click', () => {
      badgeLogsModal.classList.add('hidden');
    });
    // Close modals when clicking outside content
    badgeAdminModal.addEventListener('mousedown', (e) => {
      if (!e.target.closest('div.bg-white')) {
        badgeAdminModal.classList.add('hidden');
        resetBadgeChanges();
      }
    });
    badgeLogsModal.addEventListener('mousedown', (e) => {
      if (!e.target.closest('div.bg-white')) {
        badgeLogsModal.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
