<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>KC Events Account Action</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --theme-accent: #3b82f6; --theme-accent-rgb: 59,130,246; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #080c14 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; color: #f8fafc;
    }
    #container {
      max-width: 420px; width: 100%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      padding: 2rem; border-radius: 20px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #f8fafc; }
    .hidden { display: none; }
    input {
      width: 100%; padding: .7rem 1rem; margin: .5rem 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #f8fafc;
      font-family: 'Poppins', sans-serif; font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--theme-accent); }
    button {
      width: 100%; padding: .7rem 1rem; margin: .6rem 0;
      background: var(--theme-accent);
      border: none; border-radius: 10px;
      color: #fff; font-family: 'Poppins', sans-serif;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    .message { margin: .5rem 0; color: #94a3b8; font-size: 0.9rem; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
  </style>
  <link rel="stylesheet" href="kc-bg.css"/>
  <script src="kc-bg.js" defer></script>
</head>
<body>
<div id="bg-canvas"></div>
  <div id="container">
    <h1>Account Action</h1>
    <div id="status" class="message">Processing…</div>

    <div id="pwForm" class="hidden">
      <p>Enter a new password:</p>
      <input type="password" id="newPassword" placeholder="New password">
      <button id="pwSubmit">Reset Password</button>
      <div id="pwError" class="message error"></div>
    </div>
  </div>

  <script>
    // 1) Initialize Firebase
    const cfg = {
      apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
      authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
      databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kckillerscompany-ab1ec",
      storageBucket: "kckillerscompany-ab1ec.firebasestorage.app",
      messagingSenderId: "198711213988",
      appId: "1:198711213988:web:f3cacc413ac9e80dd8cb31",
      measurementId: "G-4LKP2M3JXE"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();

    // 2) Parse params
    const params = new URLSearchParams(window.location.search),
          mode    = params.get('mode'),
          oobCode = params.get('oobCode'),
          statusEl = document.getElementById('status'),
          pwForm   = document.getElementById('pwForm'),
          pwInput  = document.getElementById('newPassword'),
          pwSubmit = document.getElementById('pwSubmit'),
          pwError  = document.getElementById('pwError');

    if (!mode || !oobCode) {
      statusEl.textContent = 'Invalid action link.';
      statusEl.classList.add('error');
      throw new Error('Missing mode or oobCode');
    }

    // 3) Handle each mode
    if (mode === 'verifyEmail') {
      auth.applyActionCode(oobCode)
        .then(() => {
          statusEl.textContent = 'Email successfully verified!';
          statusEl.classList.add('success');
          // redirect after a moment
          setTimeout(() =>
            window.location.href = 'https://kcevents.uk/#loginpage'
          , 1500);
        })
        .catch(err => {
          statusEl.textContent = 'Error verifying email: ' + err.message;
          statusEl.classList.add('error');
        });

    } else if (mode === 'resetPassword') {
      // show form
      statusEl.textContent = 'Please choose a new password.';
      pwForm.classList.remove('hidden');

      pwSubmit.onclick = () => {
        const newPassword = pwInput.value.trim();
        if (newPassword.length < 6) {
          pwError.textContent = 'Password must be 6+ chars.';
          return;
        }
        auth.confirmPasswordReset(oobCode, newPassword)
          .then(() => {
            statusEl.textContent = 'Password has been reset!';
            statusEl.classList.add('success');
            pwForm.classList.add('hidden');
            setTimeout(() =>
              window.location.href = 'https://kcevents.uk/#loginpage'
            , 1500);
          })
          .catch(err => {
            pwError.textContent = err.message;
          });
      };

    } else {
      statusEl.textContent = `Unsupported mode: ${mode}`;
      statusEl.classList.add('error');
    }
  </script>
</body>
</html>
