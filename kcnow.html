<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC NOW | Lobby</title>
    
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="profile-popup.js"></script>

    <style>
        :root {
            /* Theme variables for dark mode (default) */
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --bg-primary: #080c14;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --brand-gradient: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --bg-primary: #080c14;
            --bg-secondary: #1e293b;
        }

        /* ===== Phase 5: Light Theme (overrides applied when .light-theme is on <html>) ===== */
        .light-theme {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --bg-primary: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --accent-blue: #2563eb;
        }
        .light-theme #bg-canvas { background: radial-gradient(circle at 50% 50%, #e2e8f0 0%, #f1f5f9 100%) !important; }
        .light-theme .animated-gradient { background: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(45,212,191,0.05) 0%, transparent 40%) !important; }
        .light-theme .vignette { background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.5) 100%) !important; }
        .light-theme .text-gray-400 { color: var(--text-secondary) !important; }
        .light-theme .text-gray-500 { color: var(--text-secondary) !important; }
        .light-theme .text-gray-300 { color: var(--text-primary) !important; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- Background FX --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #080c14 100%);
        }

        .animated-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.08) 0%, transparent 40%);
            animation: drift 20s ease-in-out infinite alternate;
        }

        @keyframes drift { from { transform: scale(1); } to { transform: scale(1.1) rotate(1deg); } }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- UI Components --- */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }

        /* Text color utility overrides to use theme variables */
        .text-gray-400 { color: var(--text-secondary) !important; }
        .text-gray-500 { color: var(--text-secondary) !important; }

        /* Light theme backgrounds for layered effects */
        .light-theme #bg-canvas {
            background: radial-gradient(circle at 50% 50%, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }
        .light-theme .animated-gradient {
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.05) 0%, transparent 40%);
        }
        .light-theme .vignette {
            background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.5) 100%);
        }

        .tab-btn {
            position: relative;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -12px; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px;
            background: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue);
            border-radius: 10px;
        }

        .bottom-banner {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%); padding: 12px 80px;
            border-radius: 100px; z-index: 50; pointer-events: none;
        }
        .banner-sheen::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: sheen 6s infinite;
        }
        @keyframes sheen { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .view-transition { animation: slideUpFade 0.4s ease-out; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .feed-chip.active { background-color: var(--accent-blue); color: white; opacity: 1; }

        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            height: calc(100vh - 240px);
        }
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            body { overflow-y: auto; }
        }
        @media (max-width: 768px) {
            #view-home .grid.grid-cols-3 { grid-template-columns: 1fr 1fr; }
            .fixed.bottom-32.right-8 { display: none; }
            #welcome-card > .flex.items-center { flex-direction: column; text-align: center; }
            #welcome-economy-stats { margin-top: 0.75rem; }
        }

        /* ===== Phase 4 Animations ===== */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.3s ease-out both; }

        .glow-on-hover { transition: all 0.3s; }
        .glow-on-hover:hover { box-shadow: 0 0 20px rgba(59,130,246,0.4), 0 0 40px rgba(59,130,246,0.1); transform: translateY(-2px); }

        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }

        @keyframes pulseSlow { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .pulse-slow { animation: pulseSlow 2s ease-in-out infinite; }

        @keyframes dealCard {
            from { opacity: 0; transform: translateY(-24px) scale(0.85) rotate(-4deg); }
            to   { opacity: 1; transform: translateY(0)    scale(1)    rotate(0deg); }
        }
        .deal-card { animation: dealCard 0.28s ease-out both; }

        @keyframes reelSpin { 0% { transform:translateY(0); } 100% { transform:translateY(-100%); } }
        .slot-reel { transition: font-size 0.1s; }

        @keyframes jackpotFlash { 0%,100%{background:rgba(234,179,8,0.0)} 50%{background:rgba(234,179,8,0.25)} }
        .jackpot-flash { animation: jackpotFlash 0.4s ease-in-out 3; }

        /* ===== Phase 6: Comprehensive Light Theme Overrides ===== */
        .light-theme .glass {
            background: var(--glass-bg);
            border-color: var(--glass-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .light-theme body { color: var(--text-primary); }
        .light-theme .text-white { color: #0f172a !important; }
        .light-theme h1, .light-theme h2, .light-theme h3, .light-theme h4 { color: #0f172a; }
        .light-theme .tab-btn { color: rgba(15, 23, 42, 0.4); }
        .light-theme .tab-btn.active { color: #0f172a; }
        .light-theme .tab-btn.active::after { background: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); }
        .light-theme #welcome-card { background: white !important; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
        .light-theme .bottom-banner { background: rgba(255,255,255,0.95) !important; border-color: rgba(0,0,0,0.08) !important; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); }
        .light-theme .bottom-banner .text-white { color: #0f172a !important; }
        .light-theme .border-white\/5 { border-color: rgba(0,0,0,0.05) !important; }
        .light-theme .border-white\/10 { border-color: rgba(0,0,0,0.10) !important; }
        .light-theme .bg-white\/5 { background: rgba(0,0,0,0.03) !important; }
        .light-theme .bg-white\/10 { background: rgba(0,0,0,0.06) !important; }
        .light-theme .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
        .light-theme #global-modal { background: rgba(0,0,0,0.3); }
        .light-theme .animate-slideInRight { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

        /* ===== Phase 6: Enhanced Mobile Layout ===== */
        @media (max-width: 768px) {
            #view-home .grid.grid-cols-3 { grid-template-columns: 1fr 1fr; }
            #view-home .grid.grid-cols-3 > button { height: 120px; }
            #view-home .grid.grid-cols-3 span.font-bold { font-size: 0.8rem; }
            #welcome-card { flex-direction: column; text-align: center; }
            #welcome-card .flex.items-center.gap-8 { flex-direction: column; gap: 1rem; }
            #user-display-name { font-size: 1.75rem !important; }
            #welcome-economy-stats { margin-top: 0.75rem; }
            .bottom-banner { bottom: 12px; padding: 8px 40px; }
            #global-modal .glass.w-full { max-width: 95vw; max-height: 90vh; }
            #toast-container { top: 80px; right: 12px; left: 12px; max-width: none; }
            .fixed.bottom-32.right-8 { bottom: 100px; right: 12px; }
        }
        @media (max-width: 540px) {
            #view-home .grid.grid-cols-3 { grid-template-columns: 1fr; }
            header nav { gap: 1rem; padding: 0.75rem 1.5rem; }
            .tab-btn { font-size: 0.6rem; letter-spacing: 1px; }
            body { padding: 1rem; }
        }

        /* ===== Phase 6: Smooth Modal & Tab Transitions ===== */
        #global-modal.flex > .glass { animation: modalIn 0.25s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* ===== Dynamic 3D Background Layers ===== */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            perspective: 1200px;
        }
        .kc-bg-scene {
            --mx: 0;
            --my: 0;
            --drift: 0;
            position: absolute;
            inset: -8%;
            transform-style: preserve-3d;
            filter: saturate(1.05);
        }
        .kc-bg-layer {
            position: absolute;
            inset: 0;
            will-change: transform, opacity, filter;
            transition: background 0.35s ease, opacity 0.35s ease;
        }
        .kc-bg-far {
            transform: translate3d(calc(var(--mx) * -18px), calc(var(--my) * -18px), -120px) scale(1.15);
            filter: blur(60px);
        }
        .kc-bg-mid {
            transform: translate3d(calc(var(--mx) * -36px), calc(var(--my) * -36px), -40px) scale(1.08);
            filter: blur(36px);
        }
        .kc-bg-near {
            transform: translate3d(calc(var(--mx) * -58px), calc(var(--my) * -58px), 40px) scale(1.04);
            filter: blur(24px);
            opacity: 0.9;
        }
        .kc-bg-glow {
            transform: translate3d(calc(var(--mx) * -26px), calc(var(--my) * -26px), 10px) scale(1.12);
            mix-blend-mode: screen;
            filter: blur(80px);
            opacity: 0.6;
        }
        /* Default preset backgrounds */
        .kc-bg-scene.default .kc-bg-far {
            background: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.20), transparent 40%),
                        radial-gradient(circle at 75% 65%, rgba(45,212,191,0.14), transparent 38%),
                        radial-gradient(circle at 50% 50%, rgba(15,23,42,0.85), rgba(8,12,20,1) 70%);
        }
        .kc-bg-scene.aurora .kc-bg-mid {
            background: radial-gradient(circle at 25% 40%, rgba(34,211,238,0.24), transparent 32%),
                        radial-gradient(circle at 70% 50%, rgba(59,130,246,0.20), transparent 30%),
                        radial-gradient(circle at 50% 80%, rgba(45,212,191,0.12), transparent 34%);
        }
        /* Sunrise preset backgrounds */
        .kc-bg-scene.sunrise .kc-bg-mid {
            background: radial-gradient(circle at 30% 35%, rgba(252, 165, 219, 0.24), transparent 32%),
                        radial-gradient(circle at 75% 60%, rgba(253, 230, 138, 0.18), transparent 35%),
                        radial-gradient(circle at 50% 80%, rgba(254, 215, 170, 0.14), transparent 38%);
        }
        /* Deep Sea preset backgrounds */
        .kc-bg-scene.deepsea .kc-bg-mid {
            background: radial-gradient(circle at 25% 50%, rgba(34,197,94,0.24), transparent 35%),
                        radial-gradient(circle at 70% 40%, rgba(147,51,234,0.20), transparent 30%),
                        radial-gradient(circle at 50% 75%, rgba(13,148,136,0.18), transparent 36%);
        }
    </style>
</head>
<body class="p-6 md:p-10">

    <div id="bg-canvas"></div>
    <div class="animated-gradient"></div>
    <div class="vignette"></div>

    <!-- 1. Top Navigation Bar -->
    <header class="flex justify-center mb-10 z-50 relative">
        <nav class="glass px-10 py-4 rounded-3xl flex items-center gap-10 md:gap-20">
            <button onclick="switchTab('clans')" class="tab-btn" id="tab-clans">Clans</button>
            <button onclick="switchTab('profile')" class="tab-btn" id="tab-profile">Profile</button>
            <button onclick="switchTab('home')" class="tab-btn active" id="tab-home">Home</button>
            <button onclick="switchTab('players')" class="tab-btn" id="tab-players">Players</button>
            <button onclick="switchTab('clips')" class="tab-btn" id="tab-clips">Clips</button>
        </nav>
    </header>

    <!-- 2. Main Body Grid -->
    <main class="max-w-[1600px] mx-auto main-grid relative z-10">
        <!-- LEFT Area -->
        <section id="content-viewport" class="custom-scroll overflow-y-auto pr-4">
            <!-- HOME TAB -->
            <div id="view-home" class="view-transition flex flex-col gap-8">
                <!-- Welcome Card -->
                <div id="welcome-card" class="glass p-8 rounded-[40px] flex items-center justify-between border-white/5 relative overflow-hidden">
                    <div class="flex items-center gap-8 z-10">
                        <div class="relative group">
                            <div class="absolute -inset-1 bg-blue-500 rounded-full blur opacity-25 group-hover:opacity-50 transition"></div>
                            <img id="user-avatar" src="https://via.placeholder.com/100" class="relative w-24 h-24 rounded-full border-4 border-[#1e293b] object-cover" alt="Avatar">
                            <div id="online-indicator" class="absolute bottom-1 right-1 w-6 h-6 bg-green-500 border-4 border-[#1e293b] rounded-full hidden"></div>
                        </div>
                        <div>
                            <p id="greeting-text" class="text-blue-400 font-bold tracking-widest text-xs uppercase mb-1">Checking Status...</p>
                            <h1 id="user-display-name" class="text-4xl font-bold text-white tracking-tight">Welcome, Guest</h1>
                            <div id="user-badges" class="flex gap-2 mt-3"></div>
                        </div>
                    </div>
                    <div id="auth-actions" class="z-10"></div>
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-500/10 rounded-full blur-[80px]"></div>
                </div>

                <!-- Status Banners (Discord link & Diamond background) -->
                <!-- These containers will be populated dynamically based on user data -->
                <div id="discord-link-status" class="mt-6 space-y-4"></div>
                <div id="diamond-customization-status" class="space-y-4"></div>

                <!-- Hub Buttons -->
                <div class="grid grid-cols-3 gap-6">
                    <!-- Row 1 -->
                    <button onclick="renderLeaderboard()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-yellow-500/10 flex items-center justify-center text-yellow-500 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <span class="font-bold tracking-wide">Leaderboard</span>
                    </button>

                    <button onclick="renderBattledome()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-500 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-sword"></i>
                        </div>
                        <span class="font-bold tracking-wide">Battledome</span>
                        <div class="text-[10px] bg-blue-500/20 text-blue-400 px-3 py-0.5 rounded-full font-black uppercase">Live</div>
                    </button>

                    <button onclick="openSlitherServers()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-green-500/10 flex items-center justify-center text-green-400 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-worm"></i>
                        </div>
                        <span class="font-bold tracking-wide">Slither.io</span>
                        <div class="text-[10px] bg-green-500/20 text-green-400 px-3 py-0.5 rounded-full font-black uppercase">Servers</div>
                    </button>

                    <!-- Row 2 -->
                    <button onclick="openGamesHub()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-purple-500/10 flex items-center justify-center text-purple-400 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-dice"></i>
                        </div>
                        <span class="font-bold tracking-wide">Games</span>
                        <div class="text-[10px] bg-purple-500/20 text-purple-400 px-3 py-0.5 rounded-full font-black uppercase">Casino</div>
                    </button>

                    <button onclick="openEconomyShop()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-400 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-store"></i>
                        </div>
                        <span class="font-bold tracking-wide">Shop</span>
                    </button>

                    <button onclick="openAchievements()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">
                        <div class="w-16 h-16 rounded-2xl bg-yellow-500/10 flex items-center justify-center text-yellow-400 text-3xl group-hover:scale-110 transition">
                            <i class="fa-solid fa-medal"></i>
                        </div>
                        <span class="font-bold tracking-wide">Achievements</span>
                    </button>
                </div>

                <!-- Trending Clips Preview -->
                <div class="glass p-8 rounded-[40px] border-white/5">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
                        <i class="fa-solid fa-bolt text-blue-400"></i> Hot Community Clips
                    </h3>
                    <div id="home-clips-preview" class="grid grid-cols-2 gap-6">
                        <div class="animate-pulse bg-white/5 rounded-3xl h-40"></div>
                        <div class="animate-pulse bg-white/5 rounded-3xl h-40"></div>
                    </div>
                </div>
            </div>

            <!-- PROFILE VIEW -->
            <div id="view-profile" class="view-transition hidden space-y-8">
                <div class="glass p-10 rounded-[40px]">
                    <h2 class="text-3xl font-bold mb-8">Account Summary</h2>
                    <div id="profile-lite-content" class="grid grid-cols-2 gap-10"></div>
                    <!-- Discord link status banner in profile -->
                    <div id="discord-link-status-profile" class="mt-8 space-y-4"></div>
                    <div class="mt-12 flex justify-center">
                        <a href="https://kcevents.uk/#loginpage" target="_blank" rel="noopener" class="px-10 py-4 glass glass-hover border-blue-500/30 text-blue-400 font-bold rounded-2xl flex items-center gap-2 justify-center" title="Opens kcevents.uk in a new tab">
                            Full Profile Options <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1 opacity-60"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- CLANS VIEW (Lite but Functional) -->
            <div id="view-clans" class="view-transition hidden space-y-8">
                <div class="glass p-10 rounded-[40px]">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-3xl font-bold">Clan Registry</h2>
                        <button onclick="loadAllClans()" class="text-xs text-blue-400 font-bold uppercase hover:underline">Refresh List</button>
                    </div>
                    <div id="clans-lite-content" class="space-y-4"></div>
                    <div class="mt-12 flex justify-center">
                        <a href="https://kcevents.uk/#clans" target="_blank" class="px-10 py-4 glass glass-hover border-teal-500/30 text-teal-400 font-bold rounded-2xl">
                            Enter Full Clan Hub <i class="fa-solid fa-arrow-right ml-2"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- PLAYERS VIEW (Embedded profiles.html) -->
            <div id="view-players" class="view-transition hidden space-y-6">
                <div class="glass rounded-[40px] overflow-hidden border-white/5" style="height: calc(100vh - 320px);">
                    <iframe src="profiles.html" class="w-full h-full" style="border:0;"></iframe>
                </div>
            </div>

            <!-- CLIPS VIEW (Native Social Feed) -->
            <div id="view-clips" class="view-transition hidden space-y-6">
                <div class="glass p-6 rounded-[40px]">

    <script>
        // --- DATA & STATE ---
        var currentUser = null, activeTab = 'home', auth, db, storage;
        var allUsersData = [], allClansData = {}, allPostsData = [], feedItems = [];
        const discordIdCache = new Map();

        // ── Session-level Firebase read caches ──────────────────────────────────
        // Each of these fires at most ONCE per page load, no matter how many parts
        // of the UI call them. This prevents the same large collection being
        // downloaded 5+ times and driving up Realtime Database costs.
        let _usersSnapPromise  = null; // Promise<DataSnapshot>  for db.ref('users')
        let _badgesSnapPromise = null; // Promise<DataSnapshot>  for db.ref('badges')

        function _getUsersOnce() {
            if (!_usersSnapPromise)
                _usersSnapPromise = db.ref('users').once('value');
            return _usersSnapPromise;
        }
        function _getBadgesOnce() {
            if (!_badgesSnapPromise)
                _badgesSnapPromise = db.ref('badges').once('value')
                    .catch(() => ({ val: () => ({}) }));
            return _badgesSnapPromise;
        }
        // Call when the user signs out so next sign-in gets fresh data
        function _clearDataCaches() {
            _usersSnapPromise  = null;
            _badgesSnapPromise = null;
            allUsersData = []; allClansData = {}; allPostsData = [];
            clipsLoaded = false;
            discordIdCache.clear();
        }

        // Phase 5 state variables
        let currentTheme = localStorage.getItem('kc-theme') || 'dark';
        let notificationPrefs = JSON.parse(localStorage.getItem('kc-notifications') || '{"achievements":true,"points":true,"clans":true,"clips":true,"users":true,"streaks":true}');
        let friendsList = [];
        let feedSearchQuery = '';
        let feedDateFilter = 'all'; // all, today, week, month
        let searchCategory = 'all';
        let slitherSearchState = { query: '', region: 'all', sort: 'players_desc' };
        let lastSlitherServers = [];
        let lastSlitherModal = null;
        let backgroundPrefs = JSON.parse(localStorage.getItem('kc-background-prefs') || JSON.stringify({ preset: 'default', intensity: 1, reducedMotion: false }));
        let backgroundScene = null;
        let backgroundAnimationId = null;
        let mouseParallax = { x: 0, y: 0, tx: 0, ty: 0 };
        let bgAutoDrift = { x: 0, y: 0, time: 0 };
        let bgShapesCanvas = null, bgShapesCtx = null, bgShapes = [];
        let currentUserData = null;

        // --- Firebase Config (KC Killers Company) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
            authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
            databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kckillerscompany-ab1ec",
            storageBucket: "kckillerscompany-ab1ec.appspot.com",

        // Initialize Firebase only once
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth(); db = firebase.database(); storage = firebase.storage();

        // --- AUTH SYNC ---
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                try { await user.reload(); } catch (e) {}
                db.ref(`users/${user.uid}`).on('value', snap => {
                    const data = snap.val() || {};

        // --- HELPER FUNCTIONS ---
        async function getDiscordIdFromKcUid(kcUid) {
            if (discordIdCache.has(kcUid)) return discordIdCache.get(kcUid);

            // Helper: cache result and optionally persist to users/{uid}/discordId for future fast lookups
            const _found = (discordId, persist) => {
                discordIdCache.set(kcUid, discordId);
                if (persist && discordId) {
                    db.ref(`users/${kcUid}/discordId`).set(discordId).catch(() => {});
                }
                return discordId;
            };

            // 1. Fast path: Discord ID stored directly on the user profile
            try {
                const directSnap = await db.ref(`users/${kcUid}/discordId`).once('value');
                if (directSnap.val()) return _found(directSnap.val(), false);
            } catch(e) { /* no read access */ }

            // 2. Scan config/playerLinks — bot writes kcUid here during /linktokc
            try {
                const plSnap = await db.ref('config/playerLinks').once('value');
                const pl = plSnap.val() || {};
                for (const [discordId, data] of Object.entries(pl)) {
                    if (data && data.kcUid === kcUid) {
                        return _found(discordId, true); // persist so future calls skip this scan
                    }
                }
            } catch(e) {
                console.warn('[getDiscordIdFromKcUid] config/playerLinks scan failed:', e.code || e.message);
            }

            // 3. Fallback: scan discordLinks (may be permission-denied)
            try {
                const linksSnapshot = await db.ref('discordLinks').once('value');
                const links = linksSnapshot.val() || {};
                for (const [discordId, data] of Object.entries(links)) {
                    if (data && data.uid === kcUid) {
                        return _found(discordId, true); // persist so future calls skip scan
                    }
                }
            } catch(e) {
                console.warn('[getDiscordIdFromKcUid] discordLinks scan failed:', e.code || e.message);
            }

            return _found(null, false);
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // --- Greeting Function ---
        function getGreeting() {
            const h = new Date().getHours();
            if (h < 12) return "Good morning";
            if (h < 18) return "Good afternoon";
            return "Good evening";
        }

        // --- Render User Header (Welcome Card) ---
        function renderUserHeader(data, user) {
            const nameEl = document.getElementById('user-display-name');
            const greetingEl = document.getElementById('greeting-text');
            const avatarEl = document.getElementById('user-avatar');
            const badgeEl = document.getElementById('user-badges');
            const actions = document.getElementById('auth-actions');
            const ind = document.getElementById('online-indicator');
            const welcomeCard = document.getElementById('welcome-card');

            greetingEl.textContent = getGreeting() + ',';

            if (user) {
                const avatarUrl = data.avatar || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
                const nameColor = (data.profileCustomizationUnlocked && data.profileCustomization && data.profileCustomization.nameColor) ? data.profileCustomization.nameColor : '#ffffff';
                const customGradient = (data.profileCustomizationUnlocked && data.profileCustomization && data.profileCustomization.gradient) ? data.profileCustomization.gradient : null;
                const isVerified = !!user.emailVerified;
                const isStaff = !!data.isStaff;

                nameEl.textContent = data.displayName || user.displayName || "Member";
                nameEl.style.color = nameColor;
                avatarEl.src = avatarUrl;
                ind.classList.remove('hidden');

                if (customGradient) {
                    welcomeCard.style.background = customGradient;
                    welcomeCard.classList.remove('glass');
                } else {
                    welcomeCard.style.background = '';
                    welcomeCard.classList.add('glass');
                }

                let badges = '';
                if (isVerified) badges += `<i class="fa-solid fa-circle-check text-blue-400 text-xs" title="Verified"></i>`;
                if (isStaff) badges += `<i class="fa-solid fa-shield-halved text-red-500 text-xs" title="Staff"></i>`;
                badgeEl.innerHTML = badges;

                // Show about text
                const existingAbout = document.getElementById('welcome-about');
                if (existingAbout) existingAbout.remove();
                if (data.about) {
                    const aboutDiv = document.createElement('p');
                    aboutDiv.id = 'welcome-about';
                    aboutDiv.className = 'text-sm text-gray-400 italic mt-2 max-w-md';
                    aboutDiv.textContent = `"${data.about}"`;
                    nameEl.parentElement.appendChild(aboutDiv);
                }

                // Auth actions with daily button and economy stats placeholder
                actions.innerHTML = `
                    <div class="flex flex-col items-end gap-3">
                        <div id="welcome-economy-stats"></div>
                        <button onclick="claimDaily()" class="glass px-5 py-2 rounded-2xl font-bold text-blue-400 hover:bg-blue-500/20 transition text-sm">
                            <i class="fa-solid fa-gift mr-2"></i> Claim Daily
                        </button>
                        <button onclick="auth.signOut().then(_clearDataCaches)" class="px-5 py-2 border border-red-500/20 text-red-400 font-bold rounded-xl hover:bg-red-500/10 transition text-xs">SIGN OUT</button>
                    </div>
                `;

                // Fetch Discord economy stats
                getDiscordIdFromKcUid(user.uid).then(discordId => {
                    const statsEl = document.getElementById('welcome-economy-stats');
                    if (!statsEl || !discordId) return;
                    db.ref(`userEconomy/${discordId}`).once('value').then(snap => {
                        const economy = snap.val() || {};
                        const streak = economy.streaks?.login?.current || 0;
                        const points = economy.points || 0;
                        const rank = economy.rank || 'N/A';
                        statsEl.innerHTML = `
                            <div class="glass px-4 py-2 rounded-2xl inline-block text-right">
                                <p class="text-xs text-gray-400 uppercase">Economy</p>
                                <p class="text-lg font-bold text-blue-400">${points.toLocaleString()} pts</p>
                                <p class="text-xs text-gray-400">Rank #${rank}</p>
                            </div>
                            ${streak > 0 ? `<div class="mt-2 glass px-4 py-2 rounded-2xl inline-block">
                                <p class="text-sm font-bold">🔥 ${streak} day streak</p>
                            </div>` : ''}
                        `;
                    });
                    // Add BD badge if available
                    db.ref(`users/${user.uid}/bdHighscore`).once('value').then(bdSnap => {
                        const bdScore = bdSnap.val() || 0;
                        if (bdScore > 0) {
                            badgeEl.innerHTML += ` <span class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded-full font-bold">BD: ${bdScore.toLocaleString()}</span>`;
                        }
                    });
                });
            } else {
                nameEl.textContent = "Welcome, Guest";
                nameEl.style.color = "#ffffff";
                avatarEl.src = "https://via.placeholder.com/100?text=?";
                badgeEl.innerHTML = '';
                ind.classList.add('hidden');
                welcomeCard.style.background = '';
                welcomeCard.classList.add('glass');
                const existingAbout = document.getElementById('welcome-about');
                if (existingAbout) existingAbout.remove();
                actions.innerHTML = `<button onclick="openAuthModal()" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-xl shadow-blue-900/40">SIGN IN</button>`;
            }
        }

        function switchTab(tabId) {

        function switchRightTab(tab) {

        // --- FEED ADAPTER (Live Events) ---
        function initFeedListeners() {
            feedItems = [];
            db.ref('social_posts').off();
            db.ref('users').off();
            db.ref('recentActivity').off();

            db.ref('social_posts').limitToLast(5).on('child_added', snap => {
                const p = snap.val();
                addFeedItem({ type:'clips', title:'New Clip!', user:p.userName, uid:p.createdBy, detail:p.caption, time:'Just now', color:'text-blue-400', icon:'fa-clapperboard' });
            });

            db.ref('users').limitToLast(3).on('child_added', snap => {
                const u = snap.val();
                addFeedItem({ type:'users', title:'New Player!', user:u.displayName, uid:snap.key, detail:'Joined the KC community.', time:'New', color:'text-green-400', icon:'fa-user-plus' });
            });

            db.ref('clans').off();
            db.ref('clans').on('child_changed', snap => {
                const clan = snap.val();
                if (!clan || !clan.members) return;
                const members = Object.keys(clan.members);
                if (members.length === 0) return;
                const latestMember = members[members.length - 1];
                db.ref(`users/${latestMember}/displayName`).once('value').then(nameSnap => {
                    addFeedItem({
                        type: 'clans',
                        title: 'Clan Join',
                        user: nameSnap.val() || 'Unknown',
                        uid: latestMember,
                        detail: `Joined ${clan.name}`,
                        color: 'text-teal-400',
                        icon: 'fa-shield-halved'
                    });
                });
            });

            db.ref('recentActivity').limitToLast(10).on('child_added', snap => {
                const activity = snap.val();
                switch (activity.type) {
                    case 'milestone':
                        addFeedItem({ type:'users', title:`${activity.days} Day Streak!`, user:activity.userName, detail:`Reached ${activity.milestoneName} milestone!`, time:'Just now', color:'text-orange-400', icon:'fa-fire' });
                        break;
                    case 'achievement':
                        addFeedItem({ type:'users', title:'Achievement Unlocked!', user:activity.userName, detail:`Earned "${activity.badgeName}" badge`, time:'Just now', color:'text-purple-400', icon:'fa-trophy' });
                        break;
                    case 'bd_improvement':
                        addFeedItem({ type:'users', title:'BD Record!', user:activity.bdName, detail:`New highscore: ${(activity.newScore||0).toLocaleString()}`, time:'Just now', color:'text-red-400', icon:'fa-sword' });
                        break;
                    case 'shop_purchase':
                        addFeedItem({ type:'users', title:'Shop Purchase', user:activity.userName, detail:`Bought ${activity.itemName}`, time:'Just now', color:'text-blue-400', icon:'fa-shopping-cart' });
                        break;
                }
            });
        }

        /**
         * Check Battledome status against the RTDB and update the lobby button accordingly.
         * Phase 6 fix: Use the actual renderBattledome() button selector and update the badge
         * element regardless of online/offline/unknown states. This ensures the badge
         * accurately reflects the Battledome availability and avoids silently failing.
         */
        function checkBattledomeStatus() {
            db.ref('battledome/status').once('value').then(snap => {
                const status = snap.val() || {};
                _applyBattledomeStatusBadge(status.online === true ? 'online' : 'offline');
                console.log('[BD] Status:', status.online ? 'ONLINE' : 'OFFLINE');
            }).catch(err => {
                console.error('[BD] Status check failed:', err);
                _applyBattledomeStatusBadge('unknown');
            });
        }

        function _applyBattledomeStatusBadge(state) {
            // Find the BD button robustly — match any button whose onclick calls renderBattledome
            const bdButton = document.querySelector('[onclick="renderBattledome()"]');
            if (!bdButton) return;
            // Find badge: look for a div child that has rounded-full and font-black (the status pill)
            const badge = Array.from(bdButton.querySelectorAll('div')).find(el =>
                el.className.includes('rounded-full') && el.className.includes('font-black')
            );
            if (!badge) return;
            const styles = {
                online:  { cls: 'bg-green-500/20 text-green-400', text: 'ONLINE' },
                offline: { cls: 'bg-red-500/20 text-red-400',   text: 'OFFLINE' },
                unknown: { cls: 'bg-gray-500/20 text-gray-400',  text: 'UNKNOWN' }
            };
            const s = styles[state] || styles.unknown;
            badge.className = `text-[10px] ${s.cls} px-3 py-0.5 rounded-full font-black uppercase`;
            badge.textContent = s.text;
        }

        function addFeedItem(item) {
            if (!item.timestamp) item.timestamp = Date.now();
            feedItems.unshift(item);
            if (feedItems.length > 20) feedItems.pop();
            renderFeed();
            showToast(`${item.title} — ${item.user}`, 'info', 3000);
        }

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info', duration = 5000) {
            // Phase 5B: Respect notification preferences
            const lowerMsg = message.toLowerCase();
            if (lowerMsg.includes('achievement') && !notificationPrefs.achievements) return;
            if (lowerMsg.includes('points') && !notificationPrefs.points) return;
            if ((lowerMsg.includes('clan') || lowerMsg.includes('joined')) && !notificationPrefs.clans) return;
            if (lowerMsg.includes('clip') && !notificationPrefs.clips) return;
            if (lowerMsg.includes('new player') && !notificationPrefs.users) return;
            if (lowerMsg.includes('streak') && !notificationPrefs.streaks) return;

            const colors = {
                info: 'border-blue-500/50 text-blue-400',
                success: 'border-green-500/50 text-green-400',
                warning: 'border-yellow-500/50 text-yellow-400',
                error: 'border-red-500/50 text-red-400'
            };
            const icons = { info:'fa-info-circle', success:'fa-check-circle', warning:'fa-exclamation-triangle', error:'fa-times-circle' };
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.style.pointerEvents = 'all';
            toast.className = `glass ${colors[type]} border p-4 rounded-2xl flex items-center gap-3 shadow-xl animate-slideInRight`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type]} text-xl flex-shrink-0"></i>
                <p class="text-sm font-bold flex-1">${message}</p>
                <button onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100"><i class="fa-solid fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, duration);
        }

        // Wrap toast notifications to respect user notification preferences (Phase 5)
        const originalShowToast = showToast;
        showToast = function(message, type = 'info', duration = 5000) {
            // Evaluate category of notification and skip if disabled
            const lowerMsg = (message || '').toLowerCase();
            if (lowerMsg.includes('achievement') && !notificationPrefs.achievements) return;
            if (lowerMsg.includes('points') && !notificationPrefs.points) return;
            if ((lowerMsg.includes('clan') || lowerMsg.includes('joined')) && !notificationPrefs.clans) return;
            if (lowerMsg.includes('clip') && !notificationPrefs.clips) return;
            if (lowerMsg.includes('new player') && !notificationPrefs.users) return;
            if (lowerMsg.includes('streak') && !notificationPrefs.streaks) return;
            originalShowToast(message, type, duration);
        };

        /**
         * Determine whether a notification of a given category should be shown. Phase 6 introduces
         * a single helper to centralise notification preference checks. Categories include:
         * achievements, points, clans, clips, users, streaks and system. This function returns
         * true when the category is enabled. If a preference hasn’t been toggled off it will
         * default to true. Future notification entry points should call this helper before
         * displaying messages.
         *
         * @param {string} category The notification category key
         */
        function canShowNotification(category) {
            return notificationPrefs?.[category] !== false;
        }

        /**
         * Lazy-load search datasets from Firebase into local arrays. Global search relies on
         * datasets being present; Phase 6 ensures we attempt to load them only once per session.
         * When Firebase is unavailable (e.g. offline), the arrays remain empty, but search will
         * still operate safely on empty collections. This helper is idempotent and can be
         * called repeatedly without refetching once data has been loaded.
         */
        async function ensureSearchDataLoaded() {
            try {
                if (typeof db === 'undefined' || !db || typeof db.ref !== 'function') return;
                // Load users — uses the session singleton so all callers share one download
                if (!allUsersData.length) {
                    const usersSnap = await _getUsersOnce();
                    allUsersData = [];
                    usersSnap.forEach(child => {
                        allUsersData.push({ uid: child.key, ...child.val() });
                    });
                }
                // Load clans (only if not already populated by loadAllClans)
                if (!Object.keys(allClansData || {}).length) {
                    const clansSnap = await db.ref('clans').once('value');
                    allClansData = clansSnap.val() || {};
                }
                // Load posts/clips — limited to 100, only attempted once
                if (!allPostsData.length && !_postsLoadAttempted) {
                    _postsLoadAttempted = true;
                    const postsSnap = await db.ref('social_posts').limitToLast(100).once('value').catch(() => null);
                    if (postsSnap) {
                        allPostsData = [];
                        postsSnap.forEach(child => {
                            allPostsData.push({ id: child.key, ...child.val() });
                        });
                    }
                }
            } catch (err) {
                console.warn('ensureSearchDataLoaded error:', err);
            }
        }
        let _postsLoadAttempted = false;

        function filterFeed(f) {
            // Toggle only the category filter chips
            document.querySelectorAll('[id^="feed-filter-"]').forEach(c => {
                c.classList.remove('active');
                c.classList.add('glass','text-gray-500');
            });
            document.getElementById(`feed-filter-${f}`).classList.add('active');
            document.getElementById(`feed-filter-${f}`).classList.remove('glass','text-gray-500');
            renderFeed(f);
        }

        function renderFeed(filter = 'all') {
            const el = document.getElementById('lobby-notification-feed');
            // Build base list filtered by type
            let data = filter === 'all' ? feedItems : feedItems.filter(i => i.type === filter);
            // Apply search filter (Phase 5D)
            if (feedSearchQuery) {
                const q = feedSearchQuery.toLowerCase();
                data = data.filter(item => {
                    return (item.title && item.title.toLowerCase().includes(q)) ||
                           (item.user && item.user.toLowerCase().includes(q)) ||
                           (item.detail && item.detail.toLowerCase().includes(q));
                });
            }
            // Apply date filter (Phase 5D)
            const now = Date.now();
            if (feedDateFilter === 'today') {
                data = data.filter(item => now - item.timestamp < 86400000);
            } else if (feedDateFilter === 'week') {
                data = data.filter(item => now - item.timestamp < 604800000);
            } else if (feedDateFilter === 'month') {
                data = data.filter(item => now - item.timestamp < 2592000000);
            }
            // Render feed
            el.innerHTML = data.map(item => `
                <div class="glass glass-hover p-4 rounded-3xl border-white/5 cursor-pointer overflow-hidden max-h-16 transition-all duration-500" onclick="toggleFeedItem(this)">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center ${item.color}"><i class="fa-solid ${item.icon}"></i></div>
                            <div>
                                <h4 class="text-xs font-bold text-white">${item.title}</h4>
                                <p class="text-[9px] text-gray-500 uppercase font-black">${item.timestamp ? timeAgo(item.timestamp) : item.time}</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-600"></i>
                    </div>
                    <div class="pt-4 border-t border-white/5">
                        <p class="text-[11px] text-blue-400 font-bold mb-1">${item.uid ? `<span class="cursor-pointer hover:underline" onclick="event.stopPropagation();window.openKcProfile('${item.uid}')">${item.user}</span>` : item.user}</p>
                        <p class="text-xs text-gray-400 leading-relaxed">${item.detail || ''}</p>
                    </div>
                </div>
            `).join('') || `<div class="p-10 text-center opacity-20 text-xs italic">${feedSearchQuery || feedDateFilter !== 'all' ? 'No matching events...' : 'Awaiting events...'}</div>`;
        }

        function toggleFeedItem(el) {
            const isExp = el.style.maxHeight === '300px';
            el.style.maxHeight = isExp ? '64px' : '300px';
            el.querySelector('.fa-chevron-down').style.transform = isExp ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        // === Global Search (Phase 5) ===
        function openGlobalSearch() {
            openModal('Search KC NOW', `
                <div class="space-y-6">

                    <div class="flex gap-2 overflow-x-auto">

        function setSearchCategory(cat) {
            searchCategory = cat;
            document.querySelectorAll('[id^="search-cat-"]').forEach(btn => {
                btn.className = 'px-4 py-2 rounded-xl font-bold whitespace-nowrap glass text-gray-400';

        async function performGlobalSearch() {
            const input = document.getElementById('global-search-input');
            const query = input ? input.value.toLowerCase() : '';
            if (!query) return;
            const container = document.getElementById('search-results-container');
            container.innerHTML = '<div class="text-center py-10"><div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mx-auto"></div><p class="mt-4 text-gray-400">Searching...</p></div>';
            // Ensure local caches are populated before searching. This function will attempt to load
            // data from Firebase on first run; if offline it will gracefully continue with empty arrays.
            await ensureSearchDataLoaded();
            const results = { players: [], clans: [], clips: [] };
            // Perform local search across cached datasets. This avoids repeated remote requests and
            // gracefully handles offline usage. When datasets are empty the results remain empty.
            const lowerQuery = query;
            // Search players
            if (searchCategory === 'all' || searchCategory === 'players') {
                results.players = allUsersData.filter(u => {
                    return u.displayName && u.displayName.toLowerCase().includes(lowerQuery);
                });
            }
            // Search clans
            if (searchCategory === 'all' || searchCategory === 'clans') {
                results.clans = Object.entries(allClansData).filter(([, clan]) => {
                    return clan.name && clan.name.toLowerCase().includes(lowerQuery);
                }).map(([id, clan]) => ({ id, ...clan }));
            }
            // Search clips
            if (searchCategory === 'all' || searchCategory === 'clips') {
                results.clips = allPostsData.filter(c => {
                    return (c.caption && c.caption.toLowerCase().includes(lowerQuery)) ||
                           (c.userName && c.userName.toLowerCase().includes(lowerQuery));
                });
            }
            let html = '';
            // Players section
            if (results.players.length > 0) {
                html += `
                    <div class="mb-6">
                        <p class="text-xs text-gray-500 font-black uppercase mb-3">Players (${results.players.length})</p>
                        <div class="space-y-2">
                            ${results.players.slice(0, 5).map(p => `
                                <div class="glass p-4 rounded-2xl flex items-center gap-3 hover:bg-white/10 cursor-pointer" onclick="window.openKcProfile('${p.uid}')">
                                    <img src="${p.avatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full">
                                    <div class="flex-1">
                                        <p class="font-bold">${p.displayName}</p>
                                        <p class="text-xs text-gray-400">Overall: ${p.overall || 0}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            // Clans section
            if (results.clans.length > 0) {
                html += `
                    <div class="mb-6">
                        <p class="text-xs text-gray-500 font-black uppercase mb-3">Clans (${results.clans.length})</p>
                        <div class="space-y-2">
                            ${results.clans.slice(0, 5).map(c => `
                                <div class="glass p-4 rounded-2xl flex items-center gap-3 hover:bg-white/10 cursor-pointer" onclick="openClanDetails('${c.id}')">
                                    <div class="w-10 h-10 rounded-xl bg-teal-500/20 flex items-center justify-center text-teal-400 font-black">
                                        ${c.name.charAt(0)}
                                    </div>
                                    <div class="flex-1">
                                        <p class="font-bold">${c.name}</p>
                                        <p class="text-xs text-gray-400">${Object.keys(c.members || {}).length} members</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            // Clips section
            if (results.clips.length > 0) {
                html += `
                    <div class="mb-6">
                        <p class="text-xs text-gray-500 font-black uppercase mb-3">Clips (${results.clips.length})</p>
                        <div class="space-y-2">
                            ${results.clips.slice(0, 5).map(c => `
                                <div class="glass p-4 rounded-2xl hover:bg-white/10">
                                    <p class="font-bold text-sm">${c.caption || 'Untitled'}</p>
                                    <p class="text-xs text-gray-400">by ${c.userName}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            if (!html) {
                html = '<div class="text-center py-20 text-gray-500">No results found</div>';
            }
            container.innerHTML = html;
        }

        // === Theme System (Phase 5) ===
        function initTheme() {
            if (currentTheme === 'light') {
                document.documentElement.classList.add('light-theme');
            } else if (currentTheme === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (!prefersDark) document.documentElement.classList.add('light-theme');
            }
        }

        /**
         * Toggle between light and dark themes. In Phase 6 we unify theme handling by routing all
         * changes through setTheme() rather than manually flipping classes. This ensures that
         * automatic (auto) mode also works correctly and persists the choice reliably.
         */
        function toggleTheme() {
            const next = document.documentElement.classList.contains('light-theme') ? 'dark' : 'light';
            setTheme(next);
        }

        function setTheme(theme, showSettings = false) {
            currentTheme = theme;
            localStorage.setItem('kc-theme', theme);
            let effective = theme;
            if (theme === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                effective = prefersDark ? 'dark' : 'light';
            }
            if (effective === 'light') {
                document.documentElement.classList.add('light-theme');
            } else {
                document.documentElement.classList.remove('light-theme');
            }
            // Only reopen the theme settings modal when explicitly requested (e.g. from the settings UI)
            if (showSettings) openThemeSettings();
        }

        // ── Geometric Shape Palette ──
        // Per-preset shape type distributions — gives each theme its own visual language
        const BG_SHAPE_TYPES = {
            default:   ['triangle','hexagon','circle','rect','diamond'],
            aurora:    ['hexagon','circle','hexagon','circle','diamond','circle'],    // soft rounded aurora feel
            sunrise:   ['circle','diamond','circle','rect','circle','diamond'],       // soft blobs + gems
            deepsea:   ['circle','circle','hexagon','circle','ring','circle'],        // mostly circles/blobs
            void:      ['triangle','diamond','triangle','hexagon','triangle','rect'], // sharp angular
            prism:     ['triangle','diamond','triangle','diamond','triangle','hexagon'], // aggressive sharp prism
            starlight: ['star','hexagon','star','circle','diamond','star','hexagon']  // stars + hexagons
        };

        const BG_SHAPE_PALETTES = {
            default:   ['rgba(59,130,246,',  'rgba(45,212,191,', 'rgba(99,102,241,',  'rgba(168,85,247,',  'rgba(14,165,233,'],
            aurora:    ['rgba(34,211,238,',  'rgba(16,185,129,', 'rgba(59,130,246,',  'rgba(45,212,191,',  'rgba(6,182,212,'],
            sunrise:   ['rgba(251,113,133,', 'rgba(253,186,116,','rgba(251,191,36,',  'rgba(249,115,22,',  'rgba(244,63,94,'],
            deepsea:   ['rgba(6,182,212,',   'rgba(52,211,153,', 'rgba(5,150,105,',   'rgba(99,102,241,',  'rgba(14,116,144,'],
            void:      ['rgba(124,58,237,',  'rgba(139,92,246,', 'rgba(167,139,250,', 'rgba(76,29,149,',   'rgba(192,132,252,'],
            prism:     ['rgba(236,72,153,',  'rgba(245,158,11,', 'rgba(16,185,129,',  'rgba(239,68,68,',   'rgba(59,130,246,'],
            starlight: ['rgba(165,180,252,', 'rgba(196,181,253,','rgba(147,197,253,', 'rgba(167,243,208,', 'rgba(253,230,138,']
        };

        function _initBgShapes(preset) {
            bgShapes = [];
            const palette = BG_SHAPE_PALETTES[preset] || BG_SHAPE_PALETTES.default;
            const shapeTypes = BG_SHAPE_TYPES[preset] || BG_SHAPE_TYPES.default;
            // Use extended canvas size (120% of viewport) so shapes fill the larger area
            const w = window.innerWidth * 1.2, h = window.innerHeight * 1.2;
            const count = Math.max(18, Math.min(34, Math.floor(w * h / 38000)));
            const types = shapeTypes;
            for (let i = 0; i < count; i++) {
                const z = Math.pow(Math.random(), 0.7); // bias toward mid-depth
                bgShapes.push({
                    x: Math.random() * w, y: Math.random() * h, z,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.12,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.004,
                    size: 18 + z * 70 + Math.random() * 35,
                    type: types[Math.floor(Math.random() * types.length)],
                    colorBase: palette[Math.floor(Math.random() * palette.length)],
                    opacity: 0.04 + z * 0.09,
                    pFactor: 0.3 + z * 0.7
                });
            }
        }

        function _drawBgShape(ctx, s) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rot);
            ctx.fillStyle   = s.colorBase + s.opacity + ')';
            ctx.strokeStyle = s.colorBase + Math.min(s.opacity * 3, 0.35) + ')';
            ctx.lineWidth   = 0.8 + s.z * 1.2;
            const r = s.size;
            ctx.beginPath();
            switch (s.type) {
                case 'triangle':
                    ctx.moveTo(0, -r);
                    ctx.lineTo(r * 0.866, r * 0.5);
                    ctx.lineTo(-r * 0.866, r * 0.5);
                    break;
                case 'hexagon':
                    for (let i = 0; i < 6; i++) {
                        const a = (i * Math.PI) / 3 - Math.PI / 6;
                        i === 0 ? ctx.moveTo(r*Math.cos(a), r*Math.sin(a))
                                : ctx.lineTo(r*Math.cos(a), r*Math.sin(a));
                    }
                    break;
                case 'circle':
                    ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2);
                    break;
                case 'rect': {
                    const hw = r * 0.85, hh = r * 0.5, rad = r * 0.22;
                    ctx.moveTo(-hw + rad, -hh);
                    ctx.arcTo(hw, -hh, hw, hh, rad);
                    ctx.arcTo(hw, hh, -hw, hh, rad);
                    ctx.arcTo(-hw, hh, -hw, -hh, rad);
                    ctx.arcTo(-hw, -hh, hw, -hh, rad);
                    break;
                }
                case 'diamond':
                    ctx.moveTo(0, -r); ctx.lineTo(r*0.58, 0);
                    ctx.lineTo(0, r);  ctx.lineTo(-r*0.58, 0);
                    break;
                case 'star': {
                    const outerR = r, innerR = r * 0.42, pts = 5;
                    for (let i = 0; i < pts * 2; i++) {
                        const a = (i * Math.PI) / pts - Math.PI / 2;
                        const rad = i % 2 === 0 ? outerR : innerR;
                        i === 0 ? ctx.moveTo(rad*Math.cos(a), rad*Math.sin(a))
                                : ctx.lineTo(rad*Math.cos(a), rad*Math.sin(a));
                    }
                    break;
                }
                case 'ring': {
                    // draw as filled arc stroke (donut) — use two arcs approach
                    ctx.restore();
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.rot);
                    ctx.strokeStyle = s.colorBase + Math.min(s.opacity * 4, 0.4) + ')';
                    ctx.lineWidth = r * 0.22 + s.z * 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                    return; // skip close/fill/stroke below
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function _tickBgShapes(ts) {
            if (!bgShapesCtx || !bgShapesCanvas) return;
            const ctx = bgShapesCtx;
            // Use CSS dimensions (not pixel dimensions) for shape coords
            const w = parseFloat(bgShapesCanvas.style.width) || bgShapesCanvas.width;
            const h = parseFloat(bgShapesCanvas.style.height) || bgShapesCanvas.height;
            ctx.clearRect(0, 0, w, h);
            const reduce = backgroundPrefs.reducedMotion;
            const pmx = reduce ? 0 : mouseParallax.x;
            const pmy = reduce ? 0 : mouseParallax.y;
            const dx  = reduce ? 0 : bgAutoDrift.x * 28;
            const dy  = reduce ? 0 : bgAutoDrift.y * 18;
            const margin = 80;
            for (const s of bgShapes) {
                if (!reduce) {
                    s.x += s.vx; s.y += s.vy; s.rot += s.rotSpeed;
                    if (s.x < -margin) s.x = w + margin;
                    else if (s.x > w + margin) s.x = -margin;
                    if (s.y < -margin) s.y = h + margin;
                    else if (s.y > h + margin) s.y = -margin;
                }
                const ox = s.x, oy = s.y;
                s.x += pmx * -55 * s.pFactor + dx * s.pFactor;
                s.y += pmy * -40 * s.pFactor + dy * s.pFactor;
                _drawBgShape(ctx, s);
                s.x = ox; s.y = oy;
            }
        }

        function initDynamicBackground() {
            const container = document.getElementById('bg-canvas');
            if (!container) return;
            destroyDynamicBackground();
            container.innerHTML = `
                <div id="bg-3d-root" class="kc-bg-scene ${backgroundPrefs.preset}">
                    <div class="kc-bg-layer kc-bg-far"></div>
                    <div class="kc-bg-layer kc-bg-mid"></div>
                    <div class="kc-bg-layer kc-bg-near"></div>
                    <div class="kc-bg-layer kc-bg-glow"></div>
                    <div class="kc-bg-noise"></div>
                </div>
            `;
            backgroundScene = document.getElementById('bg-3d-root');
            applyBackgroundPreset(backgroundPrefs.preset);

            // Add floating-shapes canvas on top of gradient layers
            // Extend 10% beyond viewport on each side so shapes don't pop in/out at edges
            const _cw = Math.ceil(window.innerWidth * 1.2), _ch = Math.ceil(window.innerHeight * 1.2);
            const _dpr = window.devicePixelRatio || 1;
            bgShapesCanvas = document.createElement('canvas');
            bgShapesCanvas.style.cssText = 'position:absolute;top:-10%;left:-10%;width:120%;height:120%;pointer-events:none;';
            bgShapesCanvas.width  = Math.ceil(_cw * _dpr);
            bgShapesCanvas.height = Math.ceil(_ch * _dpr);
            bgShapesCanvas.style.width  = _cw + 'px';
            bgShapesCanvas.style.height = _ch + 'px';
            bgShapesCtx = bgShapesCanvas.getContext('2d');
            bgShapesCtx.scale(_dpr, _dpr);
            container.appendChild(bgShapesCanvas);
            _initBgShapes(backgroundPrefs.preset);

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches || backgroundPrefs.reducedMotion;
            if (!reduceMotion && window.innerWidth > 640) {
                attachBackgroundMotion();
            }
            startBackgroundLoop();
        }

        function destroyDynamicBackground() {
            if (backgroundAnimationId) cancelAnimationFrame(backgroundAnimationId);
            backgroundAnimationId = null;
            bgShapesCanvas = null; bgShapesCtx = null; bgShapes = [];
            const container = document.getElementById('bg-canvas');
            if (container) container.innerHTML = '';
        }

        function applyBackgroundPreset(presetKey) {
            const preset = BACKGROUND_PRESETS[presetKey] ? presetKey : 'default';
            backgroundPrefs.preset = preset;
            saveBackgroundPrefs();
            if (!backgroundScene) return;
            backgroundScene.className = `kc-bg-scene ${preset}`;
            _initBgShapes(preset); // re-seed shapes with new colour palette
        }

        function attachBackgroundMotion() {
            window.addEventListener('mousemove', handleBackgroundPointerMove, { passive: true });
            window.addEventListener('resize', _onBgCanvasResize, { passive: true });
        }

        function _onBgCanvasResize() {
            if (!bgShapesCanvas) return;
            const dpr = window.devicePixelRatio || 1;
            const cw = Math.ceil(window.innerWidth * 1.2), ch = Math.ceil(window.innerHeight * 1.2);
            bgShapesCanvas.width  = Math.ceil(cw * dpr);
            bgShapesCanvas.height = Math.ceil(ch * dpr);
            bgShapesCanvas.style.width  = cw + 'px';
            bgShapesCanvas.style.height = ch + 'px';
            bgShapesCtx = bgShapesCanvas.getContext('2d');
            bgShapesCtx.scale(dpr, dpr);
            _initBgShapes(backgroundPrefs.preset);
        }

        function handleBackgroundPointerMove(e) {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            mouseParallax.tx = x;
            mouseParallax.ty = y;
        }

        function startBackgroundLoop() {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches || backgroundPrefs.reducedMotion;
            function tick(ts) {
                if (!backgroundScene) return;
                // Smoother auto-drift using two-frequency sine waves for organic feel
                bgAutoDrift.time = ts * 0.0001;
                bgAutoDrift.x = Math.sin(bgAutoDrift.time) * 0.25 + Math.sin(bgAutoDrift.time * 0.41) * 0.08;
                bgAutoDrift.y = Math.cos(bgAutoDrift.time * 0.7) * 0.20 + Math.cos(bgAutoDrift.time * 0.33) * 0.06;
                // Eased mouse parallax (lerp toward target)
                mouseParallax.x += (mouseParallax.tx - mouseParallax.x) * 0.08;
                mouseParallax.y += (mouseParallax.ty - mouseParallax.y) * 0.08;
                // Blend motion sources
                const motionX = reduceMotion ? bgAutoDrift.x : (mouseParallax.x * 0.8 + bgAutoDrift.x);
                const motionY = reduceMotion ? bgAutoDrift.y : (mouseParallax.y * 0.8 + bgAutoDrift.y);
                backgroundScene.style.setProperty('--mx', motionX.toFixed(6));
                backgroundScene.style.setProperty('--my', motionY.toFixed(6));
                backgroundScene.style.setProperty('--drift', Math.sin(bgAutoDrift.time).toFixed(4));
                // Pulse the glow layer for depth perception
                if (!reduceMotion) {
                    const glowLayer = backgroundScene.querySelector('.kc-bg-glow');
                    if (glowLayer) {
                        const pulse = Math.sin(ts * 0.0008) * 0.15 + 0.55;
                        glowLayer.style.opacity = pulse.toFixed(3);
                    }
                }
                // Draw floating geometric shapes on canvas layer
                _tickBgShapes(ts);
                backgroundAnimationId = requestAnimationFrame(tick);
            }
            backgroundAnimationId = requestAnimationFrame(tick);
        }

                        <div>
                            <p class="font-bold">Reduced Motion</p>

        function setBackgroundPreset(presetKey) {
            const preset = BACKGROUND_PRESETS[presetKey];
            if (!preset) return;
            if (preset.tier === 'diamond' && !userHasDiamondCustomization()) {
                showToast('Diamond customization required for this background', 'error');

        }

        /**
         * Toggle the reduced motion preference. When enabled, 3D backgrounds will avoid heavy
         * parallax and rely solely on auto drift, improving performance on low-power devices
         * or for users sensitive to motion. The setting persists in local storage and re-
         * initialises the background immediately.
         */
        function toggleReducedMotion() {
            backgroundPrefs.reducedMotion = !backgroundPrefs.reducedMotion;
            saveBackgroundPrefs();
            initDynamicBackground();
            openBackgroundSettings();
        }

        // Pause the background animation when the tab is hidden and resume when visible. This
        // conserves CPU/GPU on inactive tabs and prevents runaway animations when the user
        // switches away from KC NOW. Resuming will restart the loop only if it isn't running.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (backgroundAnimationId) cancelAnimationFrame(backgroundAnimationId);
                backgroundAnimationId = null;
            } else {
                if (!backgroundAnimationId && backgroundScene) startBackgroundLoop();
            }
        });

        function getFilteredSlitherServers(servers) {
            let data = [...servers];
            const q = slitherSearchState.query.trim().toLowerCase();
            if (q) {
                data = data.filter(server => {
                    return [server.name, server.key, server.region, server.id]
                        .filter(Boolean)
                        .some(value => String(value).toLowerCase().includes(q));
                });
            }
            if (slitherSearchState.region !== 'all') {
                data = data.filter(server => {
                    const region = String(server.region || '').toLowerCase();
                    if (slitherSearchState.region === 'us') return region.includes('us');
                    if (slitherSearchState.region === 'eu') return region.includes('eu');
                    if (slitherSearchState.region === 'asia') return region.includes('asia');
                    if (slitherSearchState.region === 'other') return !['us','eu','asia'].some(r => region.includes(r));
                    return true;
                });
            }
            if (slitherSearchState.sort === 'players_desc') data.sort((a,b) => (b.playerCount || 0) - (a.playerCount || 0));
            if (slitherSearchState.sort === 'players_asc') data.sort((a,b) => (a.playerCount || 0) - (b.playerCount || 0));
            if (slitherSearchState.sort === 'name') data.sort((a,b) => String(a.name || a.key || '').localeCompare(String(b.name || b.key || '')));
            return data;
        }

        function updateSlitherSearch(value) {
            slitherSearchState.query = value;
            if (lastSlitherModal) {
                renderSlitherServerBrowser(lastSlitherModal, lastSlitherServers);
            }

        function updateSlitherRegion(value) {
            slitherSearchState.region = value;
            if (lastSlitherModal) {
                renderSlitherServerBrowser(lastSlitherModal, lastSlitherServers);

        function updateSlitherSort(value) {
            slitherSearchState.sort = value;

        // --- SUB-MODULE: CLIPS (legacy stub) ---
