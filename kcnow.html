<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC NOW | Lobby</title>
    
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <script src="profile-popup.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #3b82f6;
            --brand-gradient: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #080c14;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }

        /* --- Background FX --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #080c14 100%);
        }

        .animated-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.08) 0%, transparent 40%);
            animation: drift 20s ease-in-out infinite alternate;
        }

        @keyframes drift { from { transform: scale(1); } to { transform: scale(1.1) rotate(1deg); } }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- UI Components --- */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }

        .tab-btn {
            position: relative;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -12px; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px;
            background: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue);
            border-radius: 10px;
        }

        .bottom-banner {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%); padding: 12px 80px;
            border-radius: 100px; z-index: 50; pointer-events: none;
        }
        .banner-sheen::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: sheen 6s infinite;
        }
        @keyframes sheen { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .view-transition { animation: slideUpFade 0.4s ease-out; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .feed-chip.active { background-color: var(--accent-blue); color: white; opacity: 1; }

        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            height: calc(100vh - 240px);
        }
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            body { overflow-y: auto; }
        }
        @media (max-width: 768px) {
            #view-home .grid.grid-cols-3 { grid-template-columns: 1fr 1fr; }
            .fixed.bottom-32.right-8 { display: none; }
            #welcome-card > .flex.items-center { flex-direction: column; text-align: center; }
            #welcome-economy-stats { margin-top: 0.75rem; }
        }
    </style>
</head>
<body class="p-6 md:p-10">

                <!-- Hub Buttons -->

                    <button onclick="openAchievements()" class="glass glass-hover rounded-[32px] h-48 flex flex-col items-center justify-center gap-4 group transition">

        <!-- RIGHT Feed & Stats -->

                <div class="p-6 border-b border-white/5 bg-white/5 flex items-center justify-between">

    <div class="bottom-banner glass banner-sheen border-white/10 shadow-[0_0_50px_rgba(59,130,246,0.1)]">
        <span class="text-2xl font-black tracking-[0.3em] text-white">KC <span class="text-blue-500">NOW</span></span>
    </div>

    <div id="global-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 bg-black/60 backdrop-blur-xl transition-all">
        <div class="glass w-full max-w-2xl max-h-[85vh] rounded-[48px] border-white/10 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 flex items-center justify-between">
                <h2 id="modal-title" class="text-2xl font-bold">Lobby Window</h2>
                <button onclick="closeModal()" class="w-12 h-12 rounded-full glass flex items-center justify-center hover:bg-red-500/20 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-8 overflow-y-auto custom-scroll flex-1"></div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-24 right-8 z-[200] space-y-3" style="max-width:350px;pointer-events:none;"></div>

    <!-- Quick Actions Floating Menu -->
    <div class="fixed bottom-32 right-8 z-50">
        <button onclick="toggleQuickActions()" id="quick-actions-btn" class="w-16 h-16 rounded-full bg-blue-600 hover:bg-blue-500 shadow-2xl shadow-blue-900/60 flex items-center justify-center text-white text-2xl transition" style="transition: transform 0.3s;">
            <i class="fa-solid fa-bolt"></i>
        </button>
        <div id="quick-actions-menu" class="hidden absolute bottom-20 right-0 space-y-3">
            <button onclick="claimDaily()" class="glass px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition whitespace-nowrap" style="pointer-events:all;">
                <i class="fa-solid fa-gift text-blue-400"></i>
                <span class="font-bold text-sm">Claim Daily</span>
            </button>
            <button onclick="openEconomyShop()" class="glass px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition whitespace-nowrap" style="pointer-events:all;">
                <i class="fa-solid fa-store text-purple-400"></i>
                <span class="font-bold text-sm">Shop</span>
            </button>
            <button onclick="openGamesHub()" class="glass px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition whitespace-nowrap" style="pointer-events:all;">
                <i class="fa-solid fa-dice text-green-400"></i>
                <span class="font-bold text-sm">Games</span>
            </button>
            <button onclick="openMyProfile()" class="glass px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 transition whitespace-nowrap" style="pointer-events:all;">
                <i class="fa-solid fa-user text-teal-400"></i>
                <span class="font-bold text-sm">My Profile</span>
            </button>
        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        var currentUser = null, activeTab = 'home', auth, db, storage;
        var allUsersData = [], allClansData = {}, allPostsData = [], feedItems = [];

        // --- Firebase Config (KC Killers Company) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
            authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
            databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kckillerscompany-ab1ec",
            storageBucket: "kckillerscompany-ab1ec.appspot.com",
            messagingSenderId: "198711213988",
            appId: "1:198711213988:web:f3cacc413ac9e80dd8cb31"
        };

        // Initialize Firebase only once
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth(); db = firebase.database(); storage = firebase.storage();

        // --- AUTH SYNC ---
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                try { await user.reload(); } catch (e) {}
                db.ref(`users/${user.uid}`).on('value', snap => {
                    const data = snap.val() || {};
                    renderUserHeader(data, user);
                    if (activeTab === 'profile') loadProfileLite();
                });
                initPersonalActivityListener();
            } else {
                renderUserHeader({}, null);
            }
            initFeedListeners();
            loadClipsPreview();
            checkBattledomeStatus();
        });

        // --- HELPER FUNCTIONS ---
        async function getDiscordIdFromKcUid(kcUid) {
            const linksSnapshot = await db.ref('discordLinks').once('value');
            const links = linksSnapshot.val() || {};
            for (const [discordId, data] of Object.entries(links)) {
                if (data.uid === kcUid) return discordId;
            }
            return null;
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // --- Greeting Function ---
        function getGreeting() {
            const h = new Date().getHours();
            if (h < 12) return "Good morning";
            if (h < 18) return "Good afternoon";
            return "Good evening";
        }

        // --- Render User Header (Welcome Card) ---
        function renderUserHeader(data, user) {
            const nameEl = document.getElementById('user-display-name');
            const greetingEl = document.getElementById('greeting-text');
            const avatarEl = document.getElementById('user-avatar');
            const badgeEl = document.getElementById('user-badges');
            const actions = document.getElementById('auth-actions');
            const ind = document.getElementById('online-indicator');
            const welcomeCard = document.getElementById('welcome-card');

            greetingEl.textContent = getGreeting() + ',';

            if (user) {
                const avatarUrl = data.avatar || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
                const nameColor = (data.profileCustomizationUnlocked && data.profileCustomization && data.profileCustomization.nameColor) ? data.profileCustomization.nameColor : '#ffffff';
                const customGradient = (data.profileCustomizationUnlocked && data.profileCustomization && data.profileCustomization.gradient) ? data.profileCustomization.gradient : null;
                const isVerified = !!user.emailVerified;
                const isStaff = !!data.isStaff;

                nameEl.textContent = data.displayName || user.displayName || "Member";
                nameEl.style.color = nameColor;
                avatarEl.src = avatarUrl;
                ind.classList.remove('hidden');

                if (customGradient) {
                    welcomeCard.style.background = customGradient;
                    welcomeCard.classList.remove('glass');
                } else {
                    welcomeCard.style.background = '';
                    welcomeCard.classList.add('glass');
                }

                let badges = '';
                if (isVerified) badges += `<i class="fa-solid fa-circle-check text-blue-400 text-xs" title="Verified"></i>`;
                if (isStaff) badges += `<i class="fa-solid fa-shield-halved text-red-500 text-xs" title="Staff"></i>`;
                badgeEl.innerHTML = badges;

                // Show about text
                const existingAbout = document.getElementById('welcome-about');
                if (existingAbout) existingAbout.remove();
                if (data.about) {
                    const aboutDiv = document.createElement('p');
                    aboutDiv.id = 'welcome-about';
                    aboutDiv.className = 'text-sm text-gray-400 italic mt-2 max-w-md';
                    aboutDiv.textContent = `"${data.about}"`;
                    nameEl.parentElement.appendChild(aboutDiv);
                }

                // Auth actions with daily button and economy stats placeholder
                actions.innerHTML = `
                    <div class="flex flex-col items-end gap-3">
                        <div id="welcome-economy-stats"></div>
                        <button onclick="claimDaily()" class="glass px-5 py-2 rounded-2xl font-bold text-blue-400 hover:bg-blue-500/20 transition text-sm">
                            <i class="fa-solid fa-gift mr-2"></i> Claim Daily
                        </button>

                switch (activity.type) {

                        addFeedItem({ type:'users', title:'Shop Purchase', user:activity.userName, detail:`Bought ${activity.itemName}`, time:'Just now', color:'text-blue-400', icon:'fa-shopping-cart' });

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'info', duration = 5000) {
            const colors = {
                info: 'border-blue-500/50 text-blue-400',
                success: 'border-green-500/50 text-green-400',
                warning: 'border-yellow-500/50 text-yellow-400',
                error: 'border-red-500/50 text-red-400'
            };
            const icons = { info:'fa-info-circle', success:'fa-check-circle', warning:'fa-exclamation-triangle', error:'fa-times-circle' };
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.style.pointerEvents = 'all';
            toast.className = `glass ${colors[type]} border p-4 rounded-2xl flex items-center gap-3 shadow-xl animate-slideInRight`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type]} text-xl flex-shrink-0"></i>
                <p class="text-sm font-bold flex-1">${message}</p>
                <button onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100"><i class="fa-solid fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, duration);
        }

                if (!el) return;
                if (discordId) {
                    db.ref(`userEconomy/${discordId}/streaks/login/current`).once('value').then(snap => {
                        el.textContent = `${snap.val() || 0} days 🔥`;
                    });
                } else {
                    el.textContent = 'Link Discord to track';
                }
            });
        }

        function toggleQuickActions() {
            const menu = document.getElementById('quick-actions-menu');
            const btn = document.getElementById('quick-actions-btn');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                btn.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.add('hidden');
                btn.style.transform = 'rotate(0deg)';
            }
        }

        function openPlayerCard(uid) {
            // Legacy: keep as is for clan view players or other use
            db.ref(`users/${uid}`).once('value').then(snap => {
                const u = snap.val(); if(!u) return;
                const content = `
                    <div class="flex flex-col items-center gap-6 text-center">
                        <img src="${u.profilePicture || 'https://kcevents.uk/default-avatar.png'}" class="w-32 h-32 rounded-full border-8 border-white/5 shadow-2xl">
                        <div>
                            <h2 class="text-4xl font-bold mb-1" style="color:${u.nameColor||'#fff'}">${u.displayName || 'Member'}</h2>
                            <p class="text-blue-400 font-black tracking-widest uppercase text-xs">${u.rank || 'Player'}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4 w-full">
                            <div class="glass p-6 rounded-3xl">
                                <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">XP Points</p>
                                <p class="text-2xl font-black">${u.totalPoints || 0}</p>
                            </div>
                            <div class="glass p-6 rounded-3xl">
                                <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Clan</p>
                                <p class="text-2xl font-black text-teal-400">${u.clanName || 'None'}</p>
                            </div>
                        </div>
                        <div class="w-full glass p-6 rounded-3xl text-left">
                            <p class="text-[10px] text-gray-500 font-bold uppercase mb-3">Biography</p>
                            <p class="text-gray-300 text-sm italic">"${u.bio || 'Silence is this player\'s best friend.'}"</p>
                        </div>
                    </div>
                `;
                openModal(`Player Dossier`, content);
            });
        }

        window.openKcProfile = function(uid) {
            if (!uid) return;
            if (typeof openProfilePopup === 'function') {
                openProfilePopup(uid, firebase.database());
            } else {
                openPlayerCard(uid);
            }
        };

        function openAchievements() {
            if (!currentUser) return openAuthModal();
            getDiscordIdFromKcUid(currentUser.uid).then(discordId => {
                if (!discordId) {
                    return openModal('Achievements', `
                        <div class="text-center py-10">
                            <i class="fa-solid fa-link-slash text-6xl text-gray-600 mb-6"></i>
                            <p class="text-gray-400">Link your Discord account in the bot to track achievements!</p>
                            <p class="text-sm text-gray-500 mt-4">Use /link command in Discord</p>
                        </div>
                    `);
                }
                db.ref(`userEconomy/${discordId}/badges`).once('value').then(snap => {
                    const badges = snap.val() || {};
                    const badgeList = Object.entries(badges).map(([id, timestamp]) => ({ id, timestamp }));
                    const badgeDefs = {
                        first_win:        { emoji: '🎯', name: 'First Win',        desc: 'Won your first game' },
                        blackjack_master:  { emoji: '🃏', name: 'Blackjack Master', desc: '10 blackjack wins' },
                        high_roller:       { emoji: '💎', name: 'High Roller',      desc: 'Bet 1000+ points' },
                        consistent:        { emoji: '📅', name: 'Consistent',       desc: '7 day login streak' },
                        dedicated:         { emoji: '⭐', name: 'Dedicated',        desc: '30 day login streak' },
                        legend:            { emoji: '👑', name: 'Legend',           desc: '100 day login streak' },
                        eternal:           { emoji: '♾️', name: 'Eternal',          desc: '365 day login streak' },
                        lucky_seven:       { emoji: '🎰', name: 'Lucky Seven',      desc: 'Triple 7s on slots' },
                        millionaire:       { emoji: '💰', name: 'Millionaire',      desc: 'Earned 1M points total' }
                    };
                    const listHTML = badgeList.length > 0
                        ? badgeList.map(b => {
                            const def = badgeDefs[b.id] || { emoji: '🏅', name: b.id, desc: 'Unknown achievement' };
                            return `
                                <div class="glass p-4 rounded-3xl flex items-center gap-4 hover:bg-white/10 transition">
                                    <div class="text-5xl">${def.emoji}</div>
                                    <div class="flex-1">
                                        <p class="font-bold">${def.name}</p>
                                        <p class="text-sm text-gray-400">${def.desc}</p>
                                    </div>
                                    <p class="text-xs text-gray-500">${new Date(b.timestamp).toLocaleDateString()}</p>
                                </div>
                            `;
                        }).join('')
                        : `<div class="text-center py-10 text-gray-500 italic">No achievements unlocked yet. Play games to earn badges!</div>`;
                    openModal('Your Achievements', `
                        <div class="space-y-4">
                            <div class="text-center glass p-4 rounded-2xl">
                                <p class="text-gray-400 text-sm">Total Unlocked</p>
                                <p class="text-4xl font-bold text-yellow-400">${badgeList.length}</p>
                            </div>
                            <div class="space-y-3 max-h-[50vh] overflow-y-auto custom-scroll">
                                ${listHTML}
                            </div>
                        </div>
                    `);
                });
            });
        }

        function initPersonalActivityListener() {
            if (!currentUser) return;
            getDiscordIdFromKcUid(currentUser.uid).then(discordId => {
                if (!discordId) return;
                // New achievements
                db.ref(`userEconomy/${discordId}/badges`).on('child_added', snap => {
                    if (Date.now() - snap.val() < 10000) {
                        showToast(`🏆 Achievement Unlocked: ${snap.key}`, 'success', 5000);
                    }
                });
                // Points increases
                let lastPoints = null;
                db.ref(`userEconomy/${discordId}/points`).on('value', snap => {
                    const newPoints = snap.val() || 0;
                    if (lastPoints !== null && newPoints > lastPoints) {
                        showToast(`💰 +${(newPoints - lastPoints).toLocaleString()} points earned!`, 'success', 3000);
                    }
                    lastPoints = newPoints;
                });
            });
        }

        function loadProfileLite() {
            if (!currentUser) return;
            const container = document.getElementById('profile-lite-content');
            container.innerHTML = `<div class="col-span-2 animate-pulse bg-white/5 h-24 rounded-3xl"></div>`;

            Promise.all([
                db.ref(`users/${currentUser.uid}`).once('value'),
                getDiscordIdFromKcUid(currentUser.uid)
            ]).then(([userSnap, discordId]) => {
                const u = userSnap.val() || {};
                const economyPromise = discordId
                    ? db.ref(`userEconomy/${discordId}`).once('value').then(snap => snap.val() || {})
                    : Promise.resolve({});

                economyPromise.then(economy => {
                    const streak = economy.streaks?.login?.current || 0;
                    const points = economy.points || 0;
                    const rank = economy.rank || 'N/A';
                    const badges = Object.keys(economy.badges || {}).length;

                    container.innerHTML = `
                        <div class="glass p-6 rounded-3xl flex items-center gap-4 col-span-2">
                            <img src="${u.avatar || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png'}" class="w-20 h-20 rounded-full border-2 border-white/10">
                            <div class="flex-1">
                                <p class="text-xs text-gray-500 font-black uppercase mb-1">Authenticated As</p>
                                <p class="text-2xl font-bold cursor-pointer hover:underline" style="color:${u.profileCustomization?.nameColor || '#fff'}" onclick="window.openKcProfile && window.openKcProfile('${currentUser.uid}')">${u.displayName || 'Explorer'}</p>
                                ${u.about ? `<p class="text-sm text-gray-400 italic mt-1">"${u.about}"</p>` : ''}
                            </div>
                        </div>
                        <div class="glass p-6 rounded-3xl">
                            <p class="text-xs text-gray-500 font-black uppercase mb-3">KC Badges</p>
                            <div class="space-y-2">
                                <div class="flex justify-between"><span class="text-sm text-gray-400">Overall</span><span class="font-bold text-blue-400">${u.overall || 0}</span></div>
                                <div class="flex justify-between"><span class="text-sm text-gray-400">Offence</span><span class="font-bold text-red-400">${u.offence || 0}</span></div>
                                <div class="flex justify-between"><span class="text-sm text-gray-400">Defence</span><span class="font-bold text-green-400">${u.defence || 0}</span></div>
                            </div>
                        </div>
                        ${discordId ? `
                            <div class="glass p-6 rounded-3xl">
                                <p class="text-xs text-gray-500 font-black uppercase mb-3">Discord Stats</p>
                                <div class="space-y-2">
                                    <div class="flex justify-between"><span class="text-sm text-gray-400">Points</span><span class="font-bold text-blue-400">${points.toLocaleString()}</span></div>
                                    <div class="flex justify-between"><span class="text-sm text-gray-400">Rank</span><span class="font-bold">#${rank}</span></div>
                                    <div class="flex justify-between"><span class="text-sm text-gray-400">Streak</span><span class="font-bold text-orange-400">${streak} 🔥</span></div>
                                    <div class="flex justify-between"><span class="text-sm text-gray-400">Badges</span><span class="font-bold text-purple-400">${badges}</span></div>
                                </div>
                            </div>
                        ` : `
                            <div class="glass p-6 rounded-3xl">
                                <p class="text-xs text-gray-500 font-black uppercase mb-3">Discord Stats</p>
                                <p class="text-sm text-gray-400 italic">Link Discord in bot to see economy stats</p>
                            </div>
                        `}
                        <div class="glass p-6 rounded-3xl">
                            <p class="text-xs text-gray-500 font-black uppercase mb-3">Battledome</p>
                            <div class="space-y-2">
                                <div class="flex justify-between"><span class="text-sm text-gray-400">Highscore</span><span class="font-bold text-red-400">${(u.bdHighscore || 0).toLocaleString()}</span></div>
                            </div>
                        </div>
                        ${u.customBadge ? `
                            <div class="glass p-6 rounded-3xl col-span-2">
                                <p class="text-xs text-gray-500 font-black uppercase mb-3">Custom Badge</p>
                                <div class="flex items-center gap-3">
                                    <span class="text-4xl">${u.customBadge.emoji}</span>
                                    <div>
                                        <p class="font-bold">${u.customBadge.name}</p>
                                        <p class="text-sm text-gray-400">${u.customBadge.description}</p>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    `;
                });
            });
        }

        function loadClipsPreview() {
            db.ref('social_posts').limitToLast(2).once('value').then(snap => {
                let h = '';
                snap.forEach(c => {
                    const p = c.val();
                    h += `<div class="relative bg-black/40 rounded-3xl overflow-hidden aspect-video border border-white/5">
                            ${p.mediaUrl ? `<img src="${p.mediaUrl}" class="w-full h-full object-cover opacity-60">` : ''}
                            <div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid fa-play-circle text-4xl text-white/40"></i></div>
                            <div class="absolute bottom-4 left-4"><p class="text-[10px] font-bold text-white cursor-pointer hover:underline" onclick="window.openKcProfile('${p.createdBy}')">${p.userName}</p></div>
                        </div>`;
                });
                document.getElementById('home-clips-preview').innerHTML = h || '<p class="col-span-2 opacity-20 text-center text-xs">No media found.</p>';
            });
        }

        function openAuthModal() {
            openModal("Lobby Security", `<div class="py-6 text-center space-y-8">
                    <div class="w-20 h-20 rounded-3xl bg-blue-500/10 flex items-center justify-center mx-auto text-blue-500 text-4xl"><i class="fa-solid fa-fingerprint"></i></div>
                    <p class="text-gray-400">Please sign in to the KC Events Network to save progress, participate in clans, and share clips.</p>
                    <a href="https://kcevents.uk/#loginpage" target="_blank" class="block w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-xl transition">LAUNCH AUTH INTERFACE</a>
                </div>`);
        }

        function kcAlert(msg) { openModal("Notification", `<div class="p-10 text-center font-bold">${msg}</div>`); }

        window.onload = () => {
            switchTab('home');
            window.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
        };
    </script>
</body>
</html>
