<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC Modern Auth Bar</title>
    <!-- Tailwind CSS CDN for styling consistency -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
    <!-- Firebase SDKs - using compat versions as in your existing code -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* A few custom styles to match the glass aesthetic */
        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* The main glass container for the auth bar */
        .glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px) saturate(1.8);
            -webkit-backdrop-filter: blur(10px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* The animated skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #374151 0%, #4b5563 50%, #374151 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Keyframe animation for the shimmer effect */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        
        .brand-gradient {
            background-image: linear-gradient(90deg, #1ee57c, #50b2fa);
        }
        
        .brand-text {
            background-image: linear-gradient(90deg, #1ee57c, #50b2fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Gradient ring for the user avatar */
        .gradient-ring {
            border-radius: 50%;
            background: linear-gradient(to bottom right, #1ee57c, #50b2fa);
            padding: 2px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        /* Hover effect for the gradient ring */
        .gradient-ring:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(80, 178, 250, 0.6);
        }

        /* Style for the presence dot */
        .presence-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.5);
        }
        .online {
            background-color: #4ade80;
        }
        .offline {
            background-color: #ef4444;
        }
    </style>
</head>
<body>

    <!-- Auth Bar Container -->
    <div id="authBarContainer" class="fixed top-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl glass-container text-sm text-gray-200 shadow-xl z-50 transition-all duration-300 min-w-[360px] md:min-w-[400px]">
        <!-- Initial skeleton loading state -->
        <div id="loading" class="flex items-center justify-center gap-2">
            <div class="h-6 w-24 rounded-full skeleton"></div>
            <div class="h-6 w-24 rounded-full skeleton"></div>
        </div>
        <!-- This content will be replaced by JS when authenticated -->
    </div>
    
    <!-- Login/Register Pop-up -->
    <div id="authModal" class="fixed inset-0 hidden flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm z-50">
        <div class="w-full max-w-sm p-6 rounded-2xl glass-container shadow-xl">
            <button id="closeAuthModal" class="absolute top-4 right-4 text-white text-2xl opacity-70 hover:opacity-100 transition-opacity">&times;</button>
            <h2 class="text-2xl font-bold text-center mb-6 brand-text">Account</h2>
            <div class="flex justify-center mb-6 gap-2">
                <button id="showLoginBtn" class="px-4 py-2 text-white font-semibold relative transition-all hover:scale-105 active:scale-95">Log In<span class="absolute bottom-0 left-0 w-full h-[2px] brand-gradient rounded-full opacity-0 scale-x-0 transition-all duration-300"></span></button>
                <button id="showRegisterBtn" class="px-4 py-2 text-white font-semibold relative transition-all hover:scale-105 active:scale-95">Sign Up<span class="absolute bottom-0 left-0 w-full h-[2px] brand-gradient rounded-full opacity-0 scale-x-0 transition-all duration-300"></span></button>
            </div>
            <form id="loginForm" class="flex flex-col gap-4">
                <input id="loginEmail" type="email" placeholder="Email" required class="p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-300"/>
                <input id="loginPass" type="password" placeholder="Password" required class="p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-300"/>
                <button id="loginBtn" type="submit" class="p-4 rounded-xl text-white font-bold brand-gradient transition-all hover:scale-105 active:scale-95 shadow-lg shadow-green-500/30">Log In</button>
            </form>
            <form id="registerForm" class="hidden flex-col gap-4">
                <input id="regName" placeholder="Display Name" required class="p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-300"/>
                <input id="regEmail" type="email" placeholder="Email" required class="p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-300"/>
                <input id="regPass" type="password" placeholder="Password" required class="p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-300"/>
                <button id="registerBtn" type="submit" class="p-4 rounded-xl text-white font-bold brand-gradient transition-all hover:scale-105 active:scale-95 shadow-lg shadow-green-500/30">Sign Up</button>
            </form>
        </div>
    </div>
    
    <!-- This part of the code is not interactive and only for display -->

    <script>
        // --- Init Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
            authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
            databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kckillerscompany-ab1ec",
            storageBucket: "kckillerscompany-ab1ec.firebasestorage.app",
            messagingSenderId: "198711213988",
            appId: "1:198711213988:web:f3cacc413ac9e80dd8cb31",
            measurementId: "G-4LKP2M3JXE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        const authBarContainer = document.getElementById('authBarContainer');
        const loadingSpinner = document.getElementById('loading');
        
        // --- Greeting function ---
        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return 'Good morning';
            if (hour < 18) return 'Good afternoon';
            return 'Good evening';
        }

        // --- Discord helper: get Discord ID from KC UID ---
        async function getDiscordIdFromKcUid(kcUid) {
            try {
                const linksSnap = await db.ref('discordLinks').once('value');
                const links = linksSnap.val() || {};
                for (const [discordId, data] of Object.entries(links)) {
                    if (data.uid === kcUid) return discordId;
                }
            } catch (e) {}
            return null;
        }

        // --- Auth State Listener (main logic) ---
        auth.onAuthStateChanged(user => {
            // First, remove the loading skeleton
            loadingSpinner.classList.add('hidden');

            if (user) {
                // Fetch the current user's data once, then listen for changes
                db.ref(`users/${user.uid}`).on('value', async snap => {
                    const userData = snap.val() || {};
                    const name = userData.displayName || user.displayName || user.email;
                    const avatarUrl = userData.avatar || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
                    const hasCustomization = userData.profileCustomizationUnlocked;
                    const customGradient = hasCustomization && userData.profileCustomization?.gradient;
                    const isVerified = !!user.emailVerified;

                    // Apply custom gradient to the entire container if available
                    if (customGradient) {
                        authBarContainer.style.background = customGradient;
                        authBarContainer.classList.remove('glass-container');
                    } else {
                        authBarContainer.style.background = '';
                        authBarContainer.classList.add('glass-container');
                    }

                    const gradientRingStyle = customGradient ? `background: ${customGradient};` : `background: linear-gradient(to bottom right, #1ee57c, #50b2fa);`;
                    const usernameColorStyle = hasCustomization && userData.profileCustomization?.nameColor ? `style="color: ${userData.profileCustomization.nameColor}"` : '';

                    let badgesHtml = '';
                    if(isVerified) badgesHtml += `<span class="text-xs ml-1" title="Verified">✔️</span>`;
                    if(userData.codesUnlocked?.diamond) badgesHtml += `<span class="text-xs ml-1" title="Diamond User">💎</span>`;
                    if(userData.badges?.offence > 0) badgesHtml += `<span class="text-xs ml-1" title="Best Offence">🔥</span>`;
                    if(userData.badges?.defence > 0) badgesHtml += `<span class="text-xs ml-1" title="Best Defence">🛡️</span>`;
                    if(userData.badges?.overall > 0) badgesHtml += `<span class="text-xs ml-1" title="Overall Winner">🏆</span>`;

                    authBarContainer.innerHTML = `
                        <div class="flex items-center gap-2">
                            <a href="https://kcevents.uk/#loginpage" target="_blank" class="flex items-center gap-2">
                                <span class="relative">
                                    <span class="gradient-ring" style="${gradientRingStyle}">
                                        <img src="${avatarUrl}" alt="User Avatar" class="w-8 h-8 rounded-full border-2 border-gray-800 object-cover">
                                    </span>
                                    <span class="presence-dot ${navigator.onLine ? 'online' : 'offline'}"></span>
                                </span>
                                <div class="flex flex-col items-start min-w-0">
                                    <span class="text-white text-xs opacity-70">${getGreeting()},</span>
                                    <div class="flex items-center gap-2">
                                        <span class="text-white text-base font-semibold truncate max-w-xs" ${usernameColorStyle}>${name}</span>
                                        ${badgesHtml}
                                        <span id="authStreakBadge" class="text-xs text-yellow-300 hidden"></span>
                                    </div>
                                </div>
                            </a>
                            <a href="#" id="signOutLink" class="text-red-400 text-sm ml-auto">Sign Out</a>
                        </div>
                    `;
                    document.getElementById('signOutLink').onclick = (e) => {
                        e.preventDefault();
                        auth.signOut();
                    };

                    // Async: load Discord streak and update badge
                    try {
                        const discordId = await getDiscordIdFromKcUid(user.uid);
                        if (discordId) {
                            const streakSnap = await db.ref(`userEconomy/${discordId}/streaks/login/current`).once('value');
                            const streak = streakSnap.val() || 0;
                            const streakEl = document.getElementById('authStreakBadge');
                            if (streakEl && streak > 0) {
                                streakEl.textContent = `🔥 ${streak}`;
                                streakEl.title = `${streak} day login streak`;
                                streakEl.classList.remove('hidden');
                            }
                        }
                    } catch (e) {}
                });
            } else {
                authBarContainer.innerHTML = `
                    <a href="https://kcevents.uk/#loginpage" target="_blank" class="px-4 py-2 rounded-xl text-white font-semibold transition-all hover:scale-105 active:scale-95 brand-gradient shadow-lg mx-auto">
                        Log In / Sign Up
                    </a>
                `;
                // Ensure the container reverts to default styles when logged out
                authBarContainer.style.background = '';
                authBarContainer.classList.add('glass-container');
            }
        });
    </script>
</body>
</html>
