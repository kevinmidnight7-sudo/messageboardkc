<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC Auth Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #fbbf24;
            --accent-rgb: 251, 191, 36;
            --accent2: #f59e0b;
        }

        html, body {
            height: 86px;
            max-height: 86px;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* ── Main bar ── */
        #kc-authbar {
            position: fixed;
            top: 7px; left: 10px; right: 10px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 0;
            z-index: 9999;
            background: rgba(4, 5, 12, 0.94);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border-radius: 16px;
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        /* Gradient bar theme overlay */
        #kc-bar-accent-line {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2.5px;
            border-radius: 0 0 16px 16px;
            background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb), 0.9) 50%, transparent 100%);
            transition: background 0.4s;
        }

        /* ── Nav ── */
        #kc-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .kc-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: rgba(255,255,255,0.72);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        .kc-nav-item i {
            font-size: 1.1rem;
            transition: transform 0.2s;
            pointer-events: none;
        }
        .kc-nav-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: radial-gradient(circle at 50% 120%, rgba(var(--accent-rgb), 0.18) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.25s;
        }
        .kc-nav-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.22);
            box-shadow: 0 0 18px rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        .kc-nav-item:hover::before { opacity: 1; }
        .kc-nav-item:hover i { transform: scale(1.15); }
        .kc-nav-item.active {
            color: #fff;
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 22px rgba(255,255,255,0.12);
        }

        /* ── Right: profile area ── */
        #kc-profile-area {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        /* Profile pill container */
        .kc-profile-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(var(--accent-rgb), 0.07);
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            border-radius: 50px;
            padding: 5px 14px 5px 6px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .kc-profile-pill:hover {
            background: rgba(var(--accent-rgb), 0.11);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.18);
        }

        /* Avatar wrapper */
        #kc-avatar-ring {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        #kc-avatar-ring:hover {
            box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.55);
            transform: scale(1.06);
        }
        #kc-avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }

        /* Online dot */
        #kc-online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            border: 2px solid rgba(8, 14, 24, 0.9);
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
        }

        /* User info */
        #kc-user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        #kc-greeting {
            font-size: 0.6rem;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        #kc-username-row {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap;
        }
        #kc-username {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
            letter-spacing: -0.01em;
        }
        .kc-badge-icon {
            font-size: 0.7rem;
            flex-shrink: 0;
            line-height: 1;
        }
        .kc-badge-icon.verified { color: #60a5fa; }
        .kc-badge-icon.diamond  { color: #a5f3fc; filter: drop-shadow(0 0 4px rgba(165,243,252,0.6)); }

        /* Streak */
        #kc-streak {
            font-size: 0.66rem;
            font-weight: 800;
            color: #fb923c;
            display: none;
            align-items: center;
            gap: 3px;
            background: rgba(251,146,60,0.12);
            border: 1px solid rgba(251,146,60,0.25);
            border-radius: 99px;
            padding: 1px 7px;
        }

        /* Sign out */
        #kc-signout {
            font-size: 0.68rem;
            font-weight: 700;
            color: #475569;
            background: none;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 5px 10px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        #kc-signout:hover {
            color: #f87171;
            border-color: rgba(248,113,113,0.3);
            background: rgba(248,113,113,0.08);
        }

        /* Guest CTA */
        #kc-guest-cta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .kc-cta-btn {
            font-size: 0.8rem;
            font-weight: 800;
            border-radius: 12px;
            padding: 8px 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.03em;
        }
        .kc-cta-btn.primary {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #1a1100;
            box-shadow: 0 4px 18px rgba(251,191,36,0.4);
        }
        .kc-cta-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(251,191,36,0.65); }
        .kc-cta-btn.secondary {
            background: rgba(255,255,255,0.06);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .kc-cta-btn.secondary:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

        /* Skeleton */
        .kc-skeleton {
            background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }

        /* Gradient theme bar overlay */
        #kc-authbar.themed {
            border-bottom-color: transparent;
        }
        #kc-authbar.themed #kc-bar-accent-line {
            height: 2px;
        }
        #kc-authbar.themed .kc-profile-pill {
            background: rgba(0, 0, 0, 0.30);
            border-color: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        #kc-authbar.themed .kc-profile-pill:hover {
            background: rgba(0, 0, 0, 0.40);
        }

        /* KC badge images (offence/defence/overall) */
        .kc-badge-img {
            width: 15px;
            height: 15px;
            object-fit: contain;
            vertical-align: middle;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            #kc-logo-text { display: none; }
            .kc-nav-item span { display: none; }
            .kc-nav-item { padding: 8px 12px; }
            #kc-greeting { display: none; }
            #kc-username { max-width: 90px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            #kc-logo { margin-right: 8px; }
            #kc-profile-area { margin-left: 8px; gap: 8px; }
            .kc-nav-item { padding: 8px 9px; }
        }
    </style>
</head>
<body>

<div id="kc-authbar">
    <div id="kc-bar-accent-line"></div>

    <!-- Logo -->
    <a href="https://kcevents.uk/#" id="kc-logo" target="_top" style="flex-shrink:0;display:flex;align-items:center;margin-right:28px;text-decoration:none;">
        <img id="kc-logo-img" src="https://kevinmidnight7-sudo.github.io/messageboardkc/kcevents.png" alt="KC" style="width:38px;height:38px;object-fit:contain;transition:opacity 0.3s;">
    </a>

    <!-- Nav -->
    <nav id="kc-nav">
        <a href="https://kcevents.uk/#" class="kc-nav-item" target="_top" data-page="">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="https://kcevents.uk/#clans" class="kc-nav-item" target="_top" data-page="clans">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Clans</span>
        </a>
        <a href="https://kcevents.uk/#socialfeed" class="kc-nav-item" target="_top" data-page="socialfeed">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Clips</span>
        </a>
        <a href="https://kcevents.uk/#votingscroll" class="kc-nav-item" target="_top" data-page="votingscroll">
            <i class="fa-solid fa-square-poll-vertical"></i>
            <span>Vote</span>
        </a>
        <a href="https://kcevents.uk/#lastevent" class="kc-nav-item" target="_top" data-page="lastevent">
            <i class="fa-solid fa-ranking-star"></i>
            <span>Leaderboard</span>
        </a>
    </nav>

    <!-- Right: auth state -->
    <div id="kc-profile-area">
        <!-- Skeleton -->
        <div id="kc-loading" class="kc-profile-pill" style="gap:10px;">
            <div class="kc-skeleton" style="width:42px;height:42px;border-radius:50%;flex-shrink:0;"></div>
            <div style="display:flex;flex-direction:column;gap:5px;">
                <div class="kc-skeleton" style="width:60px;height:7px;border-radius:4px;"></div>
                <div class="kc-skeleton" style="width:90px;height:10px;border-radius:4px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBHKsULqmWPFaU7bNXDp6pBZHO4p9ZiUUo",
        authDomain: "kckillerscompany-ab1ec.firebaseapp.com",
        databaseURL: "https://kckillerscompany-ab1ec-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kckillerscompany-ab1ec",
        storageBucket: "kckillerscompany-ab1ec.firebasestorage.app",
        messagingSenderId: "198711213988",
        appId: "1:198711213988:web:f3cacc413ac9e80dd8cb31",
        measurementId: "G-4LKP2M3JXE"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();

    const bar = document.getElementById('kc-authbar');
    const profileArea = document.getElementById('kc-profile-area');

    function getGreeting() {
        const h = new Date().getHours();
        if (h < 12) return 'Good morning';
        if (h < 18) return 'Good afternoon';
        return 'Good evening';
    }

    // Extract a hex/rgb color from a gradient string for accent
    function extractAccentFromGradient(grad) {
        if (!grad) return null;
        const match = grad.match(/#[0-9a-fA-F]{6}|#[0-9a-fA-F]{3}|rgb\([^)]+\)/);
        return match ? match[0] : null;
    }

    // Convert hex to "r,g,b" for CSS var
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return `${r},${g},${b}`;
    }

    function setAccent(color) {
        if (!color) { color = '#fbbf24'; }
        document.documentElement.style.setProperty('--accent', color);
        document.documentElement.style.setProperty('--accent2', color);
        if (color.startsWith('#') && color.length >= 7) {
            document.documentElement.style.setProperty('--accent-rgb', hexToRgb(color));
        }
    }

    // Try to mark active nav item from parent page hash
    try {
        const hash = (window.top.location.hash || '').replace('#','');
        document.querySelectorAll('.kc-nav-item').forEach(a => {
            if (a.dataset.page === hash) a.classList.add('active');
        });
    } catch(e) {}

    async function getDiscordId(uid) {
        try {
            const s = await db.ref(`users/${uid}/discordId`).once('value');
            if (s.val()) return s.val();
        } catch(e) {}
        return null;
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            db.ref(`users/${user.uid}`).once('value').then(async snap => {
                const u = snap.val() || {};
                const name = u.displayName || user.displayName || user.email || 'KC Member';
                const avatar = u.avatar || 'https://kevinmidnight7-sudo.github.io/messageboardkc/1.png';
                const hasCust = !!u.profileCustomizationUnlocked;
                const gradient = hasCust && u.profileCustomization?.gradient || null;
                const nameColor = hasCust && u.profileCustomization?.nameColor || null;
                const isVerified = !!user.emailVerified;
                const isDiamond = !!(u.codesUnlocked?.diamond);

                // Set accent color
                const accent = nameColor || extractAccentFromGradient(gradient) || '#fbbf24';
                setAccent(accent);

                // Logo: white when user has gradient, normal otherwise
                const logoImg = document.getElementById('kc-logo-img');
                if (logoImg && gradient) {
                    logoImg.src = 'https://kevinmidnight7-sudo.github.io/messageboardkc/kclogowhite.png';
                }

                // Apply gradient theme to bar
                if (gradient) {
                    bar.classList.add('themed');
                    document.getElementById('kc-bar-accent-line').style.background = gradient;
                    bar.style.background = gradient;
                    bar.style.borderBottomColor = 'transparent';
                } else if (nameColor && nameColor.startsWith('#')) {
                    bar.style.borderBottomColor = `rgba(${hexToRgb(nameColor)},0.28)`;
                }

                // Avatar ring gradient
                const ringGrad = gradient || `linear-gradient(135deg, ${accent}, #f59e0b)`;

                // Build badges row
                let badgesHtml = '';
                if (isVerified) badgesHtml += `<i class="fa-solid fa-circle-check kc-badge-icon verified" title="Verified"></i>`;
                if (isDiamond)  badgesHtml += `<i class="fa-solid fa-gem kc-badge-icon diamond" title="Diamond Member"></i>`;
                if ((u.badges?.offence||0) > 0) badgesHtml += `<img src="https://kevinmidnight7-sudo.github.io/messageboardkc/red.png" class="kc-badge-img" title="Best Offence">`;
                if ((u.badges?.defence||0) > 0) badgesHtml += `<img src="https://kevinmidnight7-sudo.github.io/messageboardkc/blue.png" class="kc-badge-img" title="Best Defence">`;
                if ((u.badges?.overall||0) > 0) badgesHtml += `<img src="https://kevinmidnight7-sudo.github.io/messageboardkc/kcevents.png" class="kc-badge-img" title="Overall Winner">`;

                profileArea.innerHTML = `
                    <div class="kc-profile-pill">
                        <a href="https://kcevents.uk/#loginpage" target="_top" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                            <div id="kc-avatar-ring" style="background:${ringGrad};">
                                <img src="${avatar}" alt="Avatar" onerror="this.src='https://kevinmidnight7-sudo.github.io/messageboardkc/1.png'">
                                <div id="kc-online-dot"></div>
                            </div>
                            <div id="kc-user-info">
                                <div id="kc-greeting">${getGreeting()}</div>
                                <div id="kc-username-row">
                                    <span id="kc-username" style="${nameColor ? `color:${nameColor}` : ''}">${name}</span>
                                    ${badgesHtml}
                                    <div id="kc-streak" style="display:none;">
                                        <i class="fa-solid fa-fire"></i><span id="kc-streak-val"></span>
                                    </div>
                                </div>
                            </div>
                        </a>
                        <button id="kc-signout"><i class="fa-solid fa-arrow-right-from-bracket" style="font-size:0.7rem;"></i></button>
                    </div>
                `;

                document.getElementById('kc-signout').addEventListener('click', () => auth.signOut());

                // Load streak async
                try {
                    const did = await getDiscordId(user.uid);
                    if (did) {
                        const ss = await db.ref(`userEconomy/${did}/streaks/login/current`).once('value');
                        const streak = ss.val() || 0;
                        if (streak > 0) {
                            const el = document.getElementById('kc-streak');
                            const val = document.getElementById('kc-streak-val');
                            if (el && val) { val.textContent = streak; el.style.display = 'flex'; }
                        }
                    }
                } catch(e) {}
            });
        } else {
            setAccent('#fbbf24');
            profileArea.innerHTML = `
                <div id="kc-guest-cta" class="kc-profile-pill" style="gap:8px;">
                    <a href="https://kcevents.uk/#loginpage" class="kc-cta-btn secondary" target="_top">Sign In</a>
                    <a href="https://kcevents.uk/#loginpage" class="kc-cta-btn primary" target="_top">
                        <i class="fa-solid fa-user-plus"></i> Sign Up
                    </a>
                </div>
            `;
        }
    });
</script>
</body>
</html>
